<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UNDERTALE: THE COUNCIL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');
        body { background: #000; color: #fff; font-family: 'Courier Prime', monospace; margin: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
        
        #loading-screen { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .heart-load { width: 30px; height: 30px; background: red; clip-path: path('M15,30 A10,10 0,0,1 25,20 A10,10 0,0,1 35,20 L25,35 Z'); transform: scale(3); animation: beat 0.8s infinite; }
        @keyframes beat { 0% { transform: scale(3); } 50% { transform: scale(3.5); } 100% { transform: scale(3); } }

        #menu { display: none; text-align: center; }
        .title { font-size: 60px; letter-spacing: 15px; margin-bottom: 50px; }
        .option { font-size: 30px; margin: 20px; display: flex; align-items: center; justify-content: center; }
        .option.active { color: #ffff00; } /* Yellow selection */
        .heart-cursor { width: 20px; height: 20px; background: red; margin-right: 20px; visibility: hidden; clip-path: path('M10,30 A5,5 0,0,1 20,30 A5,5 0,0,1 30,30 L20,40 Z'); transform: scale(2); }
        .active .heart-cursor { visibility: visible; }
    </style>
</head>
<body>

    <div id="loading-screen"><div class="heart-load"></div></div>

    <div id="menu">
        <div class="title">UNDERTALE</div>
        <div id="main-list">
            <div class="option active" data-action="start"><div class="heart-cursor"></div> START</div>
            <div class="option" data-action="none"><div class="heart-cursor"></div> SETTINGS</div>
        </div>
        <div id="teammate-list" style="display:none;">
            <div style="font-size: 18px; margin-bottom: 20px;">CHOOSE YOUR TEAMMATE</div>
            <div class="option active" data-char="FRISK"><div class="heart-cursor"></div> FRISK</div>
            <div class="option" data-char="CHARA"><div class="heart-cursor"></div> CHARA</div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('menu').style.display = 'block';
        }, 2000);

        let view = "main";
        let idx = 0;

        window.onkeydown = (e) => {
            const list = view === "main" ? document.querySelectorAll('#main-list .option') : document.querySelectorAll('#teammate-list .option');
            if(e.key === 'ArrowDown') idx = (idx + 1) % list.length;
            if(e.key === 'ArrowUp') idx = (idx + list.length - 1) % list.length;

            list.forEach((opt, i) => opt.classList.toggle('active', i === idx));

            if(e.key === 'z' || e.key === 'Z') {
                if(view === "main") {
                    view = "team"; idx = 0;
                    document.getElementById('main-list').style.display = 'none';
                    document.getElementById('teammate-list').style.display = 'block';
                } else {
                    sessionStorage.setItem('team', list[idx].dataset.char);
                    location.href = 'UTpaciSANS.html';
                }
            }
        };
    </script>
</body>
</html>
