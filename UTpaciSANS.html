<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PAPYRUS ENCOUNTER - DUSTTRUST</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        /* --- GLOBAL & LAYOUT --- */
        body {
            margin: 0; padding: 0; background-color: #000; color: #fff;
            font-family: 'VT323', monospace; display: flex; justify-content: center;
            align-items: center; height: 100vh; overflow: hidden; user-select: none;
        }

        #game-container {
            width: 800px; height: 600px; position: relative;
            background: #050510; border: 2px solid #222; overflow: hidden;
            transition: background 1s ease;
        }

        /* --- BACKGROUND PHASES --- */
        .bg-forest { background: linear-gradient(to bottom, #050510, #111122) !important; }
        .bg-chains { 
            background: repeating-linear-gradient(45deg, #0a001a, #0a001a 20px, #1a0033 20px, #1a0033 40px) !important; 
        }
        .bg-red { 
            background: radial-gradient(circle, #880000 0%, #220000 100%) !important; 
            animation: pulseBg 2s infinite;
        }
        @keyframes pulseBg {
            0% { background-size: 100% 100%; }
            50% { background-size: 110% 110%; }
            100% { background-size: 100% 100%; }
        }

        /* --- PAPYRUS SPRITE (CSS ART) --- */
        #sprite-layer {
            position: absolute; top: 40px; left: 0; width: 100%; height: 260px;
            display: flex; justify-content: center; align-items: flex-end;
        }

        #papyrus {
            width: 140px; height: 200px; position: relative;
            /* Placeholder body mimicking the hoodie */
            background: 
                radial-gradient(circle at 50% 30%, #fff 15px, transparent 16px), /* Smile teeth */
                radial-gradient(ellipse at 50% 20%, #000 35px, transparent 36px), /* Dark Face */
                radial-gradient(circle at 50% 25%, #ccc 50px, transparent 51px), /* Hood */
                linear-gradient(#ccc, #ccc) 50% 70% / 80px 70px no-repeat, /* Chest */
                linear-gradient(#444, #444) 35% 100% / 20px 40px no-repeat, /* Leg L */
                linear-gradient(#444, #444) 65% 100% / 20px 40px no-repeat; /* Leg R */
            filter: drop-shadow(0px 0px 5px #000);
            transition: transform 0.1s, filter 0.5s;
        }

        #paps-eye {
            position: absolute; top: 35px; left: 80px; width: 8px; height: 8px;
            background: #ff8c00; border-radius: 50%; box-shadow: 0 0 10px #ff8c00;
            display: none; /* Shown in later phases */
        }

        /* --- DIALOGUE BUBBLES --- */
        #dialogue-bubble {
            position: absolute; top: 30px; right: 120px; width: 220px;
            background: white; color: black; border-radius: 10px; padding: 15px 20px;
            font-size: 26px; line-height: 1.1; display: none; z-index: 10;
        }
        #dialogue-bubble::after {
            content: ''; position: absolute; top: 50%; left: -10px;
            border-width: 10px 10px 10px 0; border-style: solid;
            border-color: transparent white transparent transparent;
        }

        /* --- BATTLE BOX --- */
        #battle-box-container {
            position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%);
            width: 650px; height: 180px; border: 5px solid white; background: black;
            box-sizing: border-box; transition: width 0.3s, height 0.3s;
        }
        #battle-canvas { display: block; width: 100%; height: 100%; }

        #text-box-content {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 20px 30px; box-sizing: border-box; font-size: 32px;
            color: white; line-height: 1.3; display: block;
        }

        .menu-col { width: 50%; float: left; }
        .act-option { cursor: pointer; color: #aaa; margin-bottom: 10px; }
        .act-option.selected { color: #fff; }

        /* --- HUD --- */
        #hud {
            position: absolute; bottom: 65px; left: 50%; transform: translateX(-50%);
            width: 650px; display: flex; align-items: center; font-size: 28px; font-weight: bold;
        }
        .hud-name { margin-right: 30px; }
        .hud-lv { margin-right: 40px; color: #fff; transition: color 0.2s; }
        .hud-hp-label { font-size: 18px; margin-right: 10px; }
        .hp-bar-bg { width: 60px; height: 24px; background: red; margin-right: 15px; }
        .hp-bar-fill { height: 100%; background: #ffff00; width: 100%; transition: width 0.2s; }
        .hud-hp-text { font-size: 28px; }

        /* --- BUTTONS --- */
        #buttons {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            width: 680px; display: flex; justify-content: space-between;
        }
        .btn {
            width: 180px; height: 45px; border: 3px solid #ff8c00; color: #ff8c00;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; position: relative; transition: 0.1s;
        }
        .btn.active { background: #ff8c00; color: black; border-color: #ff8c00; }
        .btn.locked { border-color: #444 !important; color: #444 !important; }
        
        .soul-icon { display: none; position: absolute; left: 10px; color: #00ffff; font-size: 24px; }
        .btn.active .soul-icon { display: block; }

        /* --- OVERLAYS --- */
        .shake { animation: shake 0.4s; }
        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            20% { transform: translate(-2px, -2px); }
            40% { transform: translate(-2px, 2px); }
            60% { transform: translate(2px, -2px); }
            100% { transform: translate(0px, 0px); }
        }

        #game-over {
            position: absolute; inset: 0; background: black; z-index: 100;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }

        #cutscene-layer {
            position: absolute; inset: 0; background: black; z-index: 200;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }

        /* The Sad Silhouette Art */
        .silhouette {
            width: 300px; height: 300px;
            background: 
                radial-gradient(circle at 40% 60%, #ccc 40px, transparent 41px), /* Sans Head */
                radial-gradient(ellipse at 50% 80%, #aaa 80px, transparent 81px), /* Sans Body */
                radial-gradient(circle at 60% 40%, #222 50px, transparent 51px), /* Paps Head */
                radial-gradient(ellipse at 70% 60%, #111 70px, transparent 71px); /* Paps Body */
            opacity: 0; transition: opacity 2s;
        }
    </style>
</head>
<body>

<div id="game-container" class="bg-forest">
    
    <div id="sprite-layer">
        <div id="papyrus"><div id="paps-eye"></div></div>
        <div id="dialogue-bubble">...</div>
    </div>

    <div id="battle-box-container">
        <div id="text-box-content">
            * we don't have to fight.<br>* there must be another way!
        </div>
        <canvas id="battle-canvas" width="640" height="170" style="display:none;"></canvas>
    </div>

    <div id="hud">
        <div class="hud-name">SANS</div>
        <div class="hud-lv" id="hud-lv-text">LV 1</div>
        <div class="hud-hp-label">HP</div>
        <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp-fill"></div></div>
        <div class="hud-hp-text" id="hp-text">20 / 20</div>
    </div>

    <div id="buttons">
        <div class="btn" id="btn-0"><span class="soul-icon">💙</span>FIGHT</div>
        <div class="btn active" id="btn-1"><span class="soul-icon">💙</span>ACT</div>
        <div class="btn" id="btn-2"><span class="soul-icon">💙</span>ITEM</div>
    </div>

    <div id="game-over">
        <h1 style="font-size: 80px; letter-spacing: 5px; margin: 0;">GAME OVER</h1>
        <p style="font-size: 30px; color: #aaa; margin-top: 30px;" id="go-text">"I'M SORRY, SANS. IT HAD TO BE DONE."</p>
        <button onclick="location.reload()" style="margin-top:40px; font-size: 24px; padding:10px; background:none; color:white; border: 2px solid white; cursor:pointer; font-family: inherit;">STAY DETERMINED</button>
    </div>

    <div id="cutscene-layer">
        <div class="silhouette" id="ending-art"></div>
        <p style="font-size: 40px; color: white; margin-top: 40px; opacity: 0; transition: opacity 2s;" id="ending-text">...i'm so sorry, brother.</p>
    </div>

</div>

<script>
    // --- CORE VARIABLES ---
    const canvas = document.getElementById('battle-canvas');
    const ctx = canvas.getContext('2d');
    const gameContainer = document.getElementById('game-container');
    const textBox = document.getElementById('text-box-content');
    const bubble = document.getElementById('dialogue-bubble');
    const buttons = [document.getElementById('btn-0'), document.getElementById('btn-1'), document.getElementById('btn-2')];
    
    // Player Stats
    let maxHp = 20, hp = 20, lv = 1;
    let invulnFrames = 0;
    let items = ["Taco", "Taco"];

    // Flow State
    let state = "MENU"; // MENU, ACT_MENU, TYPING, DIALOGUE, ATTACK, GAMEOVER, CUTSCENE
    let menuIndex = 1; 
    let actIndex = 0;
    let turnCount = 0;
    let finalPhaseReady = false;

    // Physics (BLUE SOUL)
    let soul = { x: 320, y: 150, w: 14, h: 14, vx: 0, vy: 0 };
    const GRAVITY = 0.45;
    const JUMP_POWER = -7.5;
    const SPEED = 4.5;
    const FLOOR_Y = 150;

    let keys = {};
    window.addEventListener('keydown', e => { keys[e.code] = true; handleInput(e.code); });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    // Attack Data
    let entities = []; // Bones & Blasters
    let attackTimer = 0;
    let currentAttackDuration = 0;

    // Narrative Arrays
    const actOptions = [
        "PAPYRUS! YOU DON'T HAVE TO DO THIS!",
        "WHY YOU KILLED THEM ALL?",
        "I BELIEVE YOU CAN STILL CHANGE!"
    ];

    const script = [
        { // Turn 1 (Forest)
            paps: "YOU DON'T UNDERSTAND.\nTHE HUMAN WILL RUIN EVERYTHING.", bg: "bg-forest",
            attack: phase1Attack
        },
        { // Turn 2 (Forest)
            paps: "IT WAS THE ONLY WAY TO STOP THEM.\nI NEED THE L.V.", bg: "bg-forest",
            attack: phase2Attack
        },
        { // Turn 3 (Chains)
            paps: "I'M DOING THIS FOR OUR OWN GOOD!\nFIGHT BACK, SANS!", bg: "bg-chains",
            attack: phase3Attack
        },
        { // Turn 4 (Red Phase)
            paps: "JUST GIVE UP AND LET ME FINISH THIS!!", bg: "bg-red",
            attack: phase4Attack
        }
    ];

    // --- INPUT HANDLING ---
    function handleInput(key) {
        if (state === "MENU") {
            if (key === 'ArrowLeft' && !finalPhaseReady) {
                buttons[menuIndex].classList.remove('active');
                menuIndex = (menuIndex - 1 + buttons.length) % buttons.length;
                buttons[menuIndex].classList.add('active');
            }
            if (key === 'ArrowRight' && !finalPhaseReady) {
                buttons[menuIndex].classList.remove('active');
                menuIndex = (menuIndex + 1) % buttons.length;
                buttons[menuIndex].classList.add('active');
            }
            if (key === 'Enter' || key === 'KeyZ') {
                if(finalPhaseReady && menuIndex === 0) triggerFinalEnding();
                else executeMainMenu();
            }
        } 
        else if (state === "ACT_MENU") {
            if (key === 'ArrowUp' && actIndex > 0) {
                actIndex--; updateActMenu();
            }
            if (key === 'ArrowDown' && actIndex < actOptions.length - 1) {
                actIndex++; updateActMenu();
            }
            if (key === 'Enter' || key === 'KeyZ') {
                let chosenText = actOptions[actIndex];
                typeText(`* you yell to him: \n"${chosenText}"`);
            }
            if (key === 'ShiftRight' || key === 'KeyX') {
                state = "MENU";
                textBox.innerHTML = "* we don't have to fight.<br>* there must be another way!";
            }
        }
        else if (state === "TYPING") {
            if (key === 'Enter' || key === 'KeyZ') {
                startEnemyTurn();
            }
        }
    }

    function executeMainMenu() {
        if (menuIndex === 0) { // FIGHT
            typeText("* you can't bring yourself to strike your brother.");
        } else if (menuIndex === 1) { // ACT
            state = "ACT_MENU";
            actIndex = 0;
            updateActMenu();
        } else if (menuIndex === 2) { // ITEM
            if (items.length > 0) {
                items.pop();
                heal(15);
                typeText(`* you hastily ate a taco. \n* you recovered HP.`);
            } else {
                typeText("* you have no items left.");
            }
        }
    }

    function updateActMenu() {
        let html = '<div style="float:left; width:100%;">';
        actOptions.forEach((opt, idx) => {
            let prefix = (idx === actIndex) ? "<span style='color:cyan'>❤</span> " : "&nbsp;&nbsp;";
            let color = (idx === actIndex) ? "#fff" : "#aaa";
            html += `<div style="color:${color}; margin-bottom:10px;">${prefix}${opt}</div>`;
        });
        html += '</div>';
        textBox.innerHTML = html;
    }

    function typeText(text) {
        state = "TYPING";
        textBox.innerHTML = '';
        let i = 0;
        let interval = setInterval(() => {
            if(state !== "TYPING") { clearInterval(interval); return; } // interrupted
            textBox.innerHTML = text.substring(0, i).replace(/\n/g, '<br>');
            i++;
            if (i > text.length) clearInterval(interval);
        }, 30);
    }

    // --- COMBAT & PHASES ---
    function startEnemyTurn() {
        state = "DIALOGUE";
        textBox.style.display = 'none';
        
        let phase = turnCount;
        
        // Trigger Ending condition
        if (turnCount >= script.length) {
            triggerForcedFight();
            return;
        }

        let phaseData = script[phase];
        gameContainer.className = phaseData.bg;
        
        // Eye effect
        if(phase >= 2) document.getElementById('paps-eye').style.display = "block";

        bubble.style.display = 'block';
        bubble.innerText = phaseData.paps;

        setTimeout(() => {
            bubble.style.display = 'none';
            state = "ATTACK";
            canvas.style.display = 'block';
            soul.x = 320; soul.y = FLOOR_Y; soul.vx = 0; soul.vy = 0;
            entities = [];
            attackTimer = 0;
            phaseData.attack();
        }, 2500);
    }

    // --- ATTACK GENERATORS ---
    function spawnBone(x, y, w, h, vx, vy, isBlue) {
        entities.push({ x, y, w, h, vx, vy, isBlue, type: 'bone' });
    }

    function spawnBlaster(x, warnTime, fireTime) {
        entities.push({ x: x, y: 0, w: 40, h: 170, timer: 0, warnTime, fireTime, type: 'blaster' });
    }

    function phase1Attack() {
        currentAttackDuration = 350;
        for(let i=0; i<8; i++) {
            spawnBone(640 + (i*120), FLOOR_Y - 45, 14, 60, -3.5, 0, false);
        }
        // Introduce Blue Bone
        spawnBone(1600, FLOOR_Y - 45, 14, 60, -4, 0, true);
    }

    function phase2Attack() {
        currentAttackDuration = 450;
        for(let i=0; i<12; i++) {
            let isBlue = Math.random() > 0.5;
            let height = 40 + Math.random() * 50;
            spawnBone(640 + (i*90), FLOOR_Y - height + 15, 14, height, -4.5, 0, isBlue);
        }
        // Falling bone
        spawnBone(320, -50, 14, 40, 0, 3, false);
    }

    function phase3Attack() {
        currentAttackDuration = 500;
        for(let i=0; i<5; i++) {
            // Full Width Jump (requires precise jump timing)
            spawnBone(640 + (i*180), FLOOR_Y - 15, 600, 30, -5, 0, false);
        }
        spawnBlaster(320, 100, 40); // Auto aim blaster in center
    }

    function phase4Attack() {
        currentAttackDuration = 600;
        for(let i=0; i<15; i++) {
            let height = (Math.random() > 0.7) ? 90 : 40; // mix of tall and short
            let type = (height === 90) ? true : false; // Tall ones are blue, force standing still
            spawnBone(640 + (i*70), FLOOR_Y - height + 15, 16, height, -6, 0, type);
        }
        // Rain from above
        setInterval(() => {
            if(state === "ATTACK") spawnBone(soul.x, -50, 14, 40, 0, 4, false);
        }, 800);
    }

    // --- MAIN GAME LOOP ---
    function gameLoop() {
        if (state === "ATTACK") {
            updatePhysics();
            updateEntities();
            drawBattle();
            
            attackTimer++;
            if (attackTimer > currentAttackDuration) {
                endEnemyTurn();
            }
        }
        requestAnimationFrame(gameLoop);
    }

    function updatePhysics() {
        let isMovingHoriz = false;

        // X Movement
        if (keys['ArrowLeft']) { soul.vx = -SPEED; isMovingHoriz = true; }
        else if (keys['ArrowRight']) { soul.vx = SPEED; isMovingHoriz = true; }
        else soul.vx = 0;

        soul.x += soul.vx;
        soul.x = Math.max(10, Math.min(630, soul.x));

        // Y Movement (Gravity)
        soul.vy += GRAVITY;
        soul.y += soul.vy;

        if (soul.y >= FLOOR_Y) {
            soul.y = FLOOR_Y;
            soul.vy = 0;
            if (keys['ArrowUp']) soul.vy = JUMP_POWER; // Jump!
        }

        // Variable Jump Height (release Up to fall faster)
        if (!keys['ArrowUp'] && soul.vy < 0) {
            soul.vy += GRAVITY; 
        }

        soul.isMoving = isMovingHoriz || Math.abs(soul.vy) > 0.6; // Threshold for blue bones
    }

    function updateEntities() {
        if (invulnFrames > 0) invulnFrames--;

        for(let i = entities.length - 1; i >= 0; i--) {
            let e = entities[i];
            
            if(e.type === 'bone') {
                e.x += e.vx; e.y += e.vy;

                // Collision Box
                if (soul.x < e.x + e.w && soul.x + soul.w > e.x &&
                    soul.y - soul.h < e.y + e.h && soul.y > e.y) {
                    
                    if (e.isBlue) {
                        if (soul.isMoving) takeDamage(4);
                    } else {
                        takeDamage(4);
                    }
                }
            } 
            else if (e.type === 'blaster') {
                e.timer++;
                // Track Sans while aiming
                if(e.timer < e.warnTime) {
                    e.x += (soul.x - e.x) * 0.1; 
                }
                // Fire
                else if (e.timer === e.warnTime) {
                    // Lock position, fire
                    if (soul.x > e.x - e.w/2 && soul.x < e.x + e.w/2) takeDamage(10);
                }
                else if (e.timer > e.warnTime + e.fireTime) {
                    entities.splice(i, 1);
                }
            }
        }
    }

    function takeDamage(amt) {
        if (invulnFrames > 0) return;
        
        hp -= amt;
        invulnFrames = 40;
        updateHUD();
        
        // Shake
        gameContainer.classList.remove('shake');
        void gameContainer.offsetWidth; 
        gameContainer.classList.add('shake');

        if (hp <= 0) {
            hp = 0; state = "GAMEOVER";
            document.getElementById('game-over').style.display = 'flex';
        }
    }

    function heal(amt) { hp = Math.min(maxHp, hp + amt); updateHUD(); }

    function updateHUD() {
        document.getElementById('hp-fill').style.width = (hp / maxHp * 100) + '%';
        document.getElementById('hp-text').innerText = `${hp} / ${maxHp}`;
        if(lv > 1) {
            document.getElementById('hud-lv-text').innerText = `LV ${lv}`;
            document.getElementById('hud-lv-text').style.color = "yellow";
            document.getElementById('hp-text').style.color = "yellow";
        }
    }

    function drawBattle() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Arena Floor
        ctx.strokeStyle = "white"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, FLOOR_Y + 15); ctx.lineTo(640, FLOOR_Y + 15); ctx.stroke();

        // Entities
        entities.forEach(e => {
            if(e.type === 'bone') {
                ctx.fillStyle = e.isBlue ? '#00ffff' : '#ffffff';
                ctx.fillRect(e.x, e.y, e.w, e.h);
                ctx.beginPath();
                ctx.arc(e.x + e.w/2, e.y, e.w/2, 0, Math.PI*2);
                ctx.arc(e.x + e.w/2, e.y + e.h, e.w/2, 0, Math.PI*2);
                ctx.fill();
            } 
            else if (e.type === 'blaster') {
                if (e.timer < e.warnTime) {
                    // Warning Line
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.4)';
                    ctx.fillRect(e.x - e.w/2, e.y, e.w, e.h);
                } else {
                    // Beam
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(e.x - e.w/2, e.y, e.w, e.h);
                    ctx.shadowBlur = 20; ctx.shadowColor = "white";
                    ctx.fillRect(e.x - e.w/2, e.y, e.w, e.h);
                    ctx.shadowBlur = 0; // reset
                }
            }
        });

        // Soul (Cyan)
        ctx.fillStyle = (invulnFrames % 10 > 5) ? 'rgba(0,255,255,0.5)' : '#00ffff';
        ctx.beginPath();
        let sx = soul.x, sy = soul.y - 4;
        ctx.moveTo(sx, sy); ctx.lineTo(sx - 7, sy - 7); ctx.lineTo(sx - 7, sy - 12);
        ctx.lineTo(sx - 3, sy - 14); ctx.lineTo(sx, sy - 10); ctx.lineTo(sx + 3, sy - 14);
        ctx.lineTo(sx + 7, sy - 12); ctx.lineTo(sx + 7, sy - 7); ctx.fill();
    }

    function endEnemyTurn() {
        turnCount++;
        state = "MENU";
        canvas.style.display = 'none';
        textBox.style.display = 'block';
        textBox.innerHTML = "* we don't have to fight.<br>* there must be another way!";
    }

    // --- THE SANS WINS ENDING (NO OTHER CHOICE) ---
    function triggerForcedFight() {
        state = "MENU";
        finalPhaseReady = true;
        gameContainer.className = "bg-forest"; 
        
        document.getElementById('paps-eye').style.display = "none";
        
        textBox.style.display = 'block';
        textBox.innerHTML = "* I have no other choice, papyrus.";
        
        buttons[1].classList.add('locked');
        buttons[2].classList.add('locked');
        
        buttons.forEach(b => b.classList.remove('active'));
        menuIndex = 0;
        buttons[0].classList.add('active');
    }

    function triggerFinalEnding() {
        state = "CUTSCENE";
        textBox.innerHTML = "";
        
        // Slice Animation
        let strike = document.createElement('div');
        strike.style.cssText = "position:absolute; top:200px; left:0; width:100%; height:8px; background:red; z-index:50;";
        gameContainer.appendChild(strike);
        
        // Play out the sequence
        setTimeout(() => {
            strike.remove();
            // Papyrus disappears
            document.getElementById('papyrus').style.display = "none";
            
            // LV UP Split Second Flash
            lv = 9; maxHp = 56; hp = 56;
            updateHUD();
            document.getElementById('hud').style.background = "white";
            document.getElementById('hud').style.color = "black";
            
            setTimeout(() => {
                document.getElementById('hud').style.background = "transparent";
                document.getElementById('hud').style.display = "none";
                document.getElementById('battle-box-container').style.display = "none";
                document.getElementById('buttons').style.display = "none";
                
                // Show Cutscene Image (CSS Art Silhouette)
                document.getElementById('cutscene-layer').style.display = "flex";
                setTimeout(() => {
                    document.getElementById('ending-art').style.opacity = "1";
                    setTimeout(() => {
                        document.getElementById('ending-text').style.opacity = "1";
                    }, 2000);
                }, 500);

            }, 200);

        }, 400);
    }

    // Start engine
    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
