<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mice on Venus - Measures 1-21</title>
    <style>
        :root { --accent: #00d2ff; --bg: #0a0a0c; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .sequencer-ui { background: #121216; border: 1px solid #222; padding: 40px; border-radius: 16px; text-align: center; width: 500px; box-shadow: 0 40px 100px rgba(0,0,0,0.9); }
        .measure-tag { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 5px; margin-bottom: 10px; }
        .current-notes { font-size: 28px; color: var(--accent); margin: 20px 0; min-height: 40px; font-weight: 300; }
        .progress-container { width: 100%; height: 4px; background: #222; border-radius: 2px; margin: 20px 0; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: var(--accent); box-shadow: 0 0 15px var(--accent); }
        button { background: var(--accent); color: #000; border: none; padding: 15px 50px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 14px; }
        button:hover { filter: brightness(1.2); transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="sequencer-ui">
    <div class="measure-tag" id="mInfo">Measure 01 / 21</div>
    <div class="current-notes" id="noteDisplay">---</div>
    <div class="progress-container"><div class="progress-bar" id="pBar"></div></div>
    <button id="playBtn">PLAY FULL 21 MEASURES</button>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// Frequency Map for all keys on your sheets
const F = {
    'G2': 98.00, 'Bb2': 116.54, 'C3': 130.81, 'Eb3': 155.56, 'F#3': 185.00, 'Ab3': 207.65, 'Bb3': 233.08,
    'C4': 261.63, 'D4': 293.66, 'Eb4': 311.13, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00, 'Ab4': 415.30, 'Bb4': 466.16,
    'C5': 523.25, 'D5': 587.33, 'Eb5': 622.25, 'E5': 659.25, 'G5': 783.99, 'C6': 1046.50
};

const BPM = 108; // Official marking from your sheet
const beat = 60 / BPM;

// The full 21-measure score transcribed from your images
const score = [
    // M1-4: C Major Intro
    { t: 0, n: ['C3', 'C4', 'E4'], d: 4 }, { t: 2, n: ['C4', 'E4'], d: 2 },
    { t: 4, n: ['C3', 'C4', 'E4'], d: 4 }, { t: 6, n: ['C4', 'E4'], d: 2 },
    { t: 8, n: ['C3', 'C4', 'E4'], d: 4 }, { t: 10, n: ['C4', 'E4'], d: 2 },
    { t: 12, n: ['C3', 'C4', 'E4'], d: 4 }, { t: 14, n: ['C4', 'E4'], d: 2 },
    // M5-10: Harmonic Shift (Ab and C)
    { t: 16, n: ['Ab3', 'C4', 'E4', 'G4'], d: 4 }, { t: 18, n: ['C4', 'E4', 'G4'], d: 2 },
    { t: 20, n: ['C3', 'C4', 'E4', 'G4'], d: 4 }, { t: 22, n: ['C4', 'E4', 'G4'], d: 2 },
    { t: 24, n: ['Ab3', 'C4', 'E4', 'G4'], d: 4 }, { t: 26, n: ['C4', 'E4', 'G4'], d: 2 },
    { t: 28, n: ['C3', 'C4', 'E4', 'G4'], d: 4 }, { t: 30, n: ['C4', 'E4', 'G4'], d: 2 },
    { t: 32, n: ['C3', 'C4', 'E4', 'G4'], d: 4 }, { t: 34, n: ['C4', 'E4', 'G4'], d: 2 },
    { t: 36, n: ['C3', 'C4', 'E4', 'G4'], d: 4 }, { t: 38, n: ['C4', 'E4', 'G4'], d: 2 },
    // M11: The Transition
    { t: 40, n: ['F#3', 'E5'], d: 4 }, { t: 42, n: ['G5'], d: 1 }, { t: 43, n: ['C6'], d: 1 },

    // --- NEW LINES START HERE (Measures 12-21) ---
    // M12-15: Eb -> Ab -> Bb -> C
    { t: 44, n: ['C3', 'G4', 'C5', 'Eb5'], d: 4 }, { t: 46, n: ['G4', 'C5', 'Eb5'], d: 2 },
    { t: 48, n: ['Ab2', 'Ab4', 'C5', 'Eb5'], d: 4 }, { t: 50, n: ['Ab4', 'C5', 'Eb5'], d: 2 },
    { t: 52, n: ['Bb2', 'Bb4', 'D5', 'F5'], d: 4 }, { t: 54, n: ['Bb4', 'D5', 'F5'], d: 2 },
    { t: 56, n: ['C3', 'G4', 'C5', 'Eb5'], d: 4 }, { t: 58, n: ['G4', 'C5', 'Eb5'], d: 2 },
    // M16-19: Repeat of the Walking Chords
    { t: 60, n: ['C3', 'G4', 'C5', 'Eb5'], d: 4 }, { t: 62, n: ['G4', 'C5', 'Eb5'], d: 2 },
    { t: 64, n: ['Ab2', 'Ab4', 'C5', 'Eb5'], d: 4 }, { t: 66, n: ['Ab4', 'C5', 'Eb5'], d: 2 },
    { t: 68, n: ['Bb2', 'Bb4', 'D5', 'F5'], d: 4 }, { t: 70, n: ['Bb4', 'D5', 'F5'], d: 2 },
    { t: 72, n: ['C3', 'G4', 'C5', 'Eb5'], d: 4 }, { t: 74, n: ['G4', 'C5', 'Eb5'], d: 2 },
    // M20: Quick Bass Step-up
    { t: 76, n: ['G2', 'Bb4', 'D5'], d: 2 }, { t: 78, n: ['Bb2', 'C5', 'Eb5'], d: 2 },
    // M21: Whole Note Resolution
    { t: 80, n: ['C3', 'Eb5', 'G5', 'C6'], d: 4 }
];

function playFeltPiano(freq, start, duration) {
    const osc = audioCtx.createOscillator();
    const sub = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    osc.type = 'triangle'; 
    sub.type = 'sine'; 
    osc.frequency.setValueAtTime(freq, start);
    sub.frequency.setValueAtTime(freq, start);

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1000, start); // Warm filter

    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(0.1, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, start + (duration * beat) + 1.5);

    osc.connect(filter); sub.connect(filter);
    filter.connect(gain); gain.connect(audioCtx.destination);

    osc.start(start); sub.start(start);
    osc.stop(start + (duration * beat) + 2); sub.stop(start + (duration * beat) + 2);
}

function startSong() {
    const now = audioCtx.currentTime;
    score.forEach(item => {
        const startTime = now + (item.t * beat);
        item.n.forEach(note => playFeltPiano(F[note], startTime, item.d));
        
        // Update UI
        setTimeout(() => {
            const mNum = Math.floor(item.t / 4) + 1;
            document.getElementById('mInfo').innerText = `Measure ${mNum.toString().padStart(2, '0')} / 21`;
            document.getElementById('noteDisplay').innerText = item.n.join(' • ');
            document.getElementById('pBar').style.width = (item.t / 84) * 100 + '%';
        }, item.t * beat * 1000);
    });
}

document.getElementById('playBtn').addEventListener('click', () => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    document.getElementById('playBtn').style.display = 'none';
    startSong();
});
</script>

</body>
</html>
