<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Instant Game Engine</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #setup { padding: 20px; background: #2d2d2d; border-bottom: 2px solid #444; }
        input, button, textarea { padding: 10px; margin: 5px; border-radius: 5px; border: none; }
        input, textarea { width: 300px; background: #444; color: white; }
        button { background: #007bff; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        #game-container { flex-grow: 1; position: relative; background: #000; }
        iframe { width: 100%; height: 100%; border: none; background: white; }
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; }
    </style>
</head>
<body>

<div id="setup">
    <h2>Gemini Game Engine</h2>
    <input type="password" id="apiKey" placeholder="Paste Google AI Studio API Key here">
    <input type="text" id="gamePrompt" placeholder="What game should AI build? (e.g. Space Invaders)">
    <button onclick="generateGame()">Generate & Play</button>
    <p style="font-size: 0.8em; color: #aaa;">Your key is used only for the API request and is not stored.</p>
</div>

<div id="game-container">
    <div id="loader" class="loading">Generating game... please wait...</div>
    <iframe id="gameFrame"></iframe>
</div>

<script>
    async function generateGame() {
        const key = document.getElementById('apiKey').value;
        const prompt = document.getElementById('gamePrompt').value;
        const loader = document.getElementById('loader');
        const frame = document.getElementById('gameFrame');

        if (!key || !prompt) {
            alert("Please enter both your API key and a game idea!");
            return;
        }

        loader.style.display = "block";
        frame.srcdoc = "";

        const apiURL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;

        const requestBody = {
            contents: [{
                parts: [{
                    text: `Write a complete, single-file HTML/CSS/JavaScript game based on this idea: "${prompt}". 
                    The code must be self-contained in one block. 
                    Include fun graphics using Canvas or CSS. 
                    Ensure the game is playable with a keyboard or mouse. 
                    Return ONLY the code, no conversational text, no markdown backticks.`
                }]
            }]
        };

        try {
            const response = await fetch(apiURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();
            let code = data.candidates[0].content.parts[0].text;

            // Clean up code if AI accidentally includes markdown backticks
            code = code.replace(/```html/g, "").replace(/```/g, "").trim();

            frame.srcdoc = code;
        } catch (error) {
            console.error(error);
            alert("Error generating game. Check your API key or console.");
        } finally {
            loader.style.display = "none";
        }
    }
</script>

</body>
</html>
