<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mice on Venus - Piano Loop</title>
    <style>
        body { background: #0f0f0f; color: #e0e0e0; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background: #1a1a1a; border: 1px solid #333; padding: 40px; border-radius: 4px; text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        button { background: none; border: 1px solid #4facfe; color: #4facfe; padding: 12px 24px; cursor: pointer; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; }
        button:hover { background: #4facfe; color: #121212; }
        .note-info { margin-top: 30px; min-height: 50px; }
        .current-chord { font-size: 22px; color: #fff; margin-bottom: 5px; }
        .measure-count { color: #666; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="font-weight: 300; letter-spacing: 5px;">MICE ON VENUS</h1>
    <button id="startBtn">Begin Sequence</button>
    
    <div class="note-info">
        <div id="chordName" class="current-chord">READY</div>
        <div id="measureNum" class="measure-count">75 BPM | Ambient Loop</div>
    </div>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// Frequency Mapping
const F = {
    'C3': 130.81, 'Eb3': 155.56, 'F#3': 185.00, 'Ab3': 207.65, 'Bb3': 233.08,
    'C4': 261.63, 'D4': 293.66, 'Eb4': 311.13, 'E4': 329.63, 'G4': 392.00, 'Ab4': 415.30,
    'Bb4': 466.16, 'C5': 523.25, 'Eb5': 622.25, 'E5': 659.25, 'G5': 783.99, 'C6': 1046.50
};

// Sequence combined from both sheets
const composition = [
    // Sheet 1: The Foundation
    { rh: ['C4', 'E4'], lh: 'C3', name: "C Major Dyad", dur: 2 },
    { rh: ['C4', 'E4', 'G4'], lh: 'Ab3', name: "Ab Major 7", dur: 1 },
    { rh: ['C4', 'E4', 'G4'], lh: 'C3', name: "C Major", dur: 1 },
    { rh: ['E5'], lh: 'F#3', name: "E over F#", dur: 0.5 },
    { rh: ['G5'], lh: 'F#3', name: "G over F#", dur: 0.5 },
    { rh: ['C6'], lh: 'F#3', name: "High C / F#", dur: 1 },

    // Sheet 2: The Melody Shift
    { rh: ['G4', 'C5', 'Eb5'], lh: 'Eb3', name: "Eb Major triad", dur: 1 },
    { rh: ['Ab4', 'C5', 'Eb5'], lh: 'Ab3', name: "Ab Major", dur: 1 },
    { rh: ['Bb4', 'D5', 'F5'], lh: 'Bb3', name: "Bb Major", dur: 1 },
    { rh: ['C5', 'Eb5', 'G5'], lh: 'C3', name: "C Minor resolution", dur: 2 }
];

function playNote(freq, startTime, duration) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sine'; // Pure, soft C418 tone
    osc.frequency.setValueAtTime(freq, startTime);
    
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(0.15, startTime + 0.1); // Soft attack
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration * 2);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start(startTime);
    osc.stop(startTime + duration * 2);
}

let currentIndex = 0;
function playNext() {
    const chord = composition[currentIndex];
    const now = audioCtx.currentTime;
    const beatDuration = 1.2; // Adjusted for 75 BPM

    document.getElementById('chordName').innerText = chord.name;
    document.getElementById('measureNum').innerText = `Sequence Step ${currentIndex + 1} / ${composition.length}`;

    // Play Left Hand
    playNote(F[chord.lh], now, chord.dur * beatDuration);
    
    // Play Right Hand
    chord.rh.forEach(note => {
        playNote(F[note], now, chord.dur * beatDuration);
    });

    currentIndex = (currentIndex + 1) % composition.length;
    setTimeout(playNext, chord.dur * beatDuration * 1000);
}

document.getElementById('startBtn').addEventListener('click', () => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    playNext();
    document.getElementById('startBtn').style.opacity = '0';
    document.getElementById('startBtn').style.pointerEvents = 'none';
});
</script>

</body>
</html>
