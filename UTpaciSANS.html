<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mice on Venus - 1:1 Replica</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: Arial, sans-serif; }
        #canvas-container { position: relative; width: 100vw; height: 100vh; background: #121212; }
        
        /* The Synthesia Keyboard Look */
        #piano-container {
            position: absolute; bottom: 0; width: 100%; height: 120px;
            background: #1a1a1a; display: flex; border-top: 4px solid #444;
            box-shadow: 0 -10px 50px rgba(0,0,0,0.8);
        }
        /* Red felt line seen in image */
        #felt {
            position: absolute; top: -4px; width: 100%; height: 4px;
            background: #8b0000; z-index: 10;
        }
        .key { flex: 1; border: 1px solid #ddd; background: #fdfdfd; position: relative; border-radius: 0 0 3px 3px; }
        .key.black { 
            background: #111; height: 65%; margin: 0 -1.2%; z-index: 5; 
            border: 1px solid #000; border-radius: 0 0 2px 2px;
        }
        .key.active-yellow { background: #f1c40f !important; box-shadow: 0 0 20px #f1c40f; }
        .key.active-blue { background: #3498db !important; box-shadow: 0 0 20px #3498db; }

        #start-screen {
            position: absolute; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        button {
            padding: 20px 60px; font-size: 20px; background: #f1c40f; border: none;
            cursor: pointer; font-weight: bold; border-radius: 5px;
        }
    </style>
</head>
<body>

<div id="start-screen"><button onclick="init()">START 1:1 TUTORIAL</button></div>

<div id="canvas-container">
    <canvas id="notesCanvas"></canvas>
    <div id="felt"></div>
    <div id="piano-container"></div>
</div>

<script>
const canvas = document.getElementById('notesCanvas');
const ctx = canvas.getContext('2d');
const piano = document.getElementById('piano-container');

// Settings from video
const START_MIDI = 36; 
const END_MIDI = 96; 
const SCROLL_SPEED = 180; // Matches video tempo
const YELLOW = "#f1c40f"; // Right Hand
const BLUE = "#3498db";   // Left Hand

// 1:1 Note Data (t=time, d=duration, n=midi note, h=hand)
const songData = [
    // Intro Chords
    {t: 0.5, d: 2.0, n: 48, h: 'L'}, {t: 0.5, d: 2.0, n: 60, h: 'R'}, {t: 0.5, d: 2.0, n: 64, h: 'R'},
    {t: 3.0, d: 2.0, n: 41, h: 'L'}, {t: 3.0, d: 2.0, n: 65, h: 'R'}, {t: 3.0, d: 2.0, n: 69, h: 'R'},
    
    // The Melody (Starting at 0:15)
    {t: 6.0, d: 1.0, n: 67, h: 'R'}, {t: 7.2, d: 1.0, n: 64, h: 'R'}, 
    {t: 8.4, d: 1.2, n: 62, h: 'R'}, {t: 9.8, d: 1.0, n: 60, h: 'R'},
    {t: 11.2, d: 1.0, n: 55, h: 'L'}, {t: 12.4, d: 1.0, n: 57, h: 'L'},
    {t: 13.8, d: 3.0, n: 60, h: 'R'},

    // Higher Octave Layer (The "Double" effect in Synthesia)
    {t: 16.0, d: 1.2, n: 72, h: 'R'}, {t: 17.5, d: 1.2, n: 76, h: 'R'},
    {t: 19.0, d: 1.2, n: 79, h: 'R'}, {t: 20.5, d: 4.0, n: 84, h: 'R'}
];

// Initialize Piano Keys
for (let i = START_MIDI; i <= END_MIDI; i++) {
    const isBlack = [1,3,6,8,10].includes(i % 12);
    const key = document.createElement('div');
    key.className = `key ${isBlack ? 'black' : 'white'}`;
    key.id = `midi-${i}`;
    piano.appendChild(key);
}

let startTime = 0;
let isPlaying = false;
let audioCtx;

function init() {
    document.getElementById('start-screen').style.display = 'none';
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    startTime = performance.now();
    isPlaying = true;
    requestAnimationFrame(render);
}

function render() {
    if (!isPlaying) return;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight - 120;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const now = (performance.now() - startTime) / 1000;
    const keyWidth = canvas.width / (END_MIDI - START_MIDI + 1);

    songData.forEach(note => {
        const x = (note.n - START_MIDI) * keyWidth;
        // Calculate Y based on scroll speed (top to bottom)
        const y = canvas.height - (note.t - now) * SCROLL_SPEED - (note.d * SCROLL_SPEED);
        const h = note.d * SCROLL_SPEED;

        if (y + h > 0 && y < canvas.height) {
            ctx.fillStyle = note.h === 'R' ? YELLOW : BLUE;
            // Draw rounded "Pill" shape (1:1 with image)
            const radius = keyWidth / 2;
            ctx.beginPath();
            ctx.roundRect(x + 2, y, keyWidth - 4, h, 8);
            ctx.fill();

            // Key light logic
            const keyEl = document.getElementById(`midi-${note.n}`);
            if (now >= note.t && now <= note.t + note.d) {
                keyEl.classList.add(note.h === 'R' ? 'active-yellow' : 'active-blue');
                playNoteOnce(note);
            } else {
                keyEl.classList.remove('active-yellow', 'active-blue');
            }
        }
    });

    requestAnimationFrame(render);
}

const played = new Set();
function playNoteOnce(note) {
    const id = `${note.n}-${note.t}`;
    if (played.has(id)) return;
    played.add(id);

    const freq = 440 * Math.pow(2, (note.n - 69) / 12);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + note.d);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + note.d);
}
</script>
</body>
</html>
