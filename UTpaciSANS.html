<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mice on Venus - Web Piano</title>
    <style>
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #2a2a2a;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #444;
        }
        h1 { color: #00ffcc; margin-bottom: 10px; }
        p { color: #aaa; margin-bottom: 30px; }
        button {
            background: #00ffcc;
            color: #1a1a1a;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        button:hover {
            background: #00ccaa;
            transform: scale(1.05);
        }
        .visualizer {
            margin-top: 30px;
            display: flex;
            gap: 5px;
            height: 50px;
            align-items: flex-end;
        }
        .bar {
            width: 10px;
            background: #00ffcc;
            border-radius: 5px 5px 0 0;
            transition: height 0.1s;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Mice on Venus</h1>
    <p>Minecraft Piano Arrangement (Web Audio API)</p>
    <button id="playBtn">Play Minecraft Theme</button>
    
    <div class="visualizer" id="visualizer">
        </div>
</div>

<script>
    const playBtn = document.getElementById('playBtn');
    const visualizer = document.getElementById('visualizer');
    
    // Create visualizer bars
    for(let i=0; i<15; i++) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.height = '5px';
        visualizer.appendChild(bar);
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Note Frequencies
    const notes = {
        'G3': 196.00, 'A3': 220.00, 'B3': 246.94,
        'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00, 'A4': 440.00
    };

    // The Sequence (Note, Duration in seconds, StartTime offset)
    const melody = [
        { n: 'G4', d: 1.5, t: 0 },
        { n: 'E4', d: 1.5, t: 1.5 },
        { n: 'D4', d: 2.0, t: 3.0 },
        { n: 'C4', d: 1.5, t: 5.0 },
        { n: 'G3', d: 1.5, t: 6.5 },
        { n: 'A3', d: 1.5, t: 8.0 },
        { n: 'C4', d: 3.0, t: 9.5 }
    ];

    function playNote(freq, duration, startTime) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        // Piano-like Sine/Triangle mix
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, startTime);

        // Soft Attack and Decay (Piano feel)
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.3, startTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(startTime);
        osc.stop(startTime + duration);

        // Animate visualizer
        setTimeout(() => {
            const bars = document.querySelectorAll('.bar');
            bars.forEach(b => b.style.height = Math.random() * 50 + 'px');
            setTimeout(() => {
                bars.forEach(b => b.style.height = '5px');
            }, duration * 1000);
        }, (startTime - audioCtx.currentTime) * 1000);
    }

    playBtn.addEventListener('click', () => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const now = audioCtx.currentTime;
        melody.forEach(item => {
            playNote(notes[item.n], item.d, now + item.t);
        });
    });
</script>

</body>
</html>
