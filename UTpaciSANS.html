<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mice on Venus - Precision Sequencer</title>
    <style>
        :root { --glow: #4facfe; --bg: #0d0d0f; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .player-card { background: #16161a; border: 1px solid #2a2a2e; padding: 40px; border-radius: 24px; text-align: center; width: 450px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); }
        .measure-display { font-size: 48px; font-weight: 800; color: var(--glow); margin: 20px 0; font-variant-numeric: tabular-nums; }
        .note-list { color: #888; font-family: monospace; height: 20px; margin-bottom: 30px; letter-spacing: 2px; }
        button { background: var(--glow); color: #000; border: none; padding: 18px 45px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; width: 100%; }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3); }
        .track-info { font-size: 11px; text-transform: uppercase; color: #555; letter-spacing: 4px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="player-card">
    <div class="track-info">Part 1: The First 11 Measures</div>
    <div class="measure-display" id="mNum">01</div>
    <div class="note-list" id="noteName">---</div>
    <button id="startBtn">INITIALIZE SEQUENCE</button>
    <p style="color:#333; font-size: 10px; margin-top:20px;">BASED ON UPLOADED PIANO SHEETS</p>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// Frequency Map (Scientific Pitch)
const F = {
    'C3': 130.81, 'F#3': 185.00, 'Ab3': 207.65, 
    'C4': 261.63, 'E4': 329.63, 'G4': 392.00, 
    'E5': 659.25, 'G5': 783.99, 'C6': 1046.50
};

// BPM is 75 for this ambient section. 1 beat = 0.8 seconds.
const beat = 0.8;

// Rhythmic Score: time (in beats), notes (array), duration (in beats)
const score = [
    // Measure 1-4: The C Major Intro
    { t: 0, n: ['C3', 'C4', 'E4'], d: 4 }, { t: 2, n: ['C4', 'E4'], d: 2 },
    { t: 4, n: ['C3', 'C4', 'E4'], d: 4 }, { t: 6, n: ['C4', 'E4'], d: 2 },
    { t: 8, n: ['C3', 'C4', 'E4'], d: 4 }, { t: 10, n: ['C4', 'E4'], d: 2 },
    { t: 12, n: ['C3', 'C4', 'E4'], d: 4 }, { t: 14, n: ['C4', 'E4'], d: 2 },

    // Measure 5: Ab in Bass, C-E-G Triad
    { t: 16, n: ['Ab3', 'C4', 'E4', 'G4'], d: 4 }, { t: 18, n: ['C4', 'E4', 'G4'], d: 2 },
    // Measure 6: Return to C
    { t: 20, n: ['C3', 'C4', 'E4', 'G4'], d: 4 }, { t: 22, n: ['C4', 'E4', 'G4'], d: 2 },
    // Measure 7: Back to Ab
    { t: 24, n: ['Ab3', 'C4', 'E4', 'G4'], d: 4 }, { t: 26, n: ['C4', 'E4', 'G4'], d: 2 },
    // Measure 8-10: C Foundation
    { t: 28, n: ['C3', 'C4', 'E4', 'G4'], d: 4 }, { t: 30, n: ['C4', 'E4', 'G4'], d: 2 },
    { t: 32, n: ['C3', 'C4', 'E4', 'G4'], d: 4 }, { t: 34, n: ['C4', 'E4', 'G4'], d: 2 },
    { t: 36, n: ['C3', 'C4', 'E4', 'G4'], d: 4 }, { t: 38, n: ['C4', 'E4', 'G4'], d: 2 },

    // Measure 11: The Big Shift (F# Bass + High Melody)
    { t: 40, n: ['F#3', 'E5'], d: 4 }, // Bass holds whole measure, E5 is half
    { t: 42, n: ['G5'], d: 1 },        // G5 is quarter
    { t: 43, n: ['C6'], d: 1 }         // C6 is quarter
];

function playFeltPiano(freq, start, duration) {
    const osc = audioCtx.createOscillator();
    const noise = audioCtx.createOscillator(); // Layer for "felt" texture
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    osc.type = 'sine';
    noise.type = 'triangle';
    osc.frequency.setValueAtTime(freq, start);
    noise.frequency.setValueAtTime(freq, start);

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(800, start); // Muffled, warm sound

    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(0.12, start + 0.03); // Strike
    gain.gain.exponentialRampToValueAtTime(0.001, start + (duration * beat) + 2); // Sustain

    osc.connect(filter);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(start);
    noise.start(start);
    osc.stop(start + (duration * beat) + 3);
    noise.stop(start + (duration * beat) + 3);
}

function startSequence() {
    const now = audioCtx.currentTime;
    
    score.forEach(item => {
        const startTime = now + (item.t * beat);
        
        // Schedule Audio
        item.n.forEach(note => playFeltPiano(F[note], startTime, item.d));

        // Schedule UI Updates
        setTimeout(() => {
            document.getElementById('mNum').innerText = Math.floor(item.t / 4) + 1;
            document.getElementById('noteName').innerText = item.n.join(' • ');
        }, item.t * beat * 1000);
    });

    // Loop logic
    setTimeout(startSequence, totalLengthInBeats * beat * 1000);
}

const totalLengthInBeats = 44; // 11 measures * 4 beats

document.getElementById('startBtn').addEventListener('click', () => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    document.getElementById('startBtn').style.display = 'none';
    startSequence();
});
</script>

</body>
</html>
