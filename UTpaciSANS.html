<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mice on Venus - Fixed & Extended</title>
    <style>
        :root { --p-blue: #4facfe; --p-bg: #0a0a0b; }
        body { background: var(--p-bg); color: white; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .piano-card { background: #141417; border: 1px solid #222; padding: 40px; border-radius: 12px; text-align: center; width: 420px; box-shadow: 0 50px 100px rgba(0,0,0,0.9); }
        .chord-name { font-size: 32px; font-weight: 200; color: var(--p-blue); margin: 20px 0; height: 45px; text-shadow: 0 0 15px rgba(79, 172, 254, 0.3); }
        .measure-count { font-size: 11px; color: #444; text-transform: uppercase; letter-spacing: 6px; }
        button { background: var(--p-blue); color: #000; border: none; padding: 18px 40px; border-radius: 6px; font-weight: 800; cursor: pointer; transition: 0.2s; font-size: 14px; width: 100%; }
        button:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .progress-rail { width: 100%; height: 2px; background: #222; margin-top: 30px; position: relative; }
        .progress-bar { height: 100%; width: 0%; background: var(--p-blue); transition: width 0.1s linear; }
    </style>
</head>
<body>

<div class="piano-card">
    <div class="measure-count" id="mTag">MICE ON VENUS | M01-21</div>
    <div class="chord-name" id="chordTag">READY</div>
    <button id="playBtn">START FULL SEQUENCE</button>
    <div class="progress-rail"><div class="progress-bar" id="pBar"></div></div>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// Scientific frequencies for the "Left" keys and right hand
const HZ = {
    'G2': 98.00, 'Ab2': 103.83, 'Bb2': 116.54, 'C3': 130.81, 'Eb3': 155.56, 'F#3': 185.00, 'Ab3': 207.65, 
    'C4': 261.63, 'E4': 329.63, 'G4': 392.00, 'Ab4': 415.30, 'Bb4': 466.16, 
    'C5': 523.25, 'D5': 587.33, 'Eb5': 622.25, 'E5': 659.25, 'G5': 783.99, 'C6': 1046.50
};

const BPM = 75; 
const beatDur = 60 / BPM;

// The Score: m=measure, b=beat in song, n=notes, d=duration(beats)
const songData = [
    // M1-4: Intro
    {m:1, b:0, n:['C3','C4','E4'], d:4}, {m:1, b:2, n:['C4','E4'], d:2},
    {m:2, b:4, n:['C3','C4','E4'], d:4}, {m:2, b:6, n:['C4','E4'], d:2},
    {m:3, b:8, n:['C3','C4','E4'], d:4}, {m:3, b:10, n:['C4','E4'], d:2},
    {m:4, b:12, n:['C3','C4','E4'], d:4}, {m:4, b:14, n:['C4','E4'], d:2},
    // M5-10: The Shifting Foundation
    {m:5, b:16, n:['Ab3','C4','E4','G4'], d:4}, {m:5, b:18, n:['C4','E4','G4'], d:2},
    {m:6, b:20, n:['C3','C4','E4','G4'], d:4}, {m:6, b:22, n:['C4','E4','G4'], d:2},
    {m:7, b:24, n:['Ab3','C4','E4','G4'], d:4}, {m:7, b:26, n:['C4','E4','G4'], d:2},
    {m:8, b:28, n:['C3','C4','E4','G4'], d:4}, {m:8, b:30, n:['C4','E4','G4'], d:2},
    {m:9, b:32, n:['C3','C4','E4','G4'], d:4}, {m:9, b:34, n:['C4','E4','G4'], d:2},
    {m:10,b:36, n:['C3','C4','E4','G4'], d:4}, {m:10,b:38, n:['C4','E4','G4'], d:2},
    // M11: The rhythmic jump
    {m:11,b:40, n:['F#3','E5'], d:2}, {m:11,b:42, n:['G5'], d:1}, {m:11,b:43, n:['C6'], d:1},

    // M12-21: The "Walking" Part (Lower Bass / Left Keys)
    {m:12,b:44, n:['C3','G4','C5','Eb5'], d:4}, {m:12,b:46, n:['G4','C5','Eb5'], d:2},
    {m:13,b:48, n:['Ab2','Ab4','C5','Eb5'], d:4}, {m:13,b:50, n:['Ab4','C5','Eb5'], d:2},
    {m:14,b:52, n:['Bb2','Bb4','D5','G5'], d:4}, {m:14,b:54, n:['Bb4','D5','G5'], d:2},
    {m:15,b:56, n:['C3','G4','C5','Eb5'], d:4}, {m:15,b:58, n:['G4','C5','Eb5'], d:2},
    {m:16,b:60, n:['C3','G4','C5','Eb5'], d:4}, {m:16,b:62, n:['G4','C5','Eb5'], d:2},
    {m:17,b:64, n:['Ab2','Ab4','C5','Eb5'], d:4}, {m:17,b:66, n:['Ab4','C5','Eb5'], d:2},
    {m:18,b:68, n:['Bb2','Bb4','D5','G5'], d:4}, {m:18,b:70, n:['Bb4','D5','G5'], d:2},
    {m:19,b:72, n:['C3','G4','C5','Eb5'], d:4}, {m:19,b:74, n:['G4','C5','Eb5'], d:2},
    // M20-21: The Resolution
    {m:20,b:76, n:['G2','Bb4','D5'], d:2}, {m:20,b:78, n:['Bb2','C5','Eb5'], d:2},
    {m:21,b:80, n:['C3','Eb5','G5','C6'], d:4}
];

function playFeltNote(freq, startTime, durInBeats) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    osc.type = 'triangle'; 
    osc.frequency.setValueAtTime(freq, startTime);
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1200, startTime);

    const durSeconds = durInBeats * beatDur;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(0.12, startTime + 0.03); // Strike
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + durSeconds + 1.5); // Decay

    osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    osc.start(startTime); osc.stop(startTime + durSeconds + 2);
}

let currentIdx = 0;
let startTime = 0;

function scheduler() {
    const scheduleWindow = 0.15; // Schedule notes 150ms in advance
    while (currentIdx < songData.length) {
        const item = songData[currentIdx];
        const itemTime = startTime + (item.b * beatDur);
        
        if (itemTime > audioCtx.currentTime + scheduleWindow) break;

        // Play the notes
        item.n.forEach(note => playFeltNote(HZ[note], itemTime, item.d));
        
        // Update the UI
        setTimeout(() => {
            document.getElementById('chordTag').innerText = item.n.join(' • ');
            document.getElementById('mTag').innerText = `Measure ${item.m.toString().padStart(2, '0')} / 21`;
            document.getElementById('pBar').style.width = (item.b / 84) * 100 + '%';
        }, (itemTime - audioCtx.currentTime) * 1000);

        currentIdx++;
    }

    if (currentIdx >= songData.length) {
        // Loop back after the last note finishes (Measure 21 is 4 beats long)
        setTimeout(() => { currentIdx = 0; startTime = audioCtx.currentTime; scheduler(); }, 5000);
        return;
    }
    requestAnimationFrame(scheduler);
}

document.getElementById('playBtn').addEventListener('click', () => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    document.getElementById('playBtn').style.display = 'none';
    startTime = audioCtx.currentTime;
    scheduler();
});
</script>
</body>
</html>
