<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mice on Venus - Sheet 1 (M1-11)</title>
    <style>
        body { background: #0e0e0e; color: #fff; font-family: 'Georgia', serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .sheet-box { background: #1a1a1a; padding: 40px; border-radius: 4px; border: 1px solid #333; text-align: center; width: 500px; box-shadow: 0 0 40px rgba(0,0,0,0.8); }
        .note-bubble { height: 100px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #4facfe; text-shadow: 0 0 10px #4facfe; margin: 20px 0; border-top: 1px solid #333; border-bottom: 1px solid #333; }
        button { background: transparent; border: 1px solid #4facfe; color: #4facfe; padding: 15px 40px; cursor: pointer; font-size: 14px; letter-spacing: 3px; transition: 0.3s; }
        button:hover { background: #4facfe; color: #000; }
        .meta { color: #555; font-size: 11px; margin-top: 20px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="sheet-box">
    <div class="meta">Tempo: 108 BPM | Key: C Major</div>
    <div id="notes" class="note-bubble">---</div>
    <button id="playBtn">START MEASURE 1</button>
    <div class="meta" id="measureCount">Measure: 0</div>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

const F = {
    'C3': 130.81, 'F#3': 185.00, 'Ab3': 207.65, 
    'C4': 261.63, 'E4': 329.63, 'G4': 392.00, 
    'E5': 659.25, 'G5': 783.99, 'C6': 1046.50
};

// Precise transcription of the 11 measures you sent
const measures = [
    // M1-4: C Major Dyads
    { m: 1, lh: 'C3', rh: ['C4', 'E4'], dur: 2 }, { m: 1, lh: 'C3', rh: ['C4', 'E4'], dur: 2 },
    { m: 2, lh: 'C3', rh: ['C4', 'E4'], dur: 2 }, { m: 2, lh: 'C3', rh: ['C4', 'E4'], dur: 2 },
    { m: 3, lh: 'C3', rh: ['C4', 'E4'], dur: 2 }, { m: 3, lh: 'C3', rh: ['C4', 'E4'], dur: 2 },
    { m: 4, lh: 'C3', rh: ['C4', 'E4'], dur: 2 }, { m: 4, lh: 'C3', rh: ['C4', 'E4'], dur: 2 },

    // M5-10: The harmonic shift (Adding G)
    { m: 5, lh: 'Ab3', rh: ['C4', 'E4', 'G4'], dur: 2 }, { m: 5, lh: 'Ab3', rh: ['C4', 'E4', 'G4'], dur: 2 },
    { m: 6, lh: 'C3', rh: ['C4', 'E4', 'G4'], dur: 2 }, { m: 6, lh: 'C3', rh: ['C4', 'E4', 'G4'], dur: 2 },
    { m: 7, lh: 'Ab3', rh: ['C4', 'E4', 'G4'], dur: 2 }, { m: 7, lh: 'Ab3', rh: ['C4', 'E4', 'G4'], dur: 2 },
    { m: 8, lh: 'C3', rh: ['C4', 'E4', 'G4'], dur: 2 }, { m: 8, lh: 'C3', rh: ['C4', 'E4', 'G4'], dur: 2 },
    { m: 9, lh: 'C3', rh: ['C4', 'E4', 'G4'], dur: 2 }, { m: 9, lh: 'C3', rh: ['C4', 'E4', 'G4'], dur: 2 },
    { m: 10, lh: 'C3', rh: ['C4', 'E4', 'G4'], dur: 2 }, { m: 10, lh: 'C3', rh: ['C4', 'E4', 'G4'], dur: 2 },

    // M11: Rhythmic change
    { m: 11, lh: 'F#3', rh: ['E5'], dur: 2 },  // Half note
    { m: 11, lh: 'F#3', rh: ['G5'], dur: 1 },  // Quarter note
    { m: 11, lh: 'F#3', rh: ['C6'], dur: 1 }   // Quarter note
];

const BPM = 108;
const beat = 60 / BPM;

function playPiano(freq, start, duration) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sine'; // Cleanest tone for ambient piano
    osc.frequency.setValueAtTime(freq, start);
    
    // Envelope for soft attack and long "ring"
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(0.15, start + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration * 2.5);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + duration * 3);
}

let idx = 0;
function runSequence() {
    const chord = measures[idx];
    const now = audioCtx.currentTime;
    const durInSec = chord.dur * beat;

    // Display
    document.getElementById('notes').innerText = chord.rh.join(' + ');
    document.getElementById('measureCount').innerText = `Measure: ${chord.m}`;

    // Play Left and Right hands
    playPiano(F[chord.lh], now, durInSec);
    chord.rh.forEach(n => playPiano(F[n], now, durInSec));

    idx = (idx + 1) % measures.length;
    setTimeout(runSequence, durInSec * 1000);
}

document.getElementById('playBtn').addEventListener('click', () => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    runSequence();
    document.getElementById('playBtn').style.display = 'none';
});
</script>
</body>
</html>
