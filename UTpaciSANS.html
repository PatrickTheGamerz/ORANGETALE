<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Undertale: The Deep Gulp Chronicles</title>
    <style>
        :root {
            --ut-white: #ffffff;
            --ut-yellow: #ffff00;
            --ut-red: #ff0000;
            --ut-pink: #ffb6c1;
            --ut-purple: #a020f0;
        }

        body {
            background-color: #111;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 900px;
            height: 650px;
            border: 6px solid white;
            background: black;
            margin-top: 10px;
        }

        canvas { display: block; }

        /* UI Elements */
        #hud {
            width: 900px;
            display: flex;
            justify-content: space-between;
            padding: 10px;
            font-size: 1.5rem;
            color: var(--ut-yellow);
            border: 2px solid #333;
            background: #000;
        }

        #dialogue-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 840px;
            height: 200px;
            background: black;
            border: 4px solid white;
            padding: 20px;
            display: none;
            z-index: 100;
        }

        #internal-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, #2b0a0a 0%, #000000 100%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 200;
            padding: 40px;
        }

        .choice-btn {
            background: black;
            color: white;
            border: 2px solid white;
            padding: 12px 24px;
            margin: 10px;
            font-family: inherit;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .choice-btn:hover {
            color: var(--ut-yellow);
            border-color: var(--ut-yellow);
            transform: scale(1.05);
        }

        .internal-desc {
            font-size: 1.4rem;
            line-height: 1.6;
            color: var(--ut-pink);
            max-width: 800px;
            text-shadow: 2px 2px #000;
        }

        .flavor-text { color: var(--ut-yellow); font-style: italic; }
        .stage-title { font-size: 2rem; color: white; margin-bottom: 20px; text-decoration: underline; }
    </style>
</head>
<body>

<div id="hud">
    <span>❤️ FRISK</span>
    <span id="loc-name">THE RUINS</span>
    <span id="lv-stat">LV 1</span>
</div>

<div id="game-container">
    <canvas id="worldCanvas" width="900" height="650"></canvas>

    <div id="dialogue-overlay">
        <div id="diag-text" style="font-size: 1.4rem; margin-bottom: 20px;"></div>
        <div id="diag-choices"></div>
    </div>

    <div id="internal-overlay">
        <div id="internal-stage-title" class="stage-title"></div>
        <div id="internal-msg" class="internal-desc"></div>
        <div id="internal-choices" style="margin-top: 30px;"></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('worldCanvas');
    const ctx = canvas.getContext('2d');
    
    // --- GAME STATE ---
    let state = {
        x: 450, y: 550,
        lv: 1,
        inMenu: false,
        inInternal: false,
        currentNPC: null,
        internalStage: 0, // 0: Mouth, 1: Throat, 2: Stomach
        zone: 'Ruins'
    };

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // --- CHARACTERS ---
    const npcs = [
        { name: "Toriel", x: 450, y: 100, emoji: "🐐", color: "white", zone: "Ruins", 
          msg: "My child, it's dangerous out there. Why not stay... inside where it's warm?" },
        { name: "Annoying Dog Lady", x: 800, y: 100, emoji: "🐕", color: "white", zone: "Ruins", 
          msg: "(She looks at you like a delicious chew toy. Her tail wags hungrily.)" },
        { name: "Bunny Shopkeeper", x: 150, y: 300, emoji: "🐰", color: "pink", zone: "Snowdin", 
          msg: "Welcome! We're all out of cinnamon buns... but you look just as sweet." },
        { name: "Bunny Innkeeper", x: 150, y: 150, emoji: "🐇", color: "white", zone: "Snowdin", 
          msg: "One night's stay? I have a very 'private' room available... in my tummy." },
        { name: "Lesser Dog Lady", x: 300, y: 450, emoji: "🐶", color: "gray", zone: "Snowdin", 
          msg: "(She wants to be petted. And then maybe a small snack. You.)" },
        { name: "Muffet", x: 750, y: 400, emoji: "🕷️", color: "purple", zone: "Waterfall", 
          msg: "Ufufu~ My pet is hungry, but I think I want to taste you first~" },
        { name: "Undyne", x: 500, y: 300, emoji: "🐟", color: "blue", zone: "Waterfall", 
          msg: "Human! You'll be the perfect fuel for a warrior's heart!" },
        { name: "Catty & Bratty", x: 800, y: 550, emoji: "🐱", color: "green", zone: "Waterfall", 
          msg: "Omigosh! Like, totally join our trash collection! Literally!" }
    ];

    // --- CORE LOOP ---
    function update() {
        if (!state.inMenu && !state.inInternal) {
            if (keys['ArrowUp'] || keys['KeyW']) state.y -= 5;
            if (keys['ArrowDown'] || keys['KeyS']) state.y += 5;
            if (keys['ArrowLeft'] || keys['KeyA']) state.x -= 5;
            if (keys['ArrowRight'] || keys['KeyD']) state.x += 5;

            // Constrain
            state.x = Math.max(20, Math.min(880, state.x));
            state.y = Math.max(20, Math.min(630, state.y));

            // Collision
            npcs.forEach(n => {
                let d = Math.hypot(state.x - n.x, state.y - n.y);
                if (d < 45) triggerDialogue(n);
            });
        }
        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Map Grid
        ctx.strokeStyle = "#222";
        for(let i=0; i<900; i+=50) ctx.strokeRect(i, 0, 1, 650);

        // Draw NPCs
        npcs.forEach(n => {
            ctx.font = "50px Arial";
            ctx.fillText(n.emoji, n.x - 25, n.y + 20);
            ctx.fillStyle = "white";
            ctx.font = "16px Courier New";
            ctx.textAlign = "center";
            ctx.fillText(n.name, n.x, n.y - 40);
        });

        // Draw Player
        ctx.fillStyle = "red";
        ctx.font = "35px Arial";
        ctx.fillText("❤️", state.x, state.y + 12);
    }

    // --- DIALOGUE SYSTEM ---
    function triggerDialogue(npc) {
        state.inMenu = true;
        state.currentNPC = npc;
        document.getElementById('dialogue-overlay').style.display = "block";
        document.getElementById('diag-text').innerText = `* ${npc.msg}`;
        
        const choices = document.getElementById('diag-choices');
        choices.innerHTML = `
            <button class="choice-btn" onclick="enterInternal()">[ACT] Be Eaten</button>
            <button class="choice-btn" onclick="closeDialogue()">[MERCY] Escape</button>
        `;
    }

    function closeDialogue() {
        state.inMenu = false;
        document.getElementById('dialogue-overlay').style.display = "none";
        state.y += 60; 
    }

    // --- INTERNAL ADVENTURE ENGINE ---
    function enterInternal() {
        state.inInternal = true;
        state.internalStage = 0;
        document.getElementById('dialogue-overlay').style.display = "none";
        document.getElementById('internal-overlay').style.display = "flex";
        renderInternal();
    }

    function renderInternal() {
        const title = document.getElementById('internal-stage-title');
        const msg = document.getElementById('internal-msg');
        const choices = document.getElementById('internal-choices');
        const name = state.currentNPC.name;
        choices.innerHTML = "";

        if (state.internalStage === 0) {
            title.innerText = `THE MOUTH OF ${name.toUpperCase()}`;
            msg.innerHTML = `${name} opens wide, her <span class='flavor-text'>breath warm and humid</span>. She takes you in, her heavy <span class='flavor-text'>tongue soothing</span> your skin as she tastes every inch of you. It's slippery, tight, and inescapable.`;
            addIntBtn("Surrender to the Tongue", () => { state.internalStage = 1; renderInternal(); });
            addIntBtn("Struggle Playfully", () => { state.internalStage = 1; renderInternal(); });
        } 
        else if (state.internalStage === 1) {
            title.innerText = `THE TIGHT THROAT`;
            msg.innerHTML = `With a massive, deliberate <span class='flavor-text'>*GULP*</span>, the world goes dark. You feel the <span class='flavor-text'>walls of her throat tighten</span> around your shoulders, pulsing rhythmically. You are being slowly, firmly massaged down the long, wet passage.`;
            addIntBtn("Slide into the Depths", () => { state.internalStage = 2; renderInternal(); });
        } 
        else if (state.internalStage === 2) {
            title.innerText = `THE STOMACH OF ${name.toUpperCase()}`;
            msg.innerHTML = `You land with a soft splash. The <span class='flavor-text'>stomach walls are thick, pulsing, and incredibly tight</span>, hugging you from all sides. You can hear the deep 'thump-thump' of her heart. This is your new home.`;
            addIntBtn("[ACT] Rest & Nap", () => finishInternal("COMPANION ENDING"));
            addIntBtn("[ACT] Tickle the Walls", () => finishInternal("GIGGLE ENDING"));
            addIntBtn("[REBIRTH] Absorb & LV UP", () => { state.lv++; finishInternal("POWER ENDING"); });
        }
    }

    function addIntBtn(text, cb) {
        const b = document.createElement('button');
        b.className = "choice-btn";
        b.innerText = text;
        b.onclick = cb;
        document.getElementById('internal-choices').appendChild(b);
    }

    function finishInternal(endType) {
        alert(`ACHIEVEMENT UNLOCKED: ${state.currentNPC.name}'s ${endType}\nYour LV is now ${state.lv}`);
        state.inInternal = false;
        state.inMenu = false;
        document.getElementById('internal-overlay').style.display = "none";
        document.getElementById('lv-stat').innerText = `LV ${state.lv}`;
        state.x = 450; state.y = 550; // Return to start
    }

    // --- INITIALIZE ---
    update();
</script>

</body>
</html>
