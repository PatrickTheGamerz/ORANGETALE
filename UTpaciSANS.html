<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Game Forge v3.0</title>
    <style>
        :root { --accent: #00ff88; --bg: #0d0d0d; --panel: #1a1a1a; }
        body { font-family: 'Courier New', Courier, monospace; background: var(--bg); color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: var(--panel); padding: 15px; border-bottom: 2px solid #333; display: flex; gap: 10px; align-items: center; z-index: 10; }
        input, button { background: #222; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 4px; outline: none; }
        input:focus { border-color: var(--accent); }
        #gamePrompt { flex: 1; font-size: 1.1em; }
        button { cursor: pointer; background: #333; transition: 0.3s; font-weight: bold; }
        button:hover { background: var(--accent); color: #000; }
        #buildBtn { background: #0055ff; border: none; min-width: 120px; }

        #workspace { display: flex; flex: 1; overflow: hidden; }
        
        /* Terminal / Dev Log */
        #sidebar { width: 300px; background: #050505; border-right: 1px solid #333; display: flex; flex-direction: column; padding: 10px; }
        #log { flex: 1; font-size: 13px; color: var(--accent); overflow-y: auto; white-space: pre-wrap; margin-bottom: 10px; }
        .log-entry { margin-bottom: 8px; border-left: 2px solid #444; padding-left: 8px; }

        /* Stage */
        #stage { flex: 1; background: #111; position: relative; display: flex; align-items: center; justify-content: center; }
        iframe { width: 100%; height: 100%; border: none; background: #fff; display: none; }
        #placeholder { color: #444; text-align: center; }

        .loading-bar { height: 3px; background: var(--accent); position: absolute; top: 0; left: 0; width: 0%; transition: 0.3s; }
    </style>
</head>
<body>

<header>
    <div style="color: var(--accent); font-weight: bold;">[FORGE v3]</div>
    <input type="password" id="apiKey" placeholder="Paste Google AI Studio Key">
    <input type="text" id="gamePrompt" placeholder="Describe your game (e.g. 'Retro neon space invaders with boss fights')">
    <button id="buildBtn" onclick="forgeGame()">FORGE GAME</button>
    <button onclick="downloadGame()">DOWNLOAD</button>
</header>

<div id="workspace">
    <div id="sidebar">
        <div style="font-size: 10px; color: #666; margin-bottom: 5px;">DEV_LOG_TERMINAL</div>
        <div id="log"><div class="log-entry">> System standby. Awaiting API Key and Prompt...</div></div>
    </div>
    <div id="stage">
        <div id="loader" class="loading-bar"></div>
        <div id="placeholder"><h3>READY FOR INPUT</h3><p>AI will render the game here</p></div>
        <iframe id="gameFrame"></iframe>
    </div>
</div>

<script>
    let lastGeneratedCode = "";

    function addLog(msg) {
        const log = document.getElementById('log');
        const entry = document.createElement('div');
        entry.className = "log-entry";
        entry.innerText = `> ${msg}`;
        log.appendChild(entry);
        log.scrollTop = log.scrollHeight;
    }

    async function forgeGame() {
        const key = document.getElementById('apiKey').value;
        const prompt = document.getElementById('gamePrompt').value;
        const frame = document.getElementById('gameFrame');
        const loader = document.getElementById('loader');

        if (!key) return alert("API Key missing!");
        if (!prompt) return alert("What are we building?");

        addLog(`Initializing build: "${prompt}"`);
        loader.style.width = "30%";
        
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
        
        const payload = {
            contents: [{ parts: [{ text: `Act as an expert game developer. Create a fully functional, fun, and visually polished HTML5 game based on this idea: ${prompt}. 
            Constraints:
            1. Use ONE single HTML file (CSS and JS included).
            2. Use <canvas> for gameplay.
            3. Make it mobile and desktop friendly.
            4. Add a 'Score' and 'Restart' mechanic.
            5. IMPORTANT: Output ONLY the raw code. No markdown backticks, no explanations. Just <html> to </html>.` }] }]
        };

        try {
            loader.style.width = "60%";
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            let code = data.candidates[0].content.parts[0].text;

            // Cleanup potential markdown junk
            code = code.replace(/```html/g, "").replace(/```/g, "").trim();
            lastGeneratedCode = code;

            loader.style.width = "100%";
            addLog("Code received. Injecting into engine...");
            
            document.getElementById('placeholder').style.display = "none";
            frame.style.display = "block";
            frame.srcdoc = code;

            setTimeout(() => { 
                loader.style.width = "0%";
                addLog("Build Successful. Game is LIVE.");
            }, 500);

        } catch (err) {
            addLog("CRITICAL ERROR: Check API key or connection.");
            console.error(err);
        }
    }

    function downloadGame() {
        if (!lastGeneratedCode) return alert("No game to download yet!");
        const blob = new Blob([lastGeneratedCode], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "my_ai_game.html";
        a.click();
    }
</script>

</body>
</html>
