<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Web Piano</title>
    <style>
        body {
            background-color: #282c34;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            user-select: none;
        }

        h1 { margin-bottom: 10px; }
        p { color: #abb2bf; margin-bottom: 40px; }

        .piano {
            display: flex;
            position: relative;
            background: #111;
            padding: 20px 10px 10px 10px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 5px 15px rgba(255,255,255,0.1);
        }

        .key {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 15px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            border-radius: 0 0 5px 5px;
            transition: background 0.1s, box-shadow 0.1s;
        }

        .white {
            width: 60px;
            height: 250px;
            background: linear-gradient(to bottom, #fff 0%, #e0e0e0 100%);
            border: 1px solid #ccc;
            color: #333;
            z-index: 1;
            box-shadow: inset 0 -3px 5px rgba(0,0,0,0.2), 0 3px 5px rgba(0,0,0,0.3);
            margin: 0 2px;
        }

        .white.active {
            background: linear-gradient(to bottom, #e0e0e0 0%, #ccc 100%);
            box-shadow: inset 0 -1px 2px rgba(0,0,0,0.2), 0 1px 2px rgba(0,0,0,0.3);
            height: 248px;
            margin-top: 2px;
        }

        .black {
            width: 40px;
            height: 150px;
            background: linear-gradient(to bottom, #333 0%, #000 100%);
            color: white;
            z-index: 2;
            margin-left: -22px;
            margin-right: -22px;
            box-shadow: inset 0 -3px 5px rgba(255,255,255,0.1), 0 3px 5px rgba(0,0,0,0.5);
        }

        .black.active {
            background: linear-gradient(to bottom, #222 0%, #000 100%);
            box-shadow: inset 0 -1px 2px rgba(255,255,255,0.1), 0 1px 2px rgba(0,0,0,0.5);
            height: 148px;
            margin-top: 2px;
        }

        /* Small labels on the keys */
        .key span {
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>Advanced HTML Piano</h1>
    <p>Use your mouse to click, or use your keyboard (A-J for white keys, W, E, T, Y, U for black keys).</p>

    <div class="piano" id="piano">
        <div class="key white" data-note="261.63" data-key="a"><span>A</span></div>
        <div class="key black" data-note="277.18" data-key="w"><span>W</span></div>
        <div class="key white" data-note="293.66" data-key="s"><span>S</span></div>
        <div class="key black" data-note="311.13" data-key="e"><span>E</span></div>
        <div class="key white" data-note="329.63" data-key="d"><span>D</span></div>
        <div class="key white" data-note="349.23" data-key="f"><span>F</span></div>
        <div class="key black" data-note="369.99" data-key="t"><span>T</span></div>
        <div class="key white" data-note="392.00" data-key="g"><span>G</span></div>
        <div class="key black" data-note="415.30" data-key="y"><span>Y</span></div>
        <div class="key white" data-note="440.00" data-key="h"><span>H</span></div>
        <div class="key black" data-note="466.16" data-key="u"><span>U</span></div>
        <div class="key white" data-note="493.88" data-key="j"><span>J</span></div>
        
        <div class="key white" data-note="523.25" data-key="k"><span>K</span></div>
        <div class="key black" data-note="554.37" data-key="o"><span>O</span></div>
        <div class="key white" data-note="587.33" data-key="l"><span>L</span></div>
        <div class="key black" data-note="622.25" data-key="p"><span>P</span></div>
        <div class="key white" data-note="659.25" data-key=";"><span>;</span></div>
    </div>

    <script>
        // Set up the Web Audio API context
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Track currently playing notes to avoid keyboard auto-repeat echoing
        const activeOscillators = {};

        // Function to play a sound based on a frequency
        function playNote(frequency, keyElement) {
            // Add visual depression to the key
            keyElement.classList.add('active');

            // If a note is already playing for this key, stop it so we don't layer them infinitely
            if (activeOscillators[frequency]) return;

            // Create oscillator (the sound source)
            const oscillator = audioCtx.createOscillator();
            
            // Create gain node (volume control)
            const gainNode = audioCtx.createGain();

            // Set wave type (sine, square, sawtooth, triangle)
            // Triangle sounds somewhat close to an electric piano/flute
            oscillator.type = 'triangle'; 
            oscillator.frequency.value = frequency;

            // Connect oscillator -> gain -> speakers
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            // Envelope (Attack and Decay)
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.05); // Quick attack
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2); // Slow decay

            oscillator.start();
            
            // Store the oscillator so we can kill it on keyup/mouseup
            activeOscillators[frequency] = {
                oscillator: oscillator,
                gainNode: gainNode
            };
        }

        // Function to stop the sound
        function stopNote(frequency, keyElement) {
            keyElement.classList.remove('active');

            if (activeOscillators[frequency]) {
                const osc = activeOscillators[frequency].oscillator;
                const gain = activeOscillators[frequency].gainNode;

                // Quick fade out on release
                gain.gain.setValueAtTime(gain.gain.value, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
                
                osc.stop(audioCtx.currentTime + 0.1);
                
                delete activeOscillators[frequency];
            }
        }

        // --- Mouse Events ---
        const keys = document.querySelectorAll('.key');
        
        keys.forEach(key => {
            const frequency = parseFloat(key.getAttribute('data-note'));
            
            key.addEventListener('mousedown', () => {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                playNote(frequency, key);
            });
            
            key.addEventListener('mouseup', () => stopNote(frequency, key));
            key.addEventListener('mouseleave', () => stopNote(frequency, key));
        });

        // --- Keyboard Events ---
        document.addEventListener('keydown', (e) => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            const pressedKey = e.key.toLowerCase();
            const keyElement = document.querySelector(`.key[data-key="${pressedKey}"]`);
            
            if (keyElement && !e.repeat) { // Ignore auto-repeat when holding down a key
                const frequency = parseFloat(keyElement.getAttribute('data-note'));
                playNote(frequency, keyElement);
            }
        });

        document.addEventListener('keyup', (e) => {
            const pressedKey = e.key.toLowerCase();
            const keyElement = document.querySelector(`.key[data-key="${pressedKey}"]`);
            
            if (keyElement) {
                const frequency = parseFloat(keyElement.getAttribute('data-note'));
                stopNote(frequency, keyElement);
            }
        });
    </script>
</body>
</html>
