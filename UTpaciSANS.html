<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Undertale 3D: Internal Odyssey</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: white; }
        #ui { position: absolute; top: 10px; left: 10px; z-index: 10; pointer-events: none; }
        #hud { font-size: 22px; color: #ffff00; text-shadow: 2px 2px #000; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
            background: red; border-radius: 50%; transform: translate(-50%, -50%);
            border: 1px solid white;
        }
        #dialogue {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 70%; height: 160px; background: rgba(0,0,0,0.9); border: 4px solid #fff;
            padding: 20px; display: none; z-index: 20;
        }
        #internal-ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; display: none; z-index: 30; width: 100%;
            background: rgba(40, 0, 0, 0.6); padding: 40px;
        }
        .btn {
            background: #000; color: #fff; border: 2px solid #fff; padding: 12px 24px;
            margin: 10px; cursor: pointer; pointer-events: auto; font-family: inherit; font-size: 1.1rem;
        }
        .btn:hover { color: #ffff00; border-color: #ffff00; transform: scale(1.1); }
        .desc { font-size: 1.3rem; line-height: 1.6; color: #ffb6c1; max-width: 700px; margin: 20px auto; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="hud">❤️ FRISK | LV <span id="lv">1</span> | <span id="loc">THE RUINS</span></div>
        <div style="font-size: 0.9rem; color: #888;">[W,A,S,D] Move | [MOUSE] Look | [E] Interact</div>
    </div>
    <div id="crosshair"></div>
    
    <div id="dialogue">
        <div id="diag-text" style="font-size: 1.4rem;"></div>
        <div id="diag-options" style="margin-top:20px;"></div>
    </div>

    <div id="internal-ui">
        <h1 id="stage-title" style="font-size: 2.5rem; text-decoration: underline;"></h1>
        <p id="stage-desc" class="desc"></p>
        <div id="internal-options"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // --- GAME STATE ---
        const state = {
            lv: 1,
            inMenu: false,
            inInternal: false,
            currentNPC: null,
            stage: 0 // 0: Mouth, 1: Throat, 2: Stomach
        };

        // --- 3D SCENE SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambientLight);
        const sun = new THREE.DirectionalLight(0xffffff, 0.5);
        sun.position.set(5, 10, 7);
        scene.add(sun);

        // Floor Grid
        const grid = new THREE.GridHelper(200, 50, 0x444444, 0x222222);
        scene.add(grid);

        // --- CHARACTER DATA ---
        const characters = [
            { name: "Toriel", pos: [0, 2, -12], color: 0xffffff, size: [1.5, 4.5, 1.2], msg: "My child, stay safe... inside where it's warm." },
            { name: "Muffet", pos: [15, 1.5, -8], color: 0x800080, size: [1.2, 3, 1.2], msg: "Ufufu~ You look like the perfect ingredient for my tea." },
            { name: "Undyne", pos: [-15, 2.5, -20], color: 0x00a2ff, size: [1.4, 5, 1.4], msg: "NGAAAH! You'll fuel the heart of a warrior!" },
            { name: "Annoying Dog Lady", pos: [12, 1, 12], color: 0xffffff, size: [2.5, 2, 2.5], msg: "(She pants heavily, eyeing you like a treat...)" },
            { name: "Catty & Bratty", pos: [-12, 2, 15], color: 0x00ff00, size: [1.5, 4, 1.5], msg: "Omigosh! Like, totally join our trash collection!" }
        ];

        const npcMeshes = [];
        characters.forEach(char => {
            const group = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(...char.size);
            const bodyMat = new THREE.MeshStandardMaterial({ color: char.color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            group.add(body);

            // "Head" for interaction
            const headGeo = new THREE.SphereGeometry(0.6, 16, 16);
            const head = new THREE.Mesh(headGeo, bodyMat);
            head.position.y = char.size[1]/2 + 0.5;
            group.add(head);

            group.position.set(...char.pos);
            group.userData = char;
            scene.add(group);
            npcMeshes.push(group);
        });

        // --- PLAYER CONTROLS ---
        camera.position.set(0, 1.6, 5);
        let yaw = 0, pitch = 0;
        const keys = {};

        document.addEventListener('keydown', (e) => { 
            keys[e.code] = true;
            if (e.code === 'KeyE') checkInteract();
        });
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
            }
        });

        // --- INTERACTION LOGIC ---
        function checkInteract() {
            if (state.inMenu || state.inInternal) return;
            const ray = new THREE.Raycaster();
            ray.setFromCamera({x:0, y:0}, camera);
            const hits = ray.intersectObjects(npcMeshes, true);
            if (hits.length > 0) {
                let obj = hits[0].object;
                while(obj.parent && !obj.userData.name) obj = obj.parent;
                startDialogue(obj.userData);
            }
        }

        function startDialogue(npc) {
            state.inMenu = true;
            state.currentNPC = npc;
            document.getElementById('dialogue').style.display = 'block';
            document.getElementById('diag-text').innerText = `* ${npc.name}: "${npc.msg}"`;
            document.getElementById('diag-options').innerHTML = `
                <button class="btn" onclick="beginGulp()">[ACT] Offer Self</button>
                <button class="btn" onclick="closeDiag()">[MERCY] Leave</button>
            `;
            document.exitPointerLock();
        }

        function closeDiag() {
            state.inMenu = false;
            document.getElementById('dialogue').style.display = 'none';
            renderer.domElement.requestPointerLock();
        }

        // --- THE "GULP" 3D SEQUENCE ---
        function beginGulp() {
            state.inInternal = true;
            state.stage = 0;
            document.getElementById('dialogue').style.display = 'none';
            document.getElementById('internal-ui').style.display = 'block';
            updateInternalEnvironment();
        }

        function updateInternalEnvironment() {
            const name = state.currentNPC.name;
            const title = document.getElementById('stage-title');
            const desc = document.getElementById('stage-desc');
            const opts = document.getElementById('internal-options');
            opts.innerHTML = '';

            // Clear Scene for Internal View
            while(scene.children.length > 0) scene.remove(scene.children[0]);
            scene.add(new THREE.AmbientLight(0xff99aa, 1.5));

            if (state.stage === 0) {
                // MOUTH
                const mouthGeo = new THREE.SphereGeometry(10, 32, 32);
                const mouthMat = new THREE.MeshStandardMaterial({ color: 0x661111, side: THREE.BackSide });
                scene.add(new THREE.Mesh(mouthGeo, mouthMat));
                
                const tongue = new THREE.Mesh(new THREE.BoxGeometry(8, 1, 12), new THREE.MeshStandardMaterial({ color: 0xff7788 }));
                tongue.position.y = -4;
                scene.add(tongue);

                camera.position.set(0, 0, 0);
                title.innerText = `THE MOUTH OF ${name.toUpperCase()}`;
                desc.innerHTML = `You are held against a <span style="color:#ff7788">wet, warm tongue</span>. ${name}'s breath is humid as she tastes you. The walls of her cheeks press in tight.`;
                addIntBtn("Surrender to the Swallow", () => { state.stage = 1; updateInternalEnvironment(); });
            } 
            else if (state.stage === 1) {
                // THROAT
                const throat = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 40, 32, 1, true), new THREE.MeshStandardMaterial({ color: 0x882233, side: THREE.BackSide }));
                throat.rotation.x = Math.PI / 2;
                scene.add(throat);

                title.innerText = `THE DOWNWARD GULP`;
                desc.innerHTML = `A massive <span style="color:#ffff00">*GULP*</span> pulls you into the throat. The <span style="color:#ffb6c1">muscular walls are incredibly tight</span>, pulsing rhythmically as they massage you slowly downward into the dark.`;
                addIntBtn("Slide into the Stomach", () => { state.stage = 2; updateInternalEnvironment(); });
            } 
            else if (state.stage === 2) {
                // STOMACH
                const stomach = new THREE.Mesh(new THREE.SphereGeometry(15, 32, 32), new THREE.MeshStandardMaterial({ color: 0x440505, side: THREE.BackSide }));
                scene.add(stomach);

                title.innerText = `${name.toUpperCase()}'S STOMACH`;
                desc.innerHTML = `You land with a soft splash. The <span style="color:#ffb6c1">thick walls hug you from every side</span>, vibrating with her heartbeat. You are now officially a part of her.`;
                addIntBtn("[ACT] Rest Forever", () => { alert("Ending: Permanent Resident"); location.reload(); });
                addIntBtn("[REBIRTH] Absorb & LV UP", () => { state.lv++; alert(`Ending: Absorbed. LV increased to ${state.lv}`); location.reload(); });
            }
        }

        function addIntBtn(txt, cb) {
            const b = document.createElement('button');
            b.className = 'btn'; b.innerText = txt; b.onclick = cb;
            document.getElementById('internal-options').appendChild(b);
        }

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            
            if (!state.inMenu && !state.inInternal && document.pointerLockElement === renderer.domElement) {
                const speed = 0.12;
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                dir.y = 0; dir.normalize();
                const side = new THREE.Vector3().crossVectors(camera.up, dir).normalize();

                if (keys['KeyW']) camera.position.addScaledVector(dir, speed);
                if (keys['KeyS']) camera.position.addScaledVector(dir, -speed);
                if (keys['KeyA']) camera.position.addScaledVector(side, speed);
                if (keys['KeyD']) camera.position.addScaledVector(side, -speed);
                
                camera.rotation.set(0, 0, 0);
                camera.rotateY(yaw);
                camera.rotateX(pitch);
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
