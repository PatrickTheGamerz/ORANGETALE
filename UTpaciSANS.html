<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DUSTTRUST - Papyrus Encounter</title>
    <style>
        @font-face {
            font-family: 'Determination';
            src: url('https://fonts.cdnfonts.com/s/14876/DeterminationMono.woff') format('woff');
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Determination', 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #battle-container {
            width: 640px;
            height: 480px;
            position: relative;
            border: 2px solid #555;
        }

        /* Sprite Area */
        #enemy-sprite {
            width: 100%;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 20px;
            font-size: 80px;
        }

        /* Dialogue Bubble */
        #speech-bubble {
            position: absolute;
            top: 50px;
            right: 50px;
            background: white;
            color: black;
            padding: 10px;
            border-radius: 10px;
            width: 150px;
            display: none;
            font-size: 14px;
        }

        /* Battle Box */
        #battle-box {
            width: 400px;
            height: 140px;
            border: 5px solid white;
            margin: 0 auto;
            position: relative;
            background: black;
            overflow: hidden;
        }

        /* HUD */
        #hud {
            width: 400px;
            margin: 10px auto;
            display: flex;
            align-items: center;
            font-size: 20px;
        }

        #hp-bar-bg { width: 100px; height: 20px; background: red; margin: 0 10px; position: relative; }
        #hp-bar-fill { width: 100%; height: 100%; background: #ffff00; }

        /* Buttons */
        #button-container {
            width: 580px;
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        .btn {
            width: 110px;
            height: 42px;
            border: 2px solid #e7762e;
            color: #e7762e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
        }

        .btn.active { border-color: #ffff00; color: #ffff00; }
        .btn:hover { border-color: #ffff00; color: #ffff00; }

        /* Soul */
        #soul {
            width: 16px;
            height: 16px;
            position: absolute;
            z-index: 100;
        }

        /* Game Over */
        #game-over {
            position: absolute;
            inset: 0;
            background: black;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
    </style>
</head>
<body>

<div id="battle-container">
    <div id="enemy-sprite">💀</div>
    <div id="speech-bubble"></div>
    
    <div id="battle-box">
        <canvas id="attackCanvas" width="400" height="140"></canvas>
        <div id="soul">❤️</div>
    </div>

    <div id="hud">
        <span>FRISK  LV 19</span>
        <span style="margin-left: 20px;">HP</span>
        <div id="hp-bar-bg"><div id="hp-bar-fill"></div></div>
        <span id="hp-text">92 / 92</span>
    </div>

    <div id="button-container">
        <div class="btn" id="btn-fight">FIGHT</div>
        <div class="btn" id="btn-act">ACT</div>
        <div class="btn" id="btn-item">ITEM</div>
        <div class="btn" id="btn-mercy">MERCY</div>
    </div>
</div>

<div id="game-over">
    <h1 style="color: red; font-size: 60px;">GAME OVER</h1>
    <p style="color: white; font-size: 20px;">Stay determined...</p>
    <button onclick="location.reload()" style="background: none; border: 1px solid white; color: white; padding: 10px; cursor: pointer;">RETRY</button>
</div>

<script>
    const canvas = document.getElementById('attackCanvas');
    const ctx = canvas.getContext('2d');
    const soul = document.getElementById('soul');
    const hpFill = document.getElementById('hp-bar-fill');
    const hpText = document.getElementById('hp-text');
    const bubble = document.getElementById('speech-bubble');

    let game = {
        hp: 92,
        maxHp: 92,
        enemyHp: 1500,
        state: 'menu', // menu, dialogue, attacking
        soulX: 192,
        soulY: 62,
        turn: 0
    };

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    const attacks = [];

    const dialogue = [
        "HUMAN. OR SHOULD I SAY... MURDERER.",
        "MY BROTHER IS GONE. AND YET, I FEEL NOTHING BUT DUST.",
        "YOU THINK YOU ARE IN CONTROL?",
        "THIS IS DUSTTRUST. THE RULES HAVE CHANGED."
    ];

    // --- MAIN LOOP ---
    function loop() {
        if (game.state === 'attacking') {
            updateSoul();
            updateAttacks();
        }
        drawAttacks();
        requestAnimationFrame(loop);
    }

    function updateSoul() {
        const speed = 3;
        if (keys['ArrowUp'] && game.soulY > 0) game.soulY -= speed;
        if (keys['ArrowDown'] && game.soulY < 124) game.soulY += speed;
        if (keys['ArrowLeft'] && game.soulX > 0) game.soulX -= speed;
        if (keys['ArrowRight'] && game.soulX < 384) game.soulX += speed;

        soul.style.left = game.soulX + 'px';
        soul.style.top = game.soulY + 'px';
    }

    // --- COMBAT LOGIC ---
    function startEnemyTurn() {
        game.state = 'dialogue';
        bubble.style.display = 'block';
        bubble.innerText = dialogue[game.turn % dialogue.length];
        
        setTimeout(() => {
            bubble.style.display = 'none';
            game.state = 'attacking';
            game.soulX = 192; game.soulY = 62;
            soul.style.display = 'block';
            spawnAttack();
        }, 2000);
    }

    function spawnAttack() {
        attacks.length = 0;
        const pattern = Math.random();
        
        if (pattern > 0.5) {
            // Bone Wave
            for(let i=0; i<10; i++) {
                attacks.push({ x: 400 + (i*60), y: 100, w: 10, h: 40, speed: 4, type: 'bone' });
            }
        } else {
            // Blaster Warning
            attacks.push({ x: 0, y: 50, w: 400, h: 40, timer: 60, type: 'blaster' });
        }

        setTimeout(() => {
            game.state = 'menu';
            soul.style.display = 'none';
            game.turn++;
        }, 5000);
    }

    function updateAttacks() {
        attacks.forEach((a, index) => {
            if (a.type === 'bone') {
                a.x -= a.speed;
                // Collision
                if (game.soulX < a.x + a.w && game.soulX + 16 > a.x && game.soulY < a.y + a.h && game.soulY + 16 > a.y) {
                    takeDamage(1);
                }
            }
            if (a.type === 'blaster') {
                a.timer--;
                if (a.timer < 0 && a.timer > -10) {
                    if (game.soulY + 8 > a.y && game.soulY < a.y + a.h) takeDamage(5);
                }
            }
        });
    }

    function drawAttacks() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        attacks.forEach(a => {
            if (a.type === 'bone') {
                ctx.fillStyle = 'white';
                ctx.fillRect(a.x, a.y, a.w, a.h);
            }
            if (a.type === 'blaster') {
                if (a.timer > 0) {
                    ctx.strokeStyle = 'red';
                    ctx.strokeRect(a.x, a.y, a.w, a.h);
                } else if (a.timer > -15) {
                    ctx.fillStyle = 'white';
                    ctx.fillRect(a.x, a.y, a.w, a.h);
                }
            }
        });
    }

    function takeDamage(amt) {
        game.hp -= amt;
        if (game.hp <= 0) {
            game.hp = 0;
            document.getElementById('game-over').style.display = 'flex';
        }
        const percent = (game.hp / game.maxHp) * 100;
        hpFill.style.width = percent + '%';
        hpText.innerText = `${game.hp} / ${game.maxHp}`;
    }

    // --- BUTTONS ---
    document.getElementById('btn-fight').onclick = () => {
        if (game.state !== 'menu') return;
        game.enemyHp -= 100;
        alert(`You attacked Papyrus! Dealing 100 DMG.`);
        startEnemyTurn();
    };

    document.getElementById('btn-act').onclick = () => {
        if (game.state !== 'menu') return;
        alert(`* You told Papyrus he looks dusty. \n* He didn't find it funny.`);
        startEnemyTurn();
    };

    // Start
    soul.style.display = 'none';
    loop();
</script>

</body>
</html>
