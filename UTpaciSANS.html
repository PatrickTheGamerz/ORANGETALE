<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Craft 3D</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.7); padding: 20px; border-radius: 8px;
            color: white; width: 300px; z-index: 10;
        }
        input, button { 
            width: 100%; padding: 10px; margin-top: 10px; 
            background: #333; color: white; border: 1px solid #555; cursor: pointer;
        }
        button:hover { background: #555; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px; border: 2px solid white;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #status { font-size: 12px; color: #0f0; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="ui">
        <h2 style="margin:0">AI-Craft</h2>
        <p style="font-size: 12px; color: #ccc;">Describe your world, and the AI will build the data.</p>
        <input type="password" id="apiKey" placeholder="Gemini API Key">
        <input type="text" id="worldPrompt" placeholder="e.g. A floating island with a lava pit">
        <button id="buildBtn">GENERATE WORLD</button>
        <div id="status">Ready. Use WASD to move after generating.</div>
    </div>
    <div id="crosshair"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let scene, camera, renderer, controls;
        let blocks = [];
        const moveKeys = { w: false, a: false, s: false, d: false };

        // --- 1. SETUP THE 3D ENVIRONMENT ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Sky blue
            scene.fog = new THREE.Fog(0x87ceeb, 10, 50);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lighting
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(1, 1, 0.5);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040));

            // Controls
            controls = new PointerLockControls(camera, document.body);
            document.addEventListener('click', () => controls.lock());

            animate();
        }

        // --- 2. THE AI WORLD ARCHITECT ---
        async function generateWorldFromAI() {
            const key = document.getElementById('apiKey').value;
            const prompt = document.getElementById('worldPrompt').value;
            const status = document.getElementById('status');

            if (!key) return alert("Enter API Key!");
            
            status.innerText = "AI is dreaming up the landscape...";
            
            const systemInstruction = `You are a Minecraft world generator. Output ONLY a JSON array of coordinates and block types. 
            Format: [{"x": 0, "y": 0, "z": 0, "type": "grass"}, ...]
            Create a small 10x10 area based on the user's description. Use types: grass, dirt, stone, wood, lava.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: systemInstruction + "\nUser Request: " + prompt }] }]
                    })
                });

                const data = await response.json();
                const rawText = data.candidates[0].content.parts[0].text;
                const cleanJson = rawText.match(/\[.*\]/s)[0]; // Extract JSON from markdown
                const worldData = JSON.parse(cleanJson);

                buildWorld(worldData);
                status.innerText = "World Generated! Click to play.";
            } catch (err) {
                status.innerText = "Error: AI failed to build world.";
                console.error(err);
            }
        }

        // --- 3. BLOCK BUILDER ---
        function buildWorld(data) {
            // Clear old world
            blocks.forEach(b => scene.remove(b));
            blocks = [];

            const loader = new THREE.TextureLoader();
            const box = new THREE.BoxGeometry(1, 1, 1);

            const colors = {
                grass: 0x4caf50,
                dirt: 0x8b4513,
                stone: 0x808080,
                wood: 0xdeb887,
                lava: 0xff4500
            };

            data.forEach(item => {
                const material = new THREE.MeshStandardMaterial({ color: colors[item.type] || 0xffffff });
                const cube = new THREE.Mesh(box, material);
                cube.position.set(item.x, item.y, item.z);
                scene.add(cube);
                blocks.push(cube);
            });
        }

        // --- 4. ENGINE LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            if (controls.isLocked) {
                const speed = 0.1;
                if (moveKeys.w) controls.moveForward(speed);
                if (moveKeys.s) controls.moveForward(-speed);
                if (moveKeys.a) controls.moveRight(-speed);
                if (moveKeys.d) controls.moveRight(speed);
            }
            renderer.render(scene, camera);
        }

        // Input Listeners
        window.addEventListener('keydown', (e) => moveKeys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => moveKeys[e.key.toLowerCase()] = false);
        document.getElementById('buildBtn').addEventListener('click', generateWorldFromAI);

        init();
    </script>
</body>
</html>
