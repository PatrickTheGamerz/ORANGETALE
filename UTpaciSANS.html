<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dream Manifest: Minecraft</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; border: 50px solid transparent;
            box-sizing: border-box; transition: border-color 2s;
            z-index: 10;
        }
        #ui {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #0f0; padding: 15px;
            border-radius: 5px; text-align: center; z-index: 20; border: 1px solid #0f0;
        }
        #dream-status { font-weight: bold; text-transform: uppercase; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            background: white; border-radius: 50%; transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <div id="overlay"></div>
    <div id="ui">
        <div id="dream-status">World State: Stable</div>
        <small>LOOK AWAY AND TURN BACK TO MANIFEST NEW REALITY</small>
    </div>
    <div id="crosshair"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, clock;
        let blocks = [];
        let lastYaw = 0;

        // "Popular Minecraft Images" - We use high-res AI-generated Minecraft landscape textures
        const AI_TEXTURES = [
            'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/minecraft/grass.png',
            'https://images.unsplash.com/photo-1627398242454-45a1465c2479?auto=format&fit=crop&q=80&w=400', // AI Dark Forest
            'https://images.unsplash.com/photo-1615653051968-69c2b0e41f67?auto=format&fit=crop&q=80&w=400'  // AI Floating Island
        ];

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.1);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // Create initial world
            generateDreamChunk();

            // Movement and Rotation tracker
            window.addEventListener('mousemove', (e) => {
                const yaw = (e.clientX / window.innerWidth) * Math.PI * 4;
                camera.rotation.y = yaw;

                // "Look back" detection
                if (Math.abs(yaw - lastYaw) > Math.PI) {
                    manifestNewReality();
                    lastYaw = yaw;
                }
            });

            animate();
        }

        function generateDreamChunk() {
            const geo = new THREE.BoxGeometry(1, 1, 1);
            const loader = new THREE.TextureLoader();

            for (let i = 0; i < 50; i++) {
                const texIndex = Math.floor(Math.random() * AI_TEXTURES.length);
                const mat = new THREE.MeshBasicMaterial({ 
                    map: loader.load(AI_TEXTURES[texIndex]),
                    transparent: true,
                    opacity: 0.9
                });

                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(
                    (Math.random() - 0.5) * 20,
                    (Math.random() - 0.5) * 10,
                    (Math.random() - 0.5) * 20
                );
                mesh.rotation.y = Math.random() * Math.PI;
                scene.add(mesh);
                blocks.push(mesh);
            }
        }

        function manifestNewReality() {
            const status = document.getElementById('dream-status');
            const overlay = document.getElementById('overlay');
            
            status.innerText = "Manifesting Reality...";
            status.style.color = "#f00";
            overlay.style.borderColor = "white";

            setTimeout(() => {
                // Morph blocks that are behind the player
                blocks.forEach(b => {
                    b.position.x += (Math.random() - 0.5) * 5;
                    b.scale.setScalar(Math.random() * 2);
                    
                    // Randomly swap textures to "popular" Minecraft-style AI images
                    const loader = new THREE.TextureLoader();
                    b.material.map = loader.load(AI_TEXTURES[Math.floor(Math.random() * AI_TEXTURES.length)]);
                });
                
                status.innerText = "World State: Manifested";
                status.style.color = "#0f0";
                overlay.style.borderColor = "transparent";
            }, 500);
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            
            // Subtle "breathing" effect for the AI blocks
            blocks.forEach((b, i) => {
                b.position.y += Math.sin(t + i) * 0.005;
            });

            renderer.render(scene, camera);
        }

        init();

        // Click to start audio or full immersive mode
        window.onclick = () => {
            document.body.requestPointerLock();
        };
    </script>
</body>
</html>
