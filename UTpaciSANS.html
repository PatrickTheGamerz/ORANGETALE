<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPYRUS ENCOUNTER - DUSTTRUST</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        /* --- GLOBAL STYLES --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'VT323', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            width: 800px;
            height: 600px;
            position: relative;
            background: #050510; /* Default Forest Dark */
            border: 2px solid #222;
            transition: background 1s ease;
            overflow: hidden;
        }

        /* --- BACKGROUND PHASES --- */
        .bg-forest { background: linear-gradient(to bottom, #050515, #111122) !important; }
        .bg-chains { 
            background: repeating-linear-gradient(45deg, #110022, #110022 20px, #220033 20px, #220033 40px) !important; 
        }
        .bg-red { 
            background: radial-gradient(circle, #aa0000 0%, #330000 100%) !important; 
            animation: pulseBg 2s infinite;
        }
        @keyframes pulseBg {
            0% { background-size: 100% 100%; }
            50% { background-size: 120% 120%; }
            100% { background-size: 100% 100%; }
        }

        /* --- SPRITE & BUBBLE --- */
        #sprite-layer {
            position: absolute; top: 50px; left: 0; width: 100%; height: 250px;
            display: flex; justify-content: center; align-items: flex-end;
        }

        #papyrus {
            width: 120px; height: 180px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150"><rect x="20" y="50" width="60" height="70" fill="%23ccc" rx="10"/><circle cx="50" cy="30" r="25" fill="%23eee"/><rect x="35" y="20" width="10" height="10" fill="%23000"/><rect x="55" y="20" width="10" height="10" fill="%23000"/><path d="M 30 45 Q 50 60 70 45" stroke="%23000" stroke-width="4" fill="transparent"/><rect x="30" y="120" width="15" height="30" fill="%23fff"/><rect x="55" y="120" width="15" height="30" fill="%23fff"/></svg>') no-repeat center bottom;
            background-size: contain;
            transition: transform 0.1s;
        }

        #dialogue-bubble {
            position: absolute; top: 40px; right: 150px; width: 200px;
            background: white; color: black; border-radius: 10px; padding: 15px;
            font-size: 24px; line-height: 1.2; display: none; z-index: 10;
        }
        #dialogue-bubble::after {
            content: ''; position: absolute; top: 50%; left: -10px;
            border-width: 10px 10px 10px 0; border-style: solid;
            border-color: transparent white transparent transparent;
        }

        /* --- BATTLE BOX --- */
        #battle-box-container {
            position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%);
            width: 650px; height: 180px; border: 5px solid white; background: black;
            box-sizing: border-box; transition: width 0.3s, height 0.3s;
        }
        #battle-canvas { display: block; width: 100%; height: 100%; }

        #text-box-content {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 20px 30px; box-sizing: border-box; font-size: 32px;
            color: white; line-height: 1.4; display: block;
        }

        /* --- HUD --- */
        #hud {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            width: 650px; display: flex; align-items: center; font-size: 28px; font-weight: bold;
        }
        .hud-name { margin-right: 30px; }
        .hud-lv { margin-right: 40px; }
        .hud-hp-label { font-size: 18px; margin-right: 10px; }
        .hp-bar-bg { width: 60px; height: 24px; background: red; margin-right: 15px; }
        .hp-bar-fill { height: 100%; background: #ffff00; width: 100%; transition: width 0.2s; }
        .hud-hp-text { font-size: 28px; }

        /* --- BUTTONS --- */
        #buttons {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 680px; display: flex; justify-content: space-between;
        }
        .btn {
            width: 140px; height: 50px; border: 3px solid #ff8c00; color: #ff8c00;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: bold; position: relative;
        }
        .btn.active { background: #ff8c00; color: black; border-color: #ff8c00; }
        .btn.locked { border-color: #555 !important; color: #555 !important; }
        
        .soul-icon {
            display: none; position: absolute; left: 10px; color: #00a2ff; font-size: 24px;
        }
        .btn.active .soul-icon { display: block; }

        /* --- EFFECTS --- */
        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }

        #game-over {
            position: absolute; inset: 0; background: black; z-index: 100;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<div id="game-container" class="bg-forest">
    
    <div id="sprite-layer">
        <div id="papyrus"></div>
        <div id="dialogue-bubble">YOU DON'T UNDERSTAND.</div>
    </div>

    <div id="battle-box-container">
        <div id="text-box-content">* we don't have to fight.<br>* there must be another way!</div>
        <canvas id="battle-canvas" width="640" height="170" style="display:none;"></canvas>
    </div>

    <div id="hud">
        <div class="hud-name">SANS</div>
        <div class="hud-lv">LV 1</div>
        <div class="hud-hp-label">HP</div>
        <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp-fill"></div></div>
        <div class="hud-hp-text" id="hp-text">20 / 20</div>
    </div>

    <div id="buttons">
        <div class="btn" id="btn-0"><span class="soul-icon">💙</span>FIGHT</div>
        <div class="btn active" id="btn-1"><span class="soul-icon">💙</span>ACT</div>
        <div class="btn" id="btn-2"><span class="soul-icon">💙</span>ITEM</div>
    </div>

    <div id="game-over">
        <h1 style="font-size: 80px; letter-spacing: 10px; margin: 0;">GAME OVER</h1>
        <p style="font-size: 30px; color: #aaa;">don't give up, sans...</p>
    </div>
</div>

<script>
    // --- CORE VARIABLES ---
    const canvas = document.getElementById('battle-canvas');
    const ctx = canvas.getContext('2d');
    const gameContainer = document.getElementById('game-container');
    const textBox = document.getElementById('text-box-content');
    const bubble = document.getElementById('dialogue-bubble');
    const buttons = [document.getElementById('btn-0'), document.getElementById('btn-1'), document.getElementById('btn-2')];
    
    // Player Stats
    let maxHp = 20, hp = 20;
    let invulnFrames = 0;
    let tacos = 2;
    let actCount = 0;
    let tacosUsed = 0;

    // Game State
    let state = "MENU"; // MENU, DIALOGUE, ATTACK, TYPING, FORCED_FIGHT, GAMEOVER
    let menuIndex = 1; // Starts on ACT
    let finalPhase = false;

    // Physics & Soul (BLUE SOUL)
    let soul = { x: 320, y: 150, w: 14, h: 14, vx: 0, vy: 0 };
    const GRAVITY = 0.5;
    const JUMP_POWER = -8;
    const SPEED = 4;
    const FLOOR_Y = 150;

    let keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => { keys[e.code] = false; handleInput(e.code); });

    // Attack Data
    let bones = [];
    let attackTimer = 0;
    let currentAttackDuration = 0;

    const script = [
        { 
            paps: "YOU DON'T UNDERSTAND.", 
            bg: "bg-forest",
            attack: generateAttack1 
        },
        { 
            paps: "THIS IS THE ONLY WAY TO STOP THE HUMAN.", 
            bg: "bg-chains",
            attack: generateAttack2 
        },
        { 
            paps: "I HAVE TO GET THE EXP! I HAVE TO DO IT!", 
            bg: "bg-red",
            attack: generateAttack3 
        }
    ];

    // --- INPUT HANDLING ---
    function handleInput(key) {
        if (state === "MENU") {
            if (key === 'ArrowLeft' && !finalPhase) {
                buttons[menuIndex].classList.remove('active');
                menuIndex = (menuIndex - 1 + buttons.length) % buttons.length;
                buttons[menuIndex].classList.add('active');
            }
            if (key === 'ArrowRight' && !finalPhase) {
                buttons[menuIndex].classList.remove('active');
                menuIndex = (menuIndex + 1) % buttons.length;
                buttons[menuIndex].classList.add('active');
            }
            if (key === 'Enter' || key === 'KeyZ') {
                if (finalPhase && menuIndex === 0) {
                    triggerFinalEnding();
                } else if (!finalPhase) {
                    executeMenuChoice();
                }
            }
        } else if (state === "TYPING") {
            if (key === 'Enter' || key === 'KeyZ') {
                startEnemyTurn();
            }
        }
    }

    function executeMenuChoice() {
        if (menuIndex === 0) {
            // FIGHT
            typeText("* you can't bring yourself to hit him.");
        } else if (menuIndex === 1) {
            // ACT
            actCount++;
            typeText(`* you plead with papyrus to stop. \n* you've tried ${actCount} times.`);
        } else if (menuIndex === 2) {
            // ITEM
            if (tacos > 0) {
                tacos--;
                tacosUsed++;
                heal(10);
                typeText(`* you ate a taco. you recovered 10 HP.\n* ${tacos} left.`);
            } else {
                typeText("* you are completely out of tacos.");
            }
        }
    }

    function typeText(text) {
        state = "TYPING";
        textBox.style.display = 'block';
        canvas.style.display = 'none';
        textBox.innerHTML = '';
        let i = 0;
        
        let interval = setInterval(() => {
            textBox.innerHTML = text.substring(0, i) + (text.charAt(i) === '\n' ? '<br>' : '');
            i++;
            if (i > text.length) clearInterval(interval);
        }, 30);
    }

    // --- COMBAT FLOW ---
    function startEnemyTurn() {
        state = "DIALOGUE";
        textBox.style.display = 'none';
        
        // Determine phase
        let phase = actCount - 1;
        if (phase < 0) phase = 0;

        // Check for Ending 2 (Sans wins)
        if (actCount >= 3 && tacosUsed === 0) {
            triggerForcedFight();
            return;
        }

        if (phase >= script.length) phase = script.length - 1; // Cap at max phase

        let phaseData = script[phase];
        gameContainer.className = phaseData.bg;
        bubble.style.display = 'block';
        bubble.innerText = phaseData.paps;

        setTimeout(() => {
            bubble.style.display = 'none';
            state = "ATTACK";
            canvas.style.display = 'block';
            soul.x = 320; soul.y = FLOOR_Y; soul.vx = 0; soul.vy = 0;
            bones = [];
            attackTimer = 0;
            phaseData.attack();
        }, 2000);
    }

    // --- ATTACK GENERATORS ---
    function generateAttack1() {
        currentAttackDuration = 300;
        for(let i=0; i<10; i++) {
            bones.push({ x: 640 + (i*100), y: FLOOR_Y - 40, w: 12, h: 55, type: 'white', vx: -3 });
        }
        bones.push({ x: 1200, y: FLOOR_Y - 40, w: 12, h: 55, type: 'blue', vx: -3 });
    }

    function generateAttack2() {
        currentAttackDuration = 400;
        for(let i=0; i<15; i++) {
            let isBlue = Math.random() > 0.6;
            let height = 40 + Math.random() * 40;
            bones.push({ x: 640 + (i*80), y: FLOOR_Y - height + 15, w: 12, h: height, type: isBlue ? 'blue' : 'white', vx: -4 });
        }
    }

    function generateAttack3() {
        currentAttackDuration = 500;
        for(let i=0; i<20; i++) {
            let isFullWidth = Math.random() > 0.8;
            let height = isFullWidth ? 100 : 50;
            let speed = isFullWidth ? -6 : -5;
            let type = isFullWidth ? 'white' : (Math.random() > 0.5 ? 'blue' : 'white');
            bones.push({ x: 640 + (i*70), y: FLOOR_Y - height + 15, w: 14, h: height, type: type, vx: speed });
        }
    }

    // --- RENDER & PHYSICS LOOP ---
    function gameLoop() {
        if (state === "ATTACK") {
            updatePhysics();
            updateBones();
            drawBattle();
            
            attackTimer++;
            if (attackTimer > currentAttackDuration) {
                endEnemyTurn();
            }
        }
        
        requestAnimationFrame(gameLoop);
    }

    function updatePhysics() {
        // Horizontal Movement
        if (keys['ArrowLeft']) soul.vx = -SPEED;
        else if (keys['ArrowRight']) soul.vx = SPEED;
        else soul.vx = 0;

        soul.x += soul.vx;
        soul.x = Math.max(10, Math.min(630, soul.x)); // Bounds

        // Gravity & Jumping (Blue Soul)
        soul.vy += GRAVITY;
        soul.y += soul.vy;

        if (soul.y >= FLOOR_Y) {
            soul.y = FLOOR_Y;
            soul.vy = 0;
            if (keys['ArrowUp']) {
                soul.vy = JUMP_POWER;
            }
        }
    }

    function updateBones() {
        let isMoving = (Math.abs(soul.vx) > 0 || Math.abs(soul.vy) > 0.5);

        if (invulnFrames > 0) invulnFrames--;

        bones.forEach(b => {
            b.x += b.vx;

            // Collision (AABB)
            if (soul.x < b.x + b.w && soul.x + soul.w > b.x &&
                soul.y - soul.h < b.y + b.h && soul.y > b.y) {
                
                if (b.type === 'white') {
                    takeDamage(5);
                } else if (b.type === 'blue' && isMoving) {
                    takeDamage(5);
                }
            }
        });
    }

    function takeDamage(amt) {
        if (invulnFrames > 0) return;
        
        hp -= amt;
        invulnFrames = 40;
        updateHUD();
        
        // Shake screen
        gameContainer.classList.remove('shake');
        void gameContainer.offsetWidth; // Trigger reflow
        gameContainer.classList.add('shake');

        if (hp <= 0) {
            hp = 0;
            state = "GAMEOVER";
            document.getElementById('game-over').style.display = 'flex';
        }
    }

    function heal(amt) {
        hp = Math.min(maxHp, hp + amt);
        updateHUD();
    }

    function updateHUD() {
        document.getElementById('hp-fill').style.width = (hp / maxHp * 100) + '%';
        document.getElementById('hp-text').innerText = `${hp} / ${maxHp}`;
    }

    function drawBattle() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Floor line
        ctx.strokeStyle = "white";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, FLOOR_Y + 15);
        ctx.lineTo(640, FLOOR_Y + 15);
        ctx.stroke();

        // Draw Bones
        bones.forEach(b => {
            ctx.fillStyle = (b.type === 'blue') ? '#00a2ff' : '#ffffff';
            ctx.fillRect(b.x, b.y, b.w, b.h);
            // Bone top/bottom caps
            ctx.beginPath();
            ctx.arc(b.x + b.w/2, b.y, b.w/2, 0, Math.PI*2);
            ctx.arc(b.x + b.w/2, b.y + b.h, b.w/2, 0, Math.PI*2);
            ctx.fill();
        });

        // Draw Soul
        ctx.fillStyle = (invulnFrames % 10 > 5) ? 'rgba(0,162,255,0.5)' : '#00a2ff';
        // Simple Heart Shape via pixels
        ctx.beginPath();
        let sx = soul.x, sy = soul.y - 4;
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx - 7, sy - 7);
        ctx.lineTo(sx - 7, sy - 12);
        ctx.lineTo(sx - 3, sy - 14);
        ctx.lineTo(sx, sy - 10);
        ctx.lineTo(sx + 3, sy - 14);
        ctx.lineTo(sx + 7, sy - 12);
        ctx.lineTo(sx + 7, sy - 7);
        ctx.fill();
    }

    function endEnemyTurn() {
        state = "MENU";
        canvas.style.display = 'none';
        textBox.style.display = 'block';
        textBox.innerHTML = "* we don't have to fight.<br>* there must be another way!";
    }

    // --- THE SANS WINS ENDING ---
    function triggerForcedFight() {
        state = "FORCED_FIGHT";
        finalPhase = true;
        gameContainer.className = "bg-forest"; // Calm down the background
        
        textBox.style.display = 'block';
        textBox.innerHTML = "* I have no other choice, papyrus.";
        
        buttons[1].classList.add('locked');
        buttons[2].classList.add('locked');
        
        buttons.forEach(b => b.classList.remove('active'));
        menuIndex = 0;
        buttons[0].classList.add('active');
    }

    function triggerFinalEnding() {
        state = "GAMEOVER";
        document.getElementById('papyrus').style.filter = "invert(1) opacity(0.5)";
        
        textBox.innerHTML = "";
        let strike = document.createElement('div');
        strike.style.cssText = "position:absolute; top:200px; left:0; width:100%; height:10px; background:red; animation: slice 0.2s;";
        gameContainer.appendChild(strike);
        
        setTimeout(() => {
            document.getElementById('papyrus').style.display = "none";
            document.getElementById('game-over').innerHTML = "<h1 style='color:red; font-size:60px'>9999999</h1><p style='color:white; font-size:30px'>You won... but at what cost?</p>";
            document.getElementById('game-over').style.display = 'flex';
        }, 1000);
    }

    // Start
    requestAnimationFrame(gameLoop);

</script>
</body>
</html>
