<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Craft Obsidian</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; background: rgba(15, 23, 42, 0.9); padding: 25px; border-radius: 12px; color: white; width: 320px; z-index: 100; border: 1px solid #334155; }
        input, button { width: 100%; padding: 12px; margin-top: 10px; background: #1e293b; color: white; border: 1px solid #475569; border-radius: 6px; box-sizing: border-box; }
        button { background: #8b5cf6; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #7c3aed; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.5); transform: translate(-50%, -50%); pointer-events: none; }
        .hint { font-size: 11px; color: #94a3b8; margin-top: 10px; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="ui">
        <h2 style="margin:0; color:#a78bfa">Obsidian Engine</h2>
        <input type="password" id="apiKey" placeholder="Gemini API Key">
        <input type="text" id="prompt" placeholder="Describe world: 'Sky Islands', 'Deep Caves'...">
        <button id="btn">INITIALIZE WORLD</button>
        <div class="hint">
            <b>Controls:</b> WASD to Move | SPACE to Jump<br>
            <b>Mouse:</b> LEFT Click = Break | RIGHT Click = Place<br>
            <i>Click anywhere on the screen to lock mouse.</i>
        </div>
    </div>
    <div id="crosshair"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let scene, camera, renderer, controls, raycaster;
        let worldData = [];
        const move = { fwd: false, bwd: false, lft: false, rgt: false, jump: false };
        let velocity = new THREE.Vector3();
        let canJump = false;

        // Block Dictionary
        const TYPES = { GRASS: 0, DIRT: 1, STONE: 2, WOOD: 3, LEAVES: 4 };
        const COLORS = [0x5ea44e, 0x8b4513, 0x71717a, 0x78350f, 0x166534];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xbae6fd);
            scene.fog = new THREE.Fog(0xbae6fd, 20, 100);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(8, 15, 8);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(10, 20, 10);
            scene.add(sun);

            controls = new PointerLockControls(camera, document.body);
            document.addEventListener('click', () => { if(!controls.isLocked) controls.lock(); });
            controls.addEventListener('lock', () => { document.getElementById('ui').style.opacity = '0.1'; });
            controls.addEventListener('unlock', () => { document.getElementById('ui').style.opacity = '1'; });

            raycaster = new THREE.Raycaster(new THREE.Vector3(), new THREE.Vector3(0, -1, 0), 0, 2);

            window.addEventListener('keydown', (e) => handleKey(e.code, true));
            window.addEventListener('keyup', (e) => handleKey(e.code, false));
            window.addEventListener('mousedown', handleMouse);

            animate();
        }

        async function fetchAIWorld() {
            const key = document.getElementById('apiKey').value;
            const prompt = document.getElementById('prompt').value || "Classic Minecraft Hills";
            if(!key) return alert("API Key Missing!");

            document.getElementById('btn').innerText = "AI IS ARCHITECTING...";
            
            const system = `You are a 3D Voxel Generator. Output ONLY a valid JSON array. 
            Block types: 0 (Grass), 1 (Dirt), 2 (Stone), 3 (Wood).
            Grid: 16x16. Output format: [{"x":x,"y":y,"z":z,"t":type}]. 
            Focus on: ${prompt}`;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: system }] }] })
                });
                const data = await res.json();
                const text = data.candidates[0].content.parts[0].text;
                const json = JSON.parse(text.match(/\[.*\]/s)[0]);
                renderWorld(json);
                document.getElementById('btn').innerText = "REGENERATE WORLD";
            } catch (e) {
                console.error("AI Build Failed, using fallback terrain.", e);
                generateFallback();
            }
        }

        function renderWorld(data) {
            // Clean up existing blocks
            scene.children = scene.children.filter(c => c.type !== 'Mesh' || c === camera); 
            
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            data.forEach(b => {
                const mat = new THREE.MeshStandardMaterial({ color: COLORS[b.t] || 0xffffff });
                const mesh = new THREE.Mesh(geometry, mat);
                mesh.position.set(b.x, b.y, b.z);
                mesh.name = "block";
                scene.add(mesh);
            });
        }

        function generateFallback() {
            let fallback = [];
            for(let x=0; x<20; x++) {
                for(let z=0; z<20; z++) {
                    const h = Math.floor(Math.random() * 3);
                    fallback.push({x, y:h, z, t:0});
                    fallback.push({x, y:h-1, z, t:1});
                }
            }
            renderWorld(fallback);
        }

        function handleKey(code, val) {
            if(code === 'KeyW') move.fwd = val;
            if(code === 'KeyS') move.bwd = val;
            if(code === 'KeyA') move.lft = val;
            if(code === 'KeyD') move.rgt = val;
            if(code === 'Space') move.jump = val;
        }

        function handleMouse(e) {
            if(!controls.isLocked) return;
            const pointerRay = new THREE.Raycaster();
            pointerRay.setFromCamera({x:0, y:0}, camera);
            const intersects = pointerRay.intersectObjects(scene.children);

            if (intersects.length > 0) {
                const hit = intersects[0];
                if (e.button === 0) { // Left Click - Break
                    scene.remove(hit.object);
                } else if (e.button === 2) { // Right Click - Place
                    const pos = hit.point.add(hit.face.normal.multiplyScalar(0.5));
                    const geometry = new THREE.BoxGeometry(1, 1, 1);
                    const mat = new THREE.MeshStandardMaterial({ color: COLORS[2] });
                    const block = new THREE.Mesh(geometry, mat);
                    block.position.set(Math.round(pos.x), Math.round(pos.y), Math.round(pos.z));
                    block.name = "block";
                    scene.add(block);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls.isLocked) {
                // Gravity & Collision
                raycaster.ray.origin.copy(camera.position);
                raycaster.ray.origin.y -= 1.5;
                const intersections = raycaster.intersectObjects(scene.children);
                const onGround = intersections.length > 0;

                const delta = 0.1;
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 2.0 * delta; // Gravity

                if (onGround) {
                    velocity.y = Math.max(0, velocity.y);
                    canJump = true;
                }

                if (move.fwd) velocity.z += 40.0 * delta;
                if (move.bwd) velocity.z -= 40.0 * delta;
                if (move.lft) velocity.x -= 40.0 * delta;
                if (move.rgt) velocity.x += 40.0 * delta;
                if (move.jump && canJump) {
                    velocity.y += 15;
                    canJump = false;
                }

                controls.moveRight(velocity.x * delta);
                controls.moveForward(velocity.z * delta);
                camera.position.y += (velocity.y * delta);

                if (camera.position.y < -10) { // Void respawn
                    camera.position.set(8, 15, 8);
                    velocity.y = 0;
                }
            }
            renderer.render(scene, camera);
        }

        init();
        document.getElementById('btn').onclick = fetchAIWorld;
    </script>
</body>
</html>
