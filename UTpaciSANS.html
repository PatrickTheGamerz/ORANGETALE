<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mice on Venus - Unbreakable Full Sequence</title>
    <style>
        :root { --p-blue: #00d2ff; --p-bg: #0d0d0f; }
        body { background: var(--p-bg); color: white; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .piano-container { background: #16161a; border: 1px solid #2a2a2e; padding: 50px; border-radius: 20px; text-align: center; width: 480px; box-shadow: 0 40px 100px rgba(0,0,0,0.8); }
        .measure-tag { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 5px; margin-bottom: 15px; }
        .active-chord { font-size: 36px; font-weight: 200; color: var(--p-blue); height: 50px; text-shadow: 0 0 20px rgba(0, 210, 255, 0.4); margin: 20px 0; }
        .progress-rail { width: 100%; height: 3px; background: #222; border-radius: 2px; position: relative; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: var(--p-blue); box-shadow: 0 0 10px var(--p-blue); transition: width 0.1s linear; }
        button { background: var(--p-blue); color: #000; border: none; padding: 20px 50px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.3s; font-size: 16px; width: 100%; margin-top: 30px; }
        button:hover { transform: translateY(-2px); filter: brightness(1.1); }
    </style>
</head>
<body>

<div class="piano-container">
    <div class="measure-tag" id="mDisplay">Ready to Begin</div>
    <div class="active-chord" id="cDisplay">---</div>
    <div class="progress-rail"><div class="progress-bar" id="pBar"></div></div>
    <button id="startBtn">START FULL SEQUENCER</button>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// Accurate Frequency Mapping
const HZ = {
    'G2': 98.00, 'Ab2': 103.83, 'Bb2': 116.54, 'C3': 130.81, 'Eb3': 155.56, 'F3': 174.61, 'F#3': 185.00, 'Ab3': 207.65, 'Bb3': 233.08,
    'C4': 261.63, 'D4': 293.66, 'Eb4': 311.13, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00, 'Ab4': 415.30, 'Bb4': 466.16,
    'C5': 523.25, 'D5': 587.33, 'Eb5': 622.25, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99, 'C6': 1046.50
};

const BPM = 108; // Tempo from the newest sheets
const beatDur = 60 / BPM;

// THE FULL SCORE (m=measure, b=beat, n=notes, d=duration)
const score = [
    // Measures 1-11: The Foundation
    {m:1, b:0, n:['C3','C4','E4'], d:4}, {m:1, b:2, n:['C4','E4'], d:2},
    {m:2, b:4, n:['C3','C4','E4'], d:4}, {m:2, b:6, n:['C4','E4'], d:2},
    {m:3, b:8, n:['C3','C4','E4'], d:4}, {m:3, b:10, n:['C4','E4'], d:2},
    {m:4, b:12, n:['C3','C4','E4'], d:4}, {m:4, b:14, n:['C4','E4'], d:2},
    {m:5, b:16, n:['Ab3','C4','E4','G4'], d:4}, {m:5, b:18, n:['C4','E4','G4'], d:2},
    {m:6, b:20, n:['C3','C4','E4','G4'], d:4}, {m:6, b:22, n:['C4','E4','G4'], d:2},
    {m:7, b:24, n:['Ab3','C4','E4','G4'], d:4}, {m:7, b:26, n:['C4','E4','G4'], d:2},
    {m:8, b:28, n:['C3','C4','E4','G4'], d:4}, {m:8, b:30, n:['C4','E4','G4'], d:2},
    {m:9, b:32, n:['C3','C4','E4','G4'], d:4}, {m:9, b:34, n:['C4','E4','G4'], d:2},
    {m:10,b:36, n:['C3','C4','E4','G4'], d:4}, {m:10,b:38, n:['C4','E4','G4'], d:2},
    {m:11,b:40, n:['F#3','E5'], d:2}, {m:11,b:42, n:['G5'], d:1}, {m:11,b:43, n:['C6'], d:1},

    // Measures 12-21: The First Development
    {m:12,b:44, n:['C3','G4','C5','Eb5'], d:4}, {m:12,b:46, n:['G4','C5','Eb5'], d:2},
    {m:13,b:48, n:['Ab2','Ab4','C5','Eb5'], d:4}, {m:13,b:50, n:['Ab4','C5','Eb5'], d:2},
    {m:14,b:52, n:['Bb2','Bb4','D5','G5'], d:4}, {m:14,b:54, n:['Bb4','D5','G5'], d:2},
    {m:15,b:56, n:['C3','G4','C5','Eb5'], d:4}, {m:15,b:58, n:['G4','C5','Eb5'], d:2},
    {m:16,b:60, n:['C3','G4','C5','Eb5'], d:4}, {m:16,b:62, n:['G4','C5','Eb5'], d:2},
    {m:17,b:64, n:['Ab2','Ab4','C5','Eb5'], d:4}, {m:17,b:66, n:['Ab4','C5','Eb5'], d:2},
    {m:18,b:68, n:['Bb2','Bb4','D5','G5'], d:4}, {m:18,b:70, n:['Bb4','D5','G5'], d:2},
    {m:19,b:72, n:['C3','G4','C5','Eb5'], d:4}, {m:19,b:74, n:['G4','C5','Eb5'], d:2},
    {m:20,b:76, n:['G2','Bb4','D5'], d:2}, {m:20,b:78, n:['Bb2','C5','Eb5'], d:2},
    {m:21,b:80, n:['C3','Eb5','G5','C6'], d:4},

    // --- NEW MEASURES (22-28) ---
    {m:22,b:84, n:['C3','G4','C5','Eb5'], d:4}, {m:22,b:86, n:['G4','C5','Eb5'], d:2},
    {m:23,b:88, n:['Ab2','Ab4','C5','Eb5'], d:4}, {m:23,b:90, n:['Ab4','C5','Eb5'], d:2},
    {m:24,b:92, n:['Bb2','Bb4','D5','F5'], d:4}, {m:24,b:94, n:['Bb4','D5','F5'], d:2},
    {m:25,b:96, n:['C3','G4','C5','Eb5'], d:4}, {m:25,b:98, n:['G4','C5','Eb5'], d:2},
    {m:26,b:100, n:['C3','G4','C5','Eb5'], d:4}, {m:26,b:102, n:['G4','C5','Eb5'], d:2},
    {m:27,b:104, n:['Ab2','Ab4','C5','Eb5'], d:4}, {m:27,b:106, n:['Ab4','C5','Eb5'], d:2},
    {m:28,b:108, n:['Bb2','Bb4','D5','F5'], d:4}, {m:28,b:110, n:['Bb4','D5','F5'], d:2}
];

function playFeltPiano(freq, start, duration) {
    const osc = audioCtx.createOscillator();
    const noise = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    osc.type = 'sine';
    noise.type = 'triangle';
    osc.frequency.setValueAtTime(freq, start);
    noise.frequency.setValueAtTime(freq, start);

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(900, start); // Warm, felt tone

    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(0.12, start + 0.02); // Strike
    gain.gain.exponentialRampToValueAtTime(0.001, start + (duration * beatDur) + 2); // Sustain/Release

    osc.connect(filter); noise.connect(filter);
    filter.connect(gain); gain.connect(audioCtx.destination);

    osc.start(start); noise.start(start);
    osc.stop(start + (duration * beatDur) + 3); noise.stop(start + (duration * beatDur) + 3);
}

let currentStep = 0;
let masterStartTime = 0;

function scheduler() {
    while (currentStep < score.length) {
        const item = score[currentStep];
        const schedTime = masterStartTime + (item.b * beatDur);

        if (schedTime > audioCtx.currentTime + 0.1) break;

        item.n.forEach(note => playFeltPiano(HZ[note], schedTime, item.d));

        // UI Sync
        setTimeout(() => {
            document.getElementById('mDisplay').innerText = `Measure ${item.m.toString().padStart(2, '0')} / 28`;
            document.getElementById('cDisplay').innerText = item.n.join(' • ');
            document.getElementById('pBar').style.width = (item.b / 112) * 100 + '%';
        }, (schedTime - audioCtx.currentTime) * 1000);

        currentStep++;
    }
    if (currentStep < score.length) {
        requestAnimationFrame(scheduler);
    } else {
        // Loop after last measure
        setTimeout(() => { currentStep = 0; masterStartTime = audioCtx.currentTime; scheduler(); }, 5000);
    }
}

document.getElementById('startBtn').addEventListener('click', () => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    document.getElementById('startBtn').style.display = 'none';
    masterStartTime = audioCtx.currentTime;
    scheduler();
});
</script>
</body>
</html>
