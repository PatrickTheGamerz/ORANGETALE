<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UT PACIFIST: SANS BATTLE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');
        :root { --red: #ff0000; --gold: #ffcc00; --cyan: #00ffff; --blue: #3b82f6; --white: #ffffff; }
        
        body { background: #000; color: #fff; font-family: 'Courier Prime', monospace; margin: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
        #game-window { width: 900px; height: 750px; border: 4px solid #fff; position: relative; background: #000; }

        /* HUD - ALL ON ONE LEVEL */
        #hud { position: absolute; bottom: 120px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 15px; font-size: 24px; font-weight: bold; }
        #name-lv { margin-right: 20px; }
        .hp-bar-bg { width: 100px; height: 20px; background: red; border: 1px solid #fff; position: relative; }
        #hp-fill { height: 100%; background: var(--gold); width: 100%; transition: width 0.1s; }
        #hp-text { margin-left: 10px; width: 120px; }

        /* ARENA */
        #battle-box { position: absolute; bottom: 180px; left: 50%; transform: translateX(-50%); width: 400px; height: 180px; border: 5px solid #fff; background: #000; overflow: hidden; }
        #soul { width: 16px; height: 16px; position: absolute; z-index: 1000; }
        
        /* FIGHT BAR MINI-GAME */
        #fight-bar-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; z-index: 500; }
        #fight-aim { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 380px; height: 120px; border: 4px solid #fff; background: url('https://i.imgur.com/Bf98S0D.png') center/cover; }
        #aim-line { position: absolute; left: 0; top: 0; width: 8px; height: 100%; background: #fff; box-shadow: 0 0 10px #fff; }

        /* DIALOGUE & MENU */
        #text-box { position: absolute; bottom: 180px; left: 50%; transform: translateX(-50%); width: 390px; height: 170px; background: #000; border: 4px solid #fff; padding: 20px; font-size: 24px; box-sizing: border-box; white-space: pre-wrap; z-index: 10; display: block; }
        #menu-bar { position: absolute; bottom: 25px; width: 100%; display: flex; justify-content: space-around; padding: 0 40px; box-sizing: border-box; }
        .btn { width: 160px; height: 50px; border: 3px solid #ff8000; color: #ff8000; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; }
        .btn.selected { color: #ffff00; border-color: #ffff00; }

        /* SANS SPRITE (1:1 GEOMETRY) */
        #sans-container { position: absolute; top: 60px; width: 100%; text-align: center; }
        .skeleton { width: 100px; height: 140px; border: 3px solid #fff; margin: 0 auto; background: #000; }

        .bone { position: absolute; background: #fff; }
    </style>
</head>
<body>

<div id="game-window">
    <div id="sans-container">
        <div class="skeleton"></div>
    </div>

    <div id="battle-box">
        <div id="soul">
            <svg viewBox="0 0 32 32"><path id="soul-svg" d="M16,28.3L3.7,16c-2.3-2.3-2.3-6.1,0-8.5c2.3-2.3,6.1-2.3,8.5,0l3.8,3.8l3.8-3.8c2.3-2.3,6.1-2.3,8.5,0c2.3,2.3,2.3,6.1,0,8.5L16,28.3z" fill="red"/></svg>
        </div>
        <div id="fight-bar-container">
            <div id="fight-aim"><div id="aim-line"></div></div>
        </div>
    </div>

    <div id="text-box"></div>

    <div id="hud">
        <div id="name-lv"><span id="p-name">PLAYER</span> LV 1</div>
        <div style="font-size: 14px; margin-top: 5px;">HP</div>
        <div class="hp-bar-bg"><div id="hp-fill"></div></div>
        <div id="hp-text">20 / 20</div>
    </div>

    <div id="menu-bar">
        <div class="btn selected" id="b0">FIGHT</div>
        <div class="btn" id="b1">ACT</div>
        <div class="btn" id="b2">ITEM</div>
        <div class="btn" id="b3">MERCY</div>
    </div>
</div>

<script>
    const team = sessionStorage.getItem('team') || 'FRISK';
    const STATE = {
        hp: 20, max: 20, owner: 'PLAYER', phase: 'MENU',
        menuIdx: 0,
        soul: { x: 192, y: 82, vY: 0, gravity: false, grounded: false, invuln: 0, jump: -6 },
        fightBar: { pos: 0, dir: 1, active: false },
        keys: {}
    };

    const soul = document.getElementById('soul');
    const box = document.getElementById('battle-box');
    const textBox = document.getElementById('text-box');
    const aimLine = document.getElementById('aim-line');

    /** 🗣️ DIALOGUE SYSTEM **/
    function typeWriter(text) {
        textBox.innerHTML = "";
        STATE.phase = 'TYPING';
        let i = 0;
        const interval = setInterval(() => {
            textBox.innerHTML += text[i];
            i++;
            if (i >= text.length) {
                clearInterval(interval);
                STATE.phase = 'MENU';
            }
        }, 40);
    }

    /** ⚔️ FIGHT MINI-GAME **/
    function startFightBar() {
        STATE.phase = 'FIGHT_AIM';
        document.getElementById('fight-bar-container').style.display = 'block';
        textBox.style.display = 'none';
        STATE.fightBar.pos = 0;
        STATE.fightBar.active = true;
    }

    function moveFightBar() {
        if (!STATE.fightBar.active) return;
        STATE.fightBar.pos += 5 * STATE.fightBar.dir;
        if (STATE.fightBar.pos >= 370 || STATE.fightBar.pos <= 0) STATE.fightBar.dir *= -1;
        aimLine.style.left = STATE.fightBar.pos + 'px';
        requestAnimationFrame(moveFightBar);
    }

    /** 💓 PHYSICS & COLLISION **/
    function loop() {
        if (STATE.phase === 'ATTACK') {
            if (STATE.soul.invuln > 0) STATE.soul.invuln--;
            let speed = 3.5;

            // Manual Control for both Player and Frisk
            if (STATE.soul.gravity) {
                if ((STATE.keys['ArrowUp'] || STATE.keys['z']) && STATE.soul.grounded) {
                    STATE.soul.vY = STATE.soul.jump;
                    STATE.soul.grounded = false;
                }
                STATE.soul.vY += 0.25; 
                STATE.soul.y += STATE.soul.vY;
            } else {
                if (STATE.keys['ArrowUp']) STATE.soul.y -= speed;
                if (STATE.keys['ArrowDown']) STATE.soul.y += speed;
            }
            if (STATE.keys['ArrowLeft']) STATE.soul.x -= speed;
            if (STATE.keys['ArrowRight']) STATE.soul.x += speed;

            // Bounds
            STATE.soul.x = Math.max(0, Math.min(box.clientWidth - 21, STATE.soul.x));
            STATE.soul.y = Math.max(0, Math.min(box.clientHeight - 21, STATE.soul.y));
            
            if (STATE.soul.y >= box.clientHeight - 21) {
                STATE.soul.y = box.clientHeight - 21;
                STATE.soul.vY = 0;
                STATE.soul.grounded = true;
            }
            soul.style.left = STATE.soul.x + 'px';
            soul.style.top = STATE.soul.y + 'px';
        }
        requestAnimationFrame(loop);
    }

    function checkHit(el) {
        if (STATE.soul.invuln > 0) return;
        const sR = soul.getBoundingClientRect();
        const eR = el.getBoundingClientRect();
        if (!(sR.right < eR.left || sR.left > eR.right || sR.bottom < eR.top || sR.top > eR.bottom)) {
            STATE.hp = Math.max(0, STATE.hp - 1);
            STATE.soul.invuln = 40;
            updateHUD();
            if (STATE.hp <= 0) alert("GAME OVER");
        }
    }

    /** 🕹️ MENU & INPUT **/
    function confirmSelection() {
        if (STATE.phase === 'MENU') {
            if (STATE.menuIdx === 0) startFightBar();
            else startAttack();
        } else if (STATE.phase === 'FIGHT_AIM') {
            STATE.fightBar.active = false;
            document.getElementById('fight-bar-container').style.display = 'none';
            // Trigger damage animation here if needed
            startAttack();
        }
    }

    function startAttack() {
        STATE.phase = 'ATTACK';
        textBox.style.display = 'none';
        if (Math.random() > 0.5) {
            STATE.soul.gravity = true;
            document.getElementById('soul-svg').setAttribute('fill', 'blue');
        }
        
        // Spawn 1:1 Bone Attack
        for (let i = 0; i < 6; i++) {
            setTimeout(() => {
                if (STATE.phase !== 'ATTACK') return;
                const b = document.createElement('div');
                b.className = 'bone';
                b.style.width = '15px'; b.style.height = '60px';
                b.style.left = '400px'; b.style.bottom = '0px';
                box.appendChild(b);
                let x = 400;
                const m = setInterval(() => {
                    x -= 4; b.style.left = x + 'px';
                    checkHit(b);
                    if (x < -20) { clearInterval(m); b.remove(); }
                }, 16);
            }, i * 800);
        }

        setTimeout(() => {
            STATE.phase = 'MENU';
            STATE.soul.gravity = false;
            document.getElementById('soul-svg').setAttribute('fill', 'red');
            textBox.style.display = 'block';
            typeWriter("* Sans looks like he's \n  about to take a nap.");
        }, 6000);
    }

    function toggleQ() {
        STATE.owner = (STATE.owner === 'PLAYER' ? team : 'PLAYER');
        document.getElementById('p-name').innerText = STATE.owner;
        document.getElementById('p-name').style.color = (STATE.owner === 'FRISK' ? 'var(--purple)' : 'var(--cyan)');
    }

    window.onkeydown = (e) => {
        STATE.keys[e.key] = true;
        if (e.key === 'q' || e.key === 'Q') toggleQ();
        if (STATE.phase === 'MENU') {
            if (e.key === 'ArrowLeft') STATE.menuIdx = (STATE.menuIdx + 3) % 4;
            if (e.key === 'ArrowRight') STATE.menuIdx = (STATE.menuIdx + 1) % 4;
            document.querySelectorAll('.btn').forEach((b,i) => b.classList.toggle('selected', i === STATE.menuIdx));
            if (e.key === 'z' || e.key === 'Z') confirmSelection();
        } else if (STATE.phase === 'FIGHT_AIM') {
            if (e.key === 'z' || e.key === 'Z') confirmSelection();
        }
    };
    window.onkeyup = (e) => STATE.keys[e.key] = false;

    function updateHUD() {
        document.getElementById('hp-fill').style.width = (STATE.hp / STATE.max * 100) + '%';
        document.getElementById('hp-text').innerText = `${STATE.hp} / ${STATE.max}`;
    }

    typeWriter("* You feel your sins crawling \n  on your back.");
    loop();
    moveFightBar();
</script>
</body>
</html>
