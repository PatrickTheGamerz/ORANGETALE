<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DUSTTRUST: 3D ENCOUNTER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body {
            margin: 0; overflow: hidden; background: #000;
            font-family: 'VT323', monospace; color: white; user-select: none;
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* Top HUD */
        #top-hud {
            padding: 20px 40px; font-size: 36px; text-shadow: 2px 2px #000;
            display: flex; justify-content: space-between;
        }

        /* Dialogue Box for Papyrus */
        #dialogue-container {
            position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
            width: 500px; background: rgba(0,0,0,0.9); border: 4px solid white; border-radius: 10px;
            padding: 20px; font-size: 32px; display: none; text-align: center;
        }

        /* Sans's Narrative Text Box */
        #narrative-box {
            position: absolute; bottom: 180px; left: 50%; transform: translateX(-50%);
            width: 760px; height: 120px; background: black; border: 4px solid white;
            padding: 20px; font-size: 32px; display: none; pointer-events: auto;
        }

        /* Bottom UI */
        #bottom-ui {
            padding: 10px 40px 30px 40px; display: flex; flex-direction: column; align-items: center;
            background: rgba(0,0,0,0.9); border-top: 4px solid white; pointer-events: auto;
        }

        #stats-bar {
            display: flex; align-items: center; font-size: 36px; margin-bottom: 20px; width: 800px;
        }

        .hp-box { width: 150px; height: 30px; background: red; margin: 0 15px; border: 2px solid #555; position: relative; }
        #hp-fill { height: 100%; background: #ffff00; width: 100%; transition: width 0.1s; }
        #kr-fill { height: 100%; background: #c800ff; position: absolute; right: 0; top: 0; width: 0%; transition: width 0.1s; }

        #action-buttons {
            display: flex; justify-content: space-between; width: 800px;
        }

        .action-btn {
            background: black; color: #ff8c00; border: 4px solid #ff8c00;
            width: 170px; height: 60px; font-size: 36px; font-family: inherit;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: 0.1s;
        }

        .action-btn:hover { background: #ff8c00; color: black; }
        .action-btn:disabled { border-color: #555; color: #555; cursor: not-allowed; }

        /* Game Over Screen */
        #game-over {
            position: absolute; inset: 0; background: black; z-index: 100;
            display: none; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto;
        }
        .go-text { font-size: 120px; letter-spacing: 5px; margin: 0; color: #fff; }
        .paps-quote { font-size: 40px; color: #ff8c00; margin-top: 20px; font-style: italic; }
        .retry-btn { margin-top: 60px; font-size: 40px; background: none; color: white; border: 2px solid white; padding: 10px 30px; cursor: pointer; font-family: inherit; }
        .retry-btn:hover { background: white; color: black; }

        /* Ending Screen */
        #ending-screen {
            position: absolute; inset: 0; background: white; z-index: 100;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            animation: fadeToBlack 4s forwards;
        }
        @keyframes fadeToBlack {
            0% { background: white; }
            100% { background: black; }
        }

        #controls-hint { position: absolute; left: 20px; bottom: 180px; font-size: 24px; color: #aaa;}
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="top-hud">
        <span style="color: cyan;">❤️ SANS</span>
        <span style="color: red;">LV 1</span>
    </div>

    <div id="dialogue-container"><div id="paps-dialogue">...</div></div>

    <div id="narrative-box"></div>

    <div id="controls-hint">[WASD] Move <br>[SPACE] Jump<br>Stand still for Blue Bones!</div>

    <div id="bottom-ui">
        <div id="stats-bar">
            <span>HP</span>
            <div class="hp-box"><div id="hp-fill"></div><div id="kr-fill"></div></div>
            <span id="hp-text">20 / 20</span>
            <span style="margin-left: 20px; color: #c800ff;">KR</span>
        </div>
        <div id="action-buttons">
            <button class="action-btn" id="btn-fight" onclick="playerAction('FIGHT')">FIGHT</button>
            <button class="action-btn" id="btn-act" onclick="playerAction('ACT')">ACT</button>
            <button class="action-btn" id="btn-item" onclick="playerAction('ITEM')">ITEM</button>
            <button class="action-btn" id="btn-mercy" disabled>MERCY</button>
        </div>
    </div>
</div>

<div id="game-over">
    <h1 class="go-text">GAME OVER</h1>
    <p class="paps-quote">"I'M SO SORRY, SANS... IT HAD TO BE DONE."</p>
    <button class="retry-btn" onclick="location.reload()">RETRY</button>
</div>

<div id="ending-screen">
    <h1 style="color:red; font-size: 80px; z-index: 101; position: absolute;">9999999</h1>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // --- GAME STATE ---
    const state = {
        hp: 20, maxHp: 20, kr: 0,
        turn: 0, isDodging: false, invuln: 0,
        playerVel: new THREE.Vector3(0, 0, 0),
        actCount: 0, fightCount: 0, items: 2,
        finalTurn: false
    };

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // --- DIALOGUE ARRAYS ---
    const papsActDiag = [
        "SANS... PLEASE DON'T MAKE THIS HARDER.",
        "WE CAN'T GO BACK. I'VE ALREADY KILLED THEM.",
        "THE HUMAN WILL KILL US ALL IF I DON'T DO THIS.",
        "STOP SPARING ME! FIGHT BACK!",
        "I'M DOING THIS FOR OUR OWN GOOD!"
    ];

    const papsFightDiag = [
        "HEH. YOU ACTUALLY TRIED TO HIT ME?",
        "YOU'RE NOT THE ONLY ONE WHO CAN DODGE.",
        "STAY DOWN, SANS!",
        "YOUR LV IS TOO LOW TO KILL ME."
    ];

    // --- 3D ENGINE SETUP ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x1a0505, 0.04);
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 15, 20);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lights
    scene.add(new THREE.AmbientLight(0x442222));
    const spotLight = new THREE.SpotLight(0xffaa00, 2);
    spotLight.position.set(0, 20, -10);
    scene.add(spotLight);

    // --- ARENA ---
    const arenaSize = 24;
    const floorGeo = new THREE.PlaneGeometry(arenaSize, arenaSize);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x110505, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const gridHelper = new THREE.GridHelper(arenaSize, 12, 0xff4400, 0x551100);
    gridHelper.position.y = 0.01;
    scene.add(gridHelper);

    // Player (Cyan Soul)
    const playerMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
    const player = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), playerMat);
    player.position.y = 0.5;
    scene.add(player);

    // Papyrus (Dusttrust)
    const papsGroup = new THREE.Group();
    const papsBody = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.2, 5, 16), new THREE.MeshStandardMaterial({ color: 0xcc5500 }));
    papsBody.position.y = 2.5;
    papsGroup.add(papsBody);
    
    const papsHead = new THREE.Mesh(new THREE.SphereGeometry(1.2, 16, 16), new THREE.MeshStandardMaterial({color: 0xffffff}));
    papsHead.position.y = 5.8;
    papsGroup.add(papsHead);
    
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), new THREE.MeshBasicMaterial({color: 0xff4400}));
    eye.position.set(0.5, 6, 1.1);
    papsGroup.add(eye);

    papsGroup.position.set(0, 0, -15);
    scene.add(papsGroup);

    // --- PROJECTILES ---
    let projectiles = [];

    function spawnBone(x, z, h, vx, vz, isBlue) {
        const geo = new THREE.CylinderGeometry(0.4, 0.4, h, 8);
        const mat = new THREE.MeshBasicMaterial({ 
            color: isBlue ? 0x00ffff : 0xffffff,
            transparent: true, opacity: 0.9
        });
        const bone = new THREE.Mesh(geo, mat);
        bone.position.set(x, h/2, z);
        scene.add(bone);
        projectiles.push({ mesh: bone, type: 'bone', vx, vz, isBlue, w: 0.8, h: h });
    }

    function spawnBlaster(x, y, z, aimX, aimZ) {
        const warn = new THREE.Mesh(
            new THREE.CylinderGeometry(0.2, 0.2, 50, 8), 
            new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.4 })
        );
        warn.rotation.x = Math.PI/2;
        warn.position.set(x, y, z);
        warn.lookAt(aimX, y, aimZ);
        warn.translateZ(25);
        scene.add(warn);
        projectiles.push({ mesh: warn, type: 'blaster', timer: 45, px: x, pz: z, ax: aimX, az: aimZ });
    }

    // --- GAME LOGIC ---
    function toggleButtons(enabled) {
        document.querySelectorAll('.action-btn').forEach(b => b.disabled = !enabled);
        document.getElementById('btn-mercy').disabled = true;
        if(state.items <= 0) document.getElementById('btn-item').disabled = true;
    }

    function playerAction(type) {
        toggleButtons(false);
        const nav = document.getElementById('narrative-box');
        nav.style.display = 'block';

        if(state.finalTurn && type === 'FIGHT') {
            triggerEnding();
            return;
        }

        if (type === 'FIGHT') {
            nav.innerHTML = "* you swing with all your might.<br>* he easily dodges.";
            state.fightCount++;
            
            let dodgeInterval = setInterval(() => {
                papsGroup.position.x += 1;
                if(papsGroup.position.x > 8) {
                    clearInterval(dodgeInterval);
                    setTimeout(() => triggerPapyrusDiag(type), 1500);
                }
            }, 16);
        } 
        else if (type === 'ACT') {
            state.actCount++;
            nav.innerHTML = "* you tell your brother there must be another way.<br>* he refuses to listen.";
            
            if(state.actCount >= 5) {
                setTimeout(prepareFinalTurn, 2000);
                return;
            }
            setTimeout(() => triggerPapyrusDiag(type), 1500);
        }
        else if (type === 'ITEM') {
            state.items--;
            state.hp = Math.min(state.maxHp, state.hp + 10);
            nav.innerHTML = `* you ate a taco. HP recovered.<br>* you have ${state.items} left.`;
            updateHUD();
            setTimeout(() => triggerPapyrusDiag('ACT'), 1500);
        }
    }

    function triggerPapyrusDiag(type) {
        document.getElementById('narrative-box').style.display = 'none';
        papsGroup.position.x = 0; // reset dodge
        
        let arr = type === 'FIGHT' ? papsFightDiag : papsActDiag;
        let idx = Math.min((type === 'FIGHT' ? state.fightCount : state.actCount) - 1, arr.length - 1);
        let text = arr[idx];

        const box = document.getElementById('dialogue-container');
        const pText = document.getElementById('paps-dialogue');
        box.style.display = 'block';
        pText.innerText = '';
        
        let i = 0;
        let typeInt = setInterval(() => {
            pText.innerText += text.charAt(i);
            i++;
            if(i >= text.length) {
                clearInterval(typeInt);
                setTimeout(() => {
                    box.style.display = 'none';
                    startEnemyTurn();
                }, 2000);
            }
        }, 40);
    }

    function startEnemyTurn() {
        state.isDodging = true;
        state.turn++;
        let tick = 0;

        const attackInt = setInterval(() => {
            if(tick > 20 + (state.turn * 5)) {
                clearInterval(attackInt);
                setTimeout(() => { state.isDodging = false; toggleButtons(true); }, 1000);
                return;
            }

            // Dynamic Patterns
            if(state.turn % 2 !== 0) {
                // Wave Pattern (White & Blue)
                let isBlue = Math.random() > 0.5;
                let zPos = player.position.z + (Math.random() * 8 - 4);
                spawnBone(12, zPos, 4, -0.4, 0, isBlue);
                spawnBone(-12, zPos + 2, 4, 0.4, 0, !isBlue);
            } else {
                // Crossfire + Blasters
                if(Math.random() > 0.7) {
                    spawnBlaster(Math.random()*16-8, 1, -12, player.position.x, player.position.z);
                } else {
                    spawnBone(player.position.x + (Math.random()*4-2), 12, 3, 0, -0.3, false);
                }
            }
            tick++;
        }, 300);
    }

    function prepareFinalTurn() {
        document.getElementById('narrative-box').style.display = 'none';
        const box = document.getElementById('dialogue-container');
        box.style.display = 'block';
        document.getElementById('paps-dialogue').innerText = "SANS... I'M TIRED. JUST LET ME FINISH THIS.";
        
        setTimeout(() => {
            box.style.display = 'none';
            state.finalTurn = true;
            toggleButtons(false);
            document.getElementById('btn-fight').disabled = false;
            document.getElementById('narrative-box').style.display = 'block';
            document.getElementById('narrative-box').innerHTML = "* I have no other choice, papyrus.";
        }, 3000);
    }

    function triggerEnding() {
        document.getElementById('narrative-box').style.display = 'none';
        
        // Slash Animation
        const slash = new THREE.Mesh(new THREE.PlaneGeometry(20, 1), new THREE.MeshBasicMaterial({color: 0xff0000}));
        slash.position.set(0, 4, -14);
        slash.rotation.z = Math.PI / 4;
        scene.add(slash);

        setTimeout(() => {
            document.getElementById('ending-screen').style.display = 'flex';
        }, 500);
    }

    function takeDamage(amt, isKr) {
        if(state.invuln > 0) return;
        
        if(isKr) {
            state.kr += amt;
            if(state.hp - state.kr <= 1) state.kr = state.hp - 1;
        } else {
            state.hp -= amt;
        }
        
        state.invuln = 20;
        playerMat.color.setHex(0xff0000);
        setTimeout(() => playerMat.color.setHex(0x00ffff), 200);

        if(state.hp <= 0) {
            state.isDodging = false;
            document.getElementById('game-over').style.display = 'flex';
        }
        updateHUD();
    }

    function updateHUD() {
        let activeHp = Math.max(0, state.hp - state.kr);
        document.getElementById('hp-fill').style.width = (state.hp / state.maxHp * 100) + '%';
        document.getElementById('kr-fill').style.width = (state.kr / state.maxHp * 100) + '%';
        document.getElementById('hp-text').innerText = `${activeHp} / ${state.maxHp}`;
    }

    // --- MAIN LOOP ---
    function animate() {
        requestAnimationFrame(animate);

        if(state.invuln > 0) state.invuln--;

        if (state.isDodging) {
            // Player Movement
            const speed = 0.25;
            let isMoving = false;

            if(keys['KeyW'] || keys['ArrowUp']) { state.playerVel.z = -speed; isMoving = true; }
            else if(keys['KeyS'] || keys['ArrowDown']) { state.playerVel.z = speed; isMoving = true; }
            else state.playerVel.z = 0;

            if(keys['KeyA'] || keys['ArrowLeft']) { state.playerVel.x = -speed; isMoving = true; }
            else if(keys['KeyD'] || keys['ArrowRight']) { state.playerVel.x = speed; isMoving = true; }
            else state.playerVel.x = 0;

            // Jump
            if(keys['Space'] && player.position.y <= 0.51) {
                state.playerVel.y = 0.45;
                isMoving = true;
            }

            state.playerVel.y -= 0.025; // Gravity
            player.position.add(state.playerVel);

            // Floor constraints
            if(player.position.y < 0.5) {
                player.position.y = 0.5;
                state.playerVel.y = 0;
            }
            player.position.x = Math.max(-11, Math.min(11, player.position.x));
            player.position.z = Math.max(-11, Math.min(11, player.position.z));

            // Projectile Updates & Collisions
            for(let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                
                if(p.type === 'bone') {
                    p.mesh.position.x += p.vx;
                    p.mesh.position.z += p.vz;
                    
                    // Collision
                    if(Math.abs(p.mesh.position.x - player.position.x) < 0.8 &&
                       Math.abs(p.mesh.position.z - player.position.z) < 0.8 &&
                       player.position.y < p.h) {
                        
                        // BLUE BONE LOGIC
                        if(p.isBlue) {
                            if(isMoving || Math.abs(state.playerVel.y) > 0.1) takeDamage(1, true);
                        } else {
                            takeDamage(2, true);
                        }
                    }

                    if(Math.abs(p.mesh.position.x) > 15 || Math.abs(p.mesh.position.z) > 15) {
                        scene.remove(p.mesh);
                        projectiles.splice(i, 1);
                    }
                }
                
                if(p.type === 'blaster') {
                    p.timer--;
                    if(p.timer === 0) {
                        p.mesh.scale.set(15, 1, 15);
                        p.mesh.material.color.setHex(0xffffff);
                        p.mesh.material.opacity = 1;
                        
                        const dist = new THREE.Vector2(player.position.x - p.px, player.position.z - p.pz).length();
                        if(dist < 4) takeDamage(10, false); 
                    } else if (p.timer < -10) {
                        scene.remove(p.mesh);
                        projectiles.splice(i, 1);
                    }
                }
            }

            // KR Drain
            if(state.kr > 0 && Math.random() < 0.05) {
                state.kr--;
                state.hp--;
                updateHUD();
                if(state.hp <= 0) {
                    state.isDodging = false;
                    document.getElementById('game-over').style.display = 'flex';
                }
            }
        }

        papsGroup.position.y = Math.sin(Date.now() * 0.005) * 0.3;
        renderer.render(scene, camera);
    }

    // Init
    updateHUD();
    animate();
</script>
</body>
</html>
