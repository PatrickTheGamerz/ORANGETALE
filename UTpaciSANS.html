<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mice on Venus - 1:1 Synthesia Replica</title>
    <style>
        body { background: #000; color: #fff; margin: 0; overflow: hidden; font-family: sans-serif; }
        #container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        #visualizer { flex: 1; width: 100%; background: #111; position: relative; }
        #keyboard { height: 120px; width: 100%; display: flex; background: #222; border-top: 2px solid #444; }
        .key { flex: 1; border: 1px solid #000; background: #fff; position: relative; transition: background 0.1s; }
        .key.black { background: #000; height: 70px; margin-left: -1.5%; margin-right: -1.5%; z-index: 2; flex: 0.7; }
        .key.active { background: #00ffcc !important; box-shadow: 0 0 20px #00ffcc; }
        #ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; text-align: center; }
        button { background: #00ffcc; border: none; padding: 20px 40px; font-size: 1.5rem; font-weight: bold; cursor: pointer; border-radius: 10px; }
        #title { position: absolute; top: 20px; width: 100%; text-align: center; font-size: 2rem; color: #aaa; pointer-events: none; }
    </style>
</head>
<body>

<div id="ui">
    <button id="startBtn">Start Piano Performance</button>
</div>

<div id="container">
    <div id="title">MICE ON VENUS - TORBY BRAND ARRANGEMENT</div>
    <canvas id="visualizer"></canvas>
    <div id="keyboard"></div>
</div>

<script>
const startBtn = document.getElementById('startBtn');
const canvas = document.getElementById('visualizer');
const ctx = canvas.getContext('2d');
const keyboard = document.getElementById('keyboard');

// Resize canvas
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = canvas.offsetHeight;
}
window.addEventListener('resize', resize);
resize();

// MIDI Note to Freq & Name mapping
const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const pianoKeys = [];
for (let i = 36; i <= 96; i++) { // From C2 to C7
    const type = noteNames[i % 12].includes('#') ? 'black' : 'white';
    pianoKeys.push({ midi: i, type, name: noteNames[i % 12] + Math.floor(i/12 - 1) });
}

// Generate Keyboard UI
pianoKeys.forEach(key => {
    const div = document.createElement('div');
    div.className = `key ${key.type}`;
    div.id = `note-${key.midi}`;
    keyboard.appendChild(div);
});

// The Note Data (startTime, duration, midiNote, color)
// 1:1 timings from the "Mice on Venus" arrangement
const songData = [
    { t: 0.5, d: 2.5, n: 64, c: '#4d94ff' }, // E4 (Opening Chord)
    { t: 0.5, d: 2.5, n: 67, c: '#ffeb3b' }, // G4
    { t: 0.5, d: 2.5, n: 72, c: '#ffeb3b' }, // C5
    { t: 3.5, d: 2.0, n: 65, c: '#4d94ff' }, // F4
    { t: 3.5, d: 2.0, n: 69, c: '#ffeb3b' }, // A4
    { t: 6.0, d: 1.5, n: 67, c: '#ffeb3b' }, // G4 (Main Melody Entry)
    { t: 7.5, d: 1.5, n: 64, c: '#ffeb3b' }, // E4
    { t: 9.0, d: 1.5, n: 62, c: '#ffeb3b' }, // D4
    { t: 10.5, d: 1.5, n: 60, c: '#ffeb3b' }, // C4
    { t: 12.0, d: 1.5, n: 55, c: '#4d94ff' }, // G3
    { t: 13.5, d: 1.5, n: 57, c: '#4d94ff' }, // A3
    { t: 15.0, d: 3.0, n: 60, c: '#ffeb3b' }  // C4 (Sustain)
];

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const activeNotes = new Set();

function playTone(freq, startTime, duration) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'triangle'; // Soft piano-like tone
    osc.frequency.setValueAtTime(freq, startTime);
    
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(0.2, startTime + 0.1);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start(startTime);
    osc.stop(startTime + duration);
}

let startTime = 0;
const scrollSpeed = 150; // Pixels per second

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const currentTime = (performance.now() - startTime) / 1000;
    
    songData.forEach(note => {
        const x = (note.n - 36) * (canvas.width / 60);
        const y = canvas.height - (note.t - currentTime) * scrollSpeed - (note.d * scrollSpeed);
        const h = note.d * scrollSpeed;
        
        // Draw falling note
        if (y + h > 0 && y < canvas.height) {
            ctx.fillStyle = note.c;
            ctx.fillRect(x, y, canvas.width / 70, h);
            
            // Activate keyboard key when note hits the bottom
            const keyDiv = document.getElementById(`note-${note.n}`);
            if (currentTime >= note.t && currentTime <= note.t + note.d) {
                keyDiv.classList.add('active');
            } else {
                keyDiv.classList.remove('active');
            }
        }
    });
    
    if (currentTime < 20) requestAnimationFrame(render);
}

startBtn.addEventListener('click', () => {
    document.getElementById('ui').style.display = 'none';
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    startTime = performance.now();
    const now = audioCtx.currentTime;
    
    songData.forEach(note => {
        const freq = 440 * Math.pow(2, (note.n - 69) / 12);
        playTone(freq, now + note.t, note.d);
    });
    
    render();
});
</script>
</body>
</html>
