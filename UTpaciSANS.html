<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Underground: Internal Odyssey</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        #hud { padding: 20px; color: #ffff00; font-size: 20px; text-shadow: 2px 2px #000; }
        
        #dialogue-box {
            position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%);
            width: 80%; background: rgba(0,0,0,0.85); border: 4px solid white;
            padding: 20px; display: none; pointer-events: auto;
        }

        #internal-ui {
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
            text-align: center; display: none; pointer-events: auto;
        }

        .btn {
            background: black; color: white; border: 2px solid white;
            padding: 15px 30px; margin: 10px; cursor: pointer; font-size: 1.2rem;
        }
        .btn:hover { background: white; color: black; font-weight: bold; }
        
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            background: red; border-radius: 50%; transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="hud">❤️ FRISK | LV <span id="lv-val">1</span> | <span id="loc-val">RUINS</span></div>
    <div id="crosshair"></div>

    <div id="dialogue-box">
        <div id="diag-text" style="color: white; font-size: 1.5rem; margin-bottom: 20px;"></div>
        <div id="diag-btns"></div>
    </div>

    <div id="internal-ui">
        <h1 id="stage-name" style="color: #ff99aa; font-size: 3rem; text-shadow: 2px 2px #000;"></h1>
        <p id="stage-desc" style="color: white; font-size: 1.2rem; max-width: 600px; margin: 0 auto;"></p>
        <div id="int-btns" style="margin-top: 30px;"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // --- ENGINE CORE ---
    let scene, camera, renderer, clock;
    let state = { lv: 1, inInternal: false, stage: 'world', npc: null };
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let yaw = 0, pitch = 0;

    // --- 3D OBJECTS ---
    let internalMeshes = [];
    let worldMeshes = [];

    function init() {
        scene = new THREE.Scene();
        clock = new THREE.Clock();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        setupWorld();
        setupLights();
        setupControls();
        animate();
    }

    function setupLights() {
        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(0, 10, 0);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));
    }

    function setupWorld() {
        // Floor
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({color: 0x111111}));
        floor.rotation.x = -Math.PI/2;
        scene.add(floor);

        // Characters (Placeholders as high-quality blocks)
        createNPC("Toriel", 0xffffff, 0, 0, -10, "Goat-like and motherly.");
        createNPC("Muffet", 0x8800ff, 10, 0, -5, "Six arms and five eyes.");
        createNPC("Undyne", 0x00a2ff, -10, 0, -15, "Armored and intense.");
    }

    function createNPC(name, color, x, y, z, desc) {
        const group = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(1, 3, 4, 8), new THREE.MeshStandardMaterial({color: color}));
        body.position.y = 2;
        group.add(body);
        group.position.set(x, y, z);
        group.userData = { name, desc };
        scene.add(group);
        worldMeshes.push(group);
    }

    // --- INTERNAL SCENE GENERATORS ---
    function buildMouth(npcName) {
        clearScene();
        scene.background = new THREE.Color(0x220505);
        
        // The Mouth Chamber
        const mouthGeo = new THREE.SphereGeometry(15, 32, 32);
        const mouthMat = new THREE.MeshStandardMaterial({ color: 0x661111, side: THREE.BackSide, roughness: 0.2 });
        const mouth = new THREE.Mesh(mouthGeo, mouthMat);
        scene.add(mouth);

        // The Tongue (Interactive 3D Mesh)
        const tongueGeo = new THREE.BoxGeometry(10, 2, 15);
        const tongueMat = new THREE.MeshStandardMaterial({ color: 0xff7788 });
        const tongue = new THREE.Mesh(tongueGeo, tongueMat);
        tongue.position.y = -6;
        tongue.name = "tongue";
        scene.add(tongue);

        camera.position.set(0, -3, 5);
        camera.lookAt(0, -3, 0);

        showInternalUI(`INSIDE ${npcName.toUpperCase()}`, 
            `You are standing on a massive, wet tongue. The roof of the mouth is high above, and the walls are slick with saliva. Every breath from ${npcName} sends a warm gale over you.`);
        
        addInternalBtn("Proceed Down the Throat", () => buildThroat(npcName));
    }

    function buildThroat(npcName) {
        clearScene();
        const curve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, 0, 20),
            new THREE.Vector3(0, -10, 0),
            new THREE.Vector3(0, -30, -20)
        ]);
        const tubeGeo = new THREE.TubeGeometry(curve, 20, 4, 12, false);
        const tubeMat = new THREE.MeshStandardMaterial({ color: 0x882233, side: THREE.BackSide });
        const throat = new THREE.Mesh(tubeGeo, tubeMat);
        throat.name = "throat";
        scene.add(throat);

        camera.position.set(0, 0, 18);
        
        showInternalUI("THE THROAT PASSAGE", 
            "The walls are incredibly tight. You feel the rhythmic pulsing of the muscles as you are massaged downward in a heavy, inescapable gulp.");
        
        addInternalBtn("Reach the Stomach", () => buildStomach(npcName));
    }

    function buildStomach(npcName) {
        clearScene();
        const stomachGeo = new THREE.SphereGeometry(20, 32, 32);
        const stomachMat = new THREE.MeshStandardMaterial({ color: 0x440505, side: THREE.BackSide });
        const stomach = new THREE.Mesh(stomachGeo, stomachMat);
        stomach.name = "stomach";
        scene.add(stomach);

        camera.position.set(0, 0, 0);

        showInternalUI(`${npcName.toUpperCase()}'S STOMACH`, 
            "A vast, pulsing chamber. The walls hug you from all sides, and the deep 'thump-thump' of the heart echoes through the fleshy floor.");
        
        addInternalBtn("[ACT] Rest & Rebirth (LV UP)", () => {
            state.lv++;
            document.getElementById('lv-val').innerText = state.lv;
            resetToWorld();
        });
    }

    // --- GAME LOGIC ---
    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getElapsedTime();

        if (!state.inInternal) {
            handleMovement();
        } else {
            // Pulse animations
            const throat = scene.getObjectByName("throat");
            if(throat) throat.scale.set(1 + Math.sin(delta*3)*0.05, 1, 1 + Math.sin(delta*3)*0.05);
            
            const stomach = scene.getObjectByName("stomach");
            if(stomach) stomach.scale.set(1 + Math.sin(delta)*0.03, 1 + Math.sin(delta)*0.03, 1 + Math.sin(delta)*0.03);
        }

        renderer.render(scene, camera);
    }

    function checkInteraction() {
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera({x:0, y:0}, camera);
        const intersects = raycaster.intersectObjects(worldMeshes, true);
        if (intersects.length > 0) {
            const npc = intersects[0].object.parent.userData;
            state.npc = npc;
            showDialogue(npc);
        }
    }

    function showDialogue(npc) {
        const box = document.getElementById('dialogue-box');
        box.style.display = 'block';
        document.getElementById('diag-text').innerText = `* ${npc.name}: "${npc.desc} Would you like to... come closer?"`;
        document.getElementById('diag-btns').innerHTML = `
            <button class="btn" onclick="state.inInternal=true; buildMouth(state.npc.name)">[ACT] Offer Self</button>
            <button class="btn" onclick="document.getElementById('dialogue-box').style.display='none'">[MERCY] Run</button>
        `;
        document.exitPointerLock();
    }

    function showInternalUI(title, desc) {
        document.getElementById('dialogue-box').style.display = 'none';
        document.getElementById('internal-ui').style.display = 'block';
        document.getElementById('stage-name').innerText = title;
        document.getElementById('stage-desc').innerText = desc;
    }

    function addInternalBtn(text, action) {
        const btn = document.createElement('button');
        btn.className = "btn";
        btn.innerText = text;
        btn.onclick = action;
        document.getElementById('int-btns').appendChild(btn);
    }

    function clearScene() {
        while(scene.children.length > 0){ scene.remove(scene.children[0]); }
        setupLights();
        document.getElementById('int-btns').innerHTML = "";
    }

    function resetToWorld() {
        state.inInternal = false;
        document.getElementById('internal-ui').style.display = 'none';
        clearScene();
        setupWorld();
        camera.position.set(0, 1.6, 5);
        renderer.domElement.requestPointerLock();
    }

    // --- CONTROLS & UTILS ---
    function setupControls() {
        document.addEventListener('keydown', (e) => {
            if(e.code === 'KeyW') moveForward = true;
            if(e.code === 'KeyS') moveBackward = true;
            if(e.code === 'KeyE') checkInteraction();
        });
        document.addEventListener('keyup', (e) => {
            if(e.code === 'KeyW') moveForward = false;
            if(e.code === 'KeyS') moveBackward = false;
        });
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI/2, Math.PI/2, pitch);
                camera.rotation.order = 'YXZ';
                camera.rotation.set(pitch, yaw, 0);
            }
        });
        renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());
    }

    function handleMovement() {
        if (moveForward) camera.translateZ(-0.1);
        if (moveBackward) camera.translateZ(0.1);
    }

    init();
</script>
</body>
</html>
