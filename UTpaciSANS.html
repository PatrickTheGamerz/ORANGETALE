<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI DREAM: MINECRAFT HORROR</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        #ui { position: absolute; top: 20px; left: 20px; color: #0f0; z-index: 100; background: rgba(0,0,0,0.8); padding: 15px; border: 1px solid #0f0; border-radius: 8px; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border: 1px solid white; transform: translate(-50%, -50%); pointer-events: none; }
        input { background: #111; color: #0f0; border: 1px solid #0f0; padding: 10px; margin-top: 10px; width: 250px; }
        button { background: #0f0; color: #000; border: none; padding: 10px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; }
        #status { font-size: 10px; margin-top: 10px; color: #888; text-transform: uppercase; }
        #dream-log { font-size: 12px; color: #fff; margin-top: 10px; font-style: italic; }
    </style>
</head>
<body>
    <div id="ui">
        <h2 style="margin:0">DREAM ENGINE 2.0</h2>
        <input type="password" id="apiKey" placeholder="GEMINI API KEY">
        <button id="startBtn">INITIALIZE DREAM</button>
        <div id="status">Status: Waiting for Input...</div>
        <div id="dream-log">"The world is yet to be dreamt."</div>
    </div>
    <div id="crosshair"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let scene, camera, renderer, controls, clock;
        let ground, skybox;
        const move = { fwd: false, bwd: false, lft: false, rgt: false };
        let velocity = new THREE.Vector3();
        let lastPos = new THREE.Vector3();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Ground - The "Floor" of the dream
            const groundGeo = new THREE.PlaneGeometry(100, 100);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Skybox - The "Vision" of the dream
            const skyGeo = new THREE.SphereGeometry(500, 64, 64);
            const skyMat = new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.BackSide });
            skybox = new THREE.Mesh(skyGeo, skyMat);
            scene.add(skybox);

            const light = new THREE.AmbientLight(0xffffff, 1);
            scene.add(light);

            controls = new PointerLockControls(camera, document.body);
            document.addEventListener('click', () => { if(document.getElementById('apiKey').value) controls.lock(); });

            window.addEventListener('keydown', (e) => handleKey(e.code, true));
            window.addEventListener('keyup', (e) => handleKey(e.code, false));

            clock = new THREE.Clock();
            animate();
        }

        async function manifestDream() {
            const key = document.getElementById('apiKey').value;
            const log = document.getElementById('dream-log');
            const status = document.getElementById('status');
            
            status.innerText = "Status: HALLUCINATING...";
            
            // Ask AI to describe a high-detail Minecraft image
            const prompt = "Describe a photorealistic but cursed Minecraft landscape in 10 words. No chat, just the description.";
            
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                const description = data.candidates[0].content.parts[0].text.trim();
                log.innerText = `"${description}"`;

                // Use Unsplash or Source.Unsplash to get a "Minecraft-like" AI image based on the prompt
                const imgUrl = `https://source.unsplash.com/featured/?minecraft,${encodeURIComponent(description)}`;
                const loader = new THREE.TextureLoader();
                
                loader.load(imgUrl, (texture) => {
                    skybox.material.map = texture;
                    skybox.material.needsUpdate = true;
                    ground.material.map = texture;
                    ground.material.needsUpdate = true;
                    status.innerText = "Status: REALITY STABLE";
                });

            } catch (e) {
                status.innerText = "Status: DREAM FAILED (Check API Key)";
                console.error(e);
            }
        }

        function handleKey(code, val) {
            if(code === 'KeyW') move.fwd = val;
            if(code === 'KeyS') move.bwd = val;
            if(code === 'KeyA') move.lft = val;
            if(code === 'KeyD') move.rgt = val;
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls.isLocked) {
                const delta = clock.getDelta();
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                if (move.fwd) velocity.z += 40.0 * delta;
                if (move.bwd) velocity.z -= 40.0 * delta;
                if (move.lft) velocity.x -= 40.0 * delta;
                if (move.rgt) velocity.x += 40.0 * delta;

                controls.moveRight(velocity.x * delta);
                controls.moveForward(velocity.z * delta);

                // Trigger new dream if player moves a certain distance
                if (camera.position.distanceTo(lastPos) > 10) {
                    manifestDream();
                    lastPos.copy(camera.position);
                }
            }
            renderer.render(scene, camera);
        }

        document.getElementById('startBtn').onclick = () => {
            init();
            manifestDream();
            document.getElementById('ui').style.background = "rgba(0,0,0,0.3)";
        };
    </script>
</body>
</html>
