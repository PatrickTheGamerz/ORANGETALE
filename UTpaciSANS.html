<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinner in the Underground</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #game-container {
            width: 600px;
            background: #000;
            border: 4px solid #fff;
            padding: 20px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        #scene-image {
            width: 100%;
            height: 200px;
            background: #222;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #444;
            font-style: italic;
            color: #888;
        }

        #text-display {
            font-size: 1.2rem;
            line-height: 1.5;
            margin-bottom: 30px;
            min-height: 100px;
        }

        .button-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        button:hover {
            background: #fff;
            color: #000;
        }

        .flavor-text {
            color: #ffff00;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="scene-image">Visualizing the Underground...</div>
    <div id="text-display">
        You wake up on a bed of golden flowers. Your stomach growls. This might be a problem.
    </div>
    <div class="button-container" id="choices">
        </div>
</div>

<script>
    const textDisplay = document.getElementById('text-display');
    const choicesContainer = document.getElementById('choices');
    const sceneDisplay = document.getElementById('scene-image');

    const gameState = {
        currentScene: 'start'
    };

    const scenes = {
        'start': {
            text: "You wander into a cozy, purple-brick hallway. The smell of <span class='flavor-text'>Butterscotch Pie</span> is overwhelming. Toriel stands there, smiling widely.",
            image: "",
            choices: [
                { text: "Ask for a slice", next: 'toriel_pie' },
                { text: "Tell her YOU are hungry", next: 'toriel_hungry' }
            ]
        },
        'toriel_pie': {
            text: "Toriel beams. 'Oh, little one! I have just the thing.' She brings out a pie, but it's massive. She watches you eat with a strange, hungry intensity.",
            image: "",
            choices: [
                { text: "Finish every last bite", next: 'toriel_full' },
                { text: "Compliment the chef", next: 'toriel_hug' }
            ]
        },
        'toriel_hungry': {
            text: "Toriel tilts her head. 'Hungry? Well, a growing human needs to be... contained.' She opens her arms for a 'hug' that looks a bit too much like an enclosure.",
            image: "",
            choices: [
                { text: "Accept the 'hug'", next: 'toriel_gulp' },
                { text: "Run toward the basement", next: 'muffet_encounter' }
            ]
        },
        'toriel_gulp': {
            text: "Toriel's hug is... all-encompassing. You realize too late that she doesn't want you to leave the house. Ever. In fact, you're becoming part of the 'inner circle' of her heart. Literally. <br><br><span class='flavor-text'>ENDING: HOME IS WHERE THE HEART (AND STOMACH) IS.</span>",
            image: "",
            choices: [{ text: "Restart?", next: 'start' }]
        },
        'muffet_encounter': {
            text: "You sprint away and find yourself caught in a giant purple web. Muffet descends on a strand, giggling. 'Ufufu~ Did I hear someone wanted to be part of our tea party?'",
            image: "",
            choices: [
                { text: "Offer her 500G", next: 'muffet_greedy' },
                { text: "Tell her she looks 'tasty'", next: 'muffet_gulp' }
            ]
        },
        'muffet_gulp': {
            text: "Muffet blushes with all five eyes. 'How forward! I think I'll start with your toes.' The spiders wrap you up like a delicious croissant. You are the main course! <br><br><span class='flavor-text'>ENDING: THE EXPENSIVE ENTREE.</span>",
            image: "",
            choices: [{ text: "Restart?", next: 'start' }]
        },
        'toriel_full': {
            text: "You're so full of pie you can't move. Toriel sighs happily. 'Now you'll stay put while I fetch the tea.' You're effectively a decorative (and edible) furniture piece now.",
            image: "",
            choices: [{ text: "Restart?", next: 'start' }]
        }
        // More scenes can be added here
    };

    function renderScene(sceneKey) {
        const scene = scenes[sceneKey];
        textDisplay.innerHTML = scene.text;
        sceneDisplay.innerText = scene.image;
        choicesContainer.innerHTML = '';

        scene.choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.innerText = choice.text;
            btn.onclick = () => renderScene(choice.next);
            choicesContainer.appendChild(btn);
        });
    }

    // Initialize
    renderScene('start');
</script>

</body>
</html>
