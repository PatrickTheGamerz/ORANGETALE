<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Piano Sheet Music Loop</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .controls { background: #222; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
        button { background: #4facfe; border: none; padding: 10px 20px; color: white; border-radius: 5px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background: #00f2fe; }
        .note-display { margin-top: 20px; font-size: 24px; color: #4facfe; height: 30px; }
        .status { font-size: 12px; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

<div class="controls">
    <h2>Piano Loop</h2>
    <button id="playBtn">Start Music Loop</button>
    <div class="note-display" id="noteDisplay">---</div>
    <div class="status" id="status">Based on your provided sheet music</div>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// Frequencies for the notes in your sheet
const notes = {
    'C3': 130.81, 'Ab3': 207.65, 'F#3': 185.00,
    'C4': 261.63, 'E4': 329.63, 'G4': 392.00,
    'E5': 659.25, 'G5': 783.99, 'C6': 1046.50
};

// The sequence from your image (simplified into steps)
const sequence = [
    { rh: ['C4', 'E4'], lh: 'C3', label: "Measures 1-4: C Major Dyad" },
    { rh: ['C4', 'E4', 'G4'], lh: 'Ab3', label: "Measure 5: C/Ab" },
    { rh: ['C4', 'E4', 'G4'], lh: 'C3', label: "Measure 6: C Major" },
    { rh: ['C4', 'E4', 'G4'], lh: 'Ab3', label: "Measure 7: C/Ab" },
    { rh: ['C4', 'E4', 'G4'], lh: 'C3', label: "Measures 8-10: C Major" },
    { rh: ['E5'], lh: 'F#3', label: "Measure 11: E over F#" },
    { rh: ['G5'], lh: 'F#3', label: "Measure 11: G over F#" },
    { rh: ['C6'], lh: 'F#3', label: "Measure 11: High C over F#" }
];

function playTone(freq, start, duration) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle'; // Softer, piano-like tone
    osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(0.2, start);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + duration);
}

let step = 0;
function playLoop() {
    const item = sequence[step];
    const now = audioCtx.currentTime;
    
    document.getElementById('noteDisplay').innerText = item.label;

    // Play Left Hand
    playTone(notes[item.lh], now, 0.8);
    // Play Right Hand notes
    item.rh.forEach(note => playTone(notes[note], now, 0.8));

    step = (step + 1) % sequence.length;
    setTimeout(playLoop, 1000); // Loops every second
}

document.getElementById('playBtn').addEventListener('click', () => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    playLoop();
    document.getElementById('playBtn').style.display = 'none';
});
</script>

</body>
</html>
