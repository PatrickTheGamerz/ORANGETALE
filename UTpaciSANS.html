<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Storyteller</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
        }

        h1 { margin-top: 0; color: #38bdf8; text-align: center; }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #94a3b8;
        }

        input[type="password"], textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #475569;
            border-radius: 6px;
            background-color: #0f172a;
            color: white;
            font-family: inherit;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0ea5e9;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover { background-color: #0284c7; }
        button:disabled { background-color: #475569; cursor: not-allowed; }

        .output-box {
            margin-top: 30px;
            padding: 20px;
            background-color: #0f172a;
            border-left: 4px solid #38bdf8;
            border-radius: 0 6px 6px 0;
            min-height: 100px;
            white-space: pre-wrap; /* Keeps paragraphs and line breaks */
            line-height: 1.6;
            display: none; /* Hidden until a story is generated */
        }

        .loading {
            text-align: center;
            color: #38bdf8;
            font-style: italic;
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ AI Storyteller</h1>
        
        <label for="apiKey">Gemini API Key:</label>
        <input type="password" id="apiKey" placeholder="Paste your Google AI Studio key here...">

        <label for="prompt">What should the story be about?</label>
        <textarea id="prompt" placeholder="e.g., A cyberpunk detective trying to find a missing mechanical cat in a neon city..."></textarea>

        <button id="generateBtn">Write my story</button>

        <div class="loading" id="loading">Consulting the AI brain... please wait...</div>

        <div class="output-box" id="output"></div>
    </div>

    <script>
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const apiKey = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('prompt').value.trim();
            const outputBox = document.getElementById('output');
            const loading = document.getElementById('loading');
            const button = document.getElementById('generateBtn');

            // 1. Check if the user filled out the forms
            if (!apiKey) {
                alert("Please enter your API key first!");
                return;
            }
            if (!prompt) {
                alert("Please give the AI a prompt to write about!");
                return;
            }

            // 2. Setup the UI for loading
            button.disabled = true;
            outputBox.style.display = 'none';
            loading.style.display = 'block';

            try {
                // 3. The API Request directly to Google's Gemini servers
                // We use gemini-2.5-flash as it is blazing fast and very smart
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Write a highly creative, engaging, and well-written story based on this prompt. Make it smart and unpredictable. Prompt: ${prompt}`
                            }]
                        }]
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status} - Are you sure your API key is correct?`);
                }

                // 4. Parse the JSON data sent back from the AI
                const data = await response.json();
                
                // Extract the actual text from the complex JSON structure
                const storyText = data.candidates[0].content.parts[0].text;

                // 5. Display the story
                outputBox.innerText = storyText;
                outputBox.style.display = 'block';

            } catch (error) {
                // Handle errors (like bad API key or no internet)
                outputBox.innerText = "Oops! Something went wrong:\n\n" + error.message;
                outputBox.style.display = 'block';
                outputBox.style.borderLeftColor = "#ef4444"; // Turn border red for error
            } finally {
                // 6. Reset the UI
                loading.style.display = 'none';
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
