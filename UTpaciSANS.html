<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mice on Venus - High Fidelity Piano</title>
    <style>
        :root {
            --bg: #050505;
            --key-white: #ffffff;
            --key-black: #1a1a1a;
            --accent: #00f2ff;
            --glow: rgba(0, 242, 255, 0.6);
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            background: var(--bg); color: white; font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

        /* Canvas visualizer */
        #visualizer { flex: 1; width: 100%; background: linear-gradient(to bottom, #000 0%, #0a0a0a 100%); }

        /* Keyboard styling */
        #piano { 
            height: 150px; display: flex; position: relative; 
            background: #111; border-top: 4px solid #333;
            padding: 0 10px;
        }

        .key {
            flex: 1; height: 100%; border: 1px solid #333;
            border-bottom-left-radius: 5px; border-bottom-right-radius: 5px;
            background: var(--key-white); position: relative; z-index: 1;
            transition: transform 0.1s, background 0.1s;
        }

        .key.black {
            background: var(--key-black); height: 60%; 
            margin-left: -1.5%; margin-right: -1.5%;
            z-index: 2; flex: 0.6; border: 1px solid #000;
        }

        .key.active {
            background: var(--accent) !important;
            box-shadow: 0 0 30px var(--glow), inset 0 -10px 10px rgba(255,255,255,0.3);
            transform: translateY(2px);
        }

        /* UI */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
            backdrop-filter: blur(10px);
        }

        h1 { font-weight: 200; letter-spacing: 10px; color: #aaa; margin-bottom: 30px; }

        button {
            background: transparent; border: 1px solid var(--accent);
            color: var(--accent); padding: 15px 50px; font-size: 1.2rem;
            text-transform: uppercase; letter-spacing: 5px; cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background: var(--accent); color: black; box-shadow: 0 0 40px var(--glow); }
    </style>
</head>
<body>

<div id="overlay">
    <h1>MICE ON VENUS</h1>
    <button onclick="start()">Begin Experience</button>
</div>

<div id="app">
    <canvas id="visualizer"></canvas>
    <div id="piano"></div>
</div>

<script>
const pianoContainer = document.getElementById('piano');
const canvas = document.getElementById('visualizer');
const ctx = canvas.getContext('2d');

// --- PIANO CONFIG ---
const startMidi = 48; // C3
const endMidi = 84;   // C6
const keys = [];

for (let i = startMidi; i <= endMidi; i++) {
    const isBlack = [1, 3, 6, 8, 10].includes(i % 12);
    const div = document.createElement('div');
    div.className = `key ${isBlack ? 'black' : 'white'}`;
    div.id = `key-${i}`;
    pianoContainer.appendChild(div);
    keys.push({ midi: i, isBlack });
}

// --- SONG DATA (Extended 1:1 Mapping) ---
const song = [
    // Intro Ambience
    { t: 1.0, d: 4.0, n: 60, c: '#4ddbff' }, // C4
    { t: 1.0, d: 4.0, n: 64, c: '#4ddbff' }, // E4
    { t: 1.0, d: 4.0, n: 67, c: '#4ddbff' }, // G4
    
    { t: 5.2, d: 3.5, n: 65, c: '#4ddbff' }, // F4
    { t: 5.2, d: 3.5, n: 69, c: '#4ddbff' }, // A4
    { t: 5.2, d: 3.5, n: 72, c: '#4ddbff' }, // C5

    // The Main Melody (0:15 in video)
    { t: 9.0, d: 2.0, n: 79, c: '#00f2ff' }, // G5
    { t: 11.0, d: 2.0, n: 76, c: '#00f2ff' }, // E5
    { t: 13.0, d: 2.5, n: 74, c: '#00f2ff' }, // D5
    { t: 15.5, d: 2.0, n: 72, c: '#00f2ff' }, // C5
    { t: 17.5, d: 2.0, n: 67, c: '#00f2ff' }, // G4
    { t: 19.5, d: 2.0, n: 69, c: '#00f2ff' }, // A4
    { t: 21.5, d: 4.0, n: 72, c: '#00f2ff' }, // C5
    
    // Harmony Response
    { t: 22.0, d: 3.0, n: 55, c: '#ffffff' }, // G3 (Bass)
    { t: 22.5, d: 3.0, n: 52, c: '#ffffff' }  // E3 (Bass)
];

// --- AUDIO ENGINE ---
let audioCtx;
function playPiano(midi, time, duration) {
    const freq = 440 * Math.pow(2, (midi - 69) / 12);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'triangle'; // Warmer than Sine
    osc.frequency.setValueAtTime(freq, time);
    
    // Piano ADSR Envelope
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(0.15, time + 0.05); // Soft strike
    gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + duration);
}

// --- RENDER LOOP ---
let running = false;
let startTime;
const scrollSpeed = 120; 

function animate() {
    if (!running) return;
    resize();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const elapsed = (performance.now() - startTime) / 1000;
    
    const keyWidth = canvas.width / (endMidi - startMidi + 1);

    song.forEach(note => {
        const x = (note.n - startMidi) * keyWidth;
        const y = canvas.height - (note.t - elapsed) * scrollSpeed - (note.d * scrollSpeed);
        const h = note.d * scrollSpeed;

        if (y + h > 0 && y < canvas.height) {
            // Draw Glowing Note
            ctx.shadowBlur = 15;
            ctx.shadowColor = note.c;
            ctx.fillStyle = note.c;
            ctx.roundRect ? ctx.beginPath() || ctx.roundRect(x + 2, y, keyWidth - 4, h, 5) || ctx.fill() : ctx.fillRect(x + 2, y, keyWidth - 4, h);
            ctx.shadowBlur = 0;
        }

        // Handle Key Lighting
        const element = document.getElementById(`key-${note.n}`);
        if (element) {
            if (elapsed >= note.t && elapsed <= note.t + note.d) {
                element.classList.add('active');
            } else {
                element.classList.remove('active');
            }
        }
    });

    requestAnimationFrame(animate);
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = canvas.offsetHeight;
}

function start() {
    document.getElementById('overlay').style.display = 'none';
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    startTime = performance.now();
    running = true;
    
    song.forEach(note => {
        playPiano(note.n, audioCtx.currentTime + note.t, note.d);
    });
    
    animate();
}
</script>
</body>
</html>
