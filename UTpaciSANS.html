<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Game Dev Studio</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1f1f1f; padding: 15px 25px; border-bottom: 2px solid #333; display: flex; align-items: center; gap: 15px; }
        input, button { padding: 10px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: white; }
        button { background: #00a8ff; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0086cc; }
        
        #main-layout { display: flex; flex: 1; overflow: hidden; }
        
        /* Left Side: AI Dev Log */
        #dev-sidebar { width: 350px; background: #181818; border-right: 2px solid #333; display: flex; flex-direction: column; padding: 15px; }
        #ai-status { color: #00a8ff; font-size: 0.9em; margin-bottom: 10px; font-family: monospace; }
        #ai-talk { flex: 1; background: #000; padding: 15px; border-radius: 8px; font-size: 0.95em; line-height: 1.5; overflow-y: auto; color: #00ff41; border: 1px solid #333; }

        /* Right Side: The Game */
        #game-view { flex: 1; background: #000; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: white; }
        
        .loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; text-align: center; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #00a8ff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<header>
    <strong>Gemini Game Studio</strong>
    <input type="password" id="apiKey" placeholder="API Key" style="width: 150px;">
    <input type="text" id="gamePrompt" placeholder="Game Idea (e.g. Neon Tetris)" style="flex: 1;">
    <button onclick="askAI()">Start Build</button>
</header>

<div id="main-layout">
    <div id="dev-sidebar">
        <div id="ai-status">SYSTEM IDLE</div>
        <div id="ai-talk">Waiting for your command...</div>
    </div>
    
    <div id="game-view">
        <div id="loader" class="loader">
            <div class="spinner"></div>
            <p>AI is coding...</p>
        </div>
        <iframe id="gameFrame"></iframe>
    </div>
</div>

<script>
    async function askAI() {
        const key = document.getElementById('apiKey').value;
        const prompt = document.getElementById('gamePrompt').value;
        const status = document.getElementById('ai-status');
        const talk = document.getElementById('ai-talk');
        const loader = document.getElementById('loader');
        const frame = document.getElementById('gameFrame');

        if (!key || !prompt) {
            alert("Please provide the API key and a game idea!");
            return;
        }

        // Reset UI
        status.innerText = "INITIALIZING AI...";
        talk.innerText = "Connecting to Gemini 1.5 Flash...";
        loader.style.display = "block";
        frame.srcdoc = "";

        // API Configuration
        const apiURL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;

        const requestBody = {
            contents: [{
                parts: [{
                    text: `You are a professional game developer. Create a game based on: "${prompt}".
                    Return your response in EXACT JSON format:
                    {
                        "dev_message": "A 2-3 sentence explanation of how you designed the game and its controls.",
                        "html_code": "The full HTML/CSS/JS code for the game."
                    }
                    Make the code self-contained. Use a <canvas> for graphics. Ensure controls are responsive.`
                }]
            }],
            generationConfig: {
                response_mime_type: "application/json"
            }
        };

        try {
            const response = await fetch(apiURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();
            
            // Parse the JSON from the AI
            const aiResponse = JSON.parse(data.candidates[0].content.parts[0].text);

            // AI "Talks"
            status.innerText = "BUILD COMPLETE";
            talk.innerText = aiResponse.dev_message;

            // Inject the code
            frame.srcdoc = aiResponse.html_code;

        } catch (error) {
            console.error(error);
            status.innerText = "ERROR DETECTED";
            talk.innerText = "Failed to generate. Ensure your API Key is valid and has Gemini 1.5 Flash access.";
        } finally {
            loader.style.display = "none";
        }
    }
</script>

</body>
</html>
