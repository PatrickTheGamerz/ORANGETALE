<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mice on Venus - 21 Measure Accurate Pacing</title>
    <style>
        body { background: #111; color: #eee; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background: #1e1e1e; padding: 30px; border-radius: 8px; border: 1px solid #333; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 450px; }
        button { background: #4facfe; color: #000; border: none; padding: 12px 24px; font-weight: bold; cursor: pointer; font-size: 16px; border-radius: 4px; transition: 0.2s; margin-bottom: 20px; }
        button:hover { background: #00f2fe; }
        .status { font-size: 18px; color: #4facfe; margin-bottom: 10px; height: 25px; }
        .details { font-size: 14px; color: #888; display: flex; justify-content: space-between; margin-top: 20px; border-top: 1px solid #333; padding-top: 10px; }
        .notes-playing { font-size: 24px; color: #fff; letter-spacing: 2px; height: 35px; margin: 15px 0; }
    </style>
</head>
<body>

<div class="container">
    <button id="playBtn">PLAY ACCURATE SHEETS</button>
    <div class="status" id="statusDisplay">Waiting to start...</div>
    <div class="notes-playing" id="notesDisplay">---</div>
    <div class="details">
        <span id="measureDisplay">Measure: 0 / 21</span>
        <span>Tempo: 75 BPM</span>
    </div>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// Frequencies for all 21 measures
const F = {
    'G2': 98.00, 'Ab2': 103.83, 'Bb2': 116.54, 'C3': 130.81, 'Eb3': 155.56, 'F#3': 185.00, 'Ab3': 207.65, 
    'C4': 261.63, 'E4': 329.63, 'G4': 392.00, 'Ab4': 415.30, 'Bb4': 466.16, 
    'C5': 523.25, 'D5': 587.33, 'Eb5': 622.25, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99, 'C6': 1046.50
};

// 4/4 Time Signature - Each 'wait' value is measured in BEATS.
// Half note = 2 beats. Quarter note = 1 beat. Whole note = 4 beats.
const score = [
    // --- IMAGES 1 & 2 (Measures 1 - 11) ---
    // Measures 1-4: Held C Major (Half notes)
    { m: 1, notes: ['C3', 'C4', 'E4'], dur: 2, wait: 2 }, { m: 1, notes: ['C3', 'C4', 'E4'], dur: 2, wait: 2 },
    { m: 2, notes: ['C3', 'C4', 'E4'], dur: 2, wait: 2 }, { m: 2, notes: ['C3', 'C4', 'E4'], dur: 2, wait: 2 },
    { m: 3, notes: ['C3', 'C4', 'E4'], dur: 2, wait: 2 }, { m: 3, notes: ['C3', 'C4', 'E4'], dur: 2, wait: 2 },
    { m: 4, notes: ['C3', 'C4', 'E4'], dur: 2, wait: 2 }, { m: 4, notes: ['C3', 'C4', 'E4'], dur: 2, wait: 2 },
    
    // Measures 5-10: C/Ab shifts
    { m: 5, notes: ['Ab3', 'C4', 'E4', 'G4'], dur: 2, wait: 2 }, { m: 5, notes: ['Ab3', 'C4', 'E4', 'G4'], dur: 2, wait: 2 },
    { m: 6, notes: ['C3', 'C4', 'E4', 'G4'], dur: 2, wait: 2 }, { m: 6, notes: ['C3', 'C4', 'E4', 'G4'], dur: 2, wait: 2 },
    { m: 7, notes: ['Ab3', 'C4', 'E4', 'G4'], dur: 2, wait: 2 }, { m: 7, notes: ['Ab3', 'C4', 'E4', 'G4'], dur: 2, wait: 2 },
    { m: 8, notes: ['C3', 'C4', 'E4', 'G4'], dur: 2, wait: 2 }, { m: 8, notes: ['C3', 'C4', 'E4', 'G4'], dur: 2, wait: 2 },
    { m: 9, notes: ['C3', 'C4', 'E4', 'G4'], dur: 2, wait: 2 }, { m: 9, notes: ['C3', 'C4', 'E4', 'G4'], dur: 2, wait: 2 },
    { m: 10, notes: ['C3', 'C4', 'E4', 'G4'], dur: 2, wait: 2 }, { m: 10, notes: ['C3', 'C4', 'E4', 'G4'], dur: 2, wait: 2 },
    
    // Measure 11: The timing shift (Half note, then two quarter notes)
    { m: 11, notes: ['F#3', 'E5'], dur: 2, wait: 2 }, 
    { m: 11, notes: ['F#3', 'G5'], dur: 1, wait: 1 }, 
    { m: 11, notes: ['C6'], dur: 1, wait: 1 },

    // --- IMAGE 3 (Measures 12 - 21) ---
    { m: 12, notes: ['C3', 'G4', 'C5', 'Eb5'], dur: 2, wait: 2 }, { m: 12, notes: ['C3', 'G4', 'C5', 'Eb5'], dur: 2, wait: 2 },
    { m: 13, notes: ['Ab2', 'Ab4', 'C5', 'Eb5'], dur: 2, wait: 2 }, { m: 13, notes: ['Ab2', 'Ab4', 'C5', 'Eb5'], dur: 2, wait: 2 },
    { m: 14, notes: ['Bb2', 'Bb4', 'D5', 'F5'], dur: 2, wait: 2 }, { m: 14, notes: ['Bb2', 'Bb4', 'D5', 'F5'], dur: 2, wait: 2 },
    { m: 15, notes: ['C3', 'G4', 'C5', 'Eb5'], dur: 2, wait: 2 }, { m: 15, notes: ['C3', 'G4', 'C5', 'Eb5'], dur: 2, wait: 2 },
    
    { m: 16, notes: ['C3', 'G4', 'C5', 'Eb5'], dur: 2, wait: 2 }, { m: 16, notes: ['C3', 'G4', 'C5', 'Eb5'], dur: 2, wait: 2 },
    { m: 17, notes: ['Ab2', 'Ab4', 'C5', 'Eb5'], dur: 2, wait: 2 }, { m: 17, notes: ['Ab2', 'Ab4', 'C5', 'Eb5'], dur: 2, wait: 2 },
    { m: 18, notes: ['Bb2', 'Bb4', 'D5', 'F5'], dur: 2, wait: 2 }, { m: 18, notes: ['Bb2', 'Bb4', 'D5', 'F5'], dur: 2, wait: 2 },
    { m: 19, notes: ['C3', 'G4', 'C5', 'Eb5'], dur: 2, wait: 2 }, { m: 19, notes: ['C3', 'G4', 'C5', 'Eb5'], dur: 2, wait: 2 },
    
    { m: 20, notes: ['G2', 'Bb4', 'D5'], dur: 2, wait: 2 }, { m: 20, notes: ['Bb2', 'C5', 'Eb5'], dur: 2, wait: 2 },
    // Measure 21: Held whole note resolution
    { m: 21, notes: ['C3', 'Eb5', 'G5', 'C6'], dur: 4, wait: 4 }
];

const BPM = 75;
const beatDurationMs = 60000 / BPM; 

function playNote(freq, durBeats) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sine'; // Soft tone
    osc.frequency.value = freq;
    
    const now = audioCtx.currentTime;
    const durSeconds = (durBeats * beatDurationMs) / 1000;
    
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.1, now + 0.05); // Attack
    gain.gain.exponentialRampToValueAtTime(0.0001, now + durSeconds + 0.5); // Release (leaves a slight "space" ring)
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start(now);
    osc.stop(now + durSeconds + 1);
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function playSequence() {
    for (let i = 0; i < score.length; i++) {
        const step = score[i];
        
        // Update UI
        document.getElementById('measureDisplay').innerText = `Measure: ${step.m} / 21`;
        document.getElementById('statusDisplay').innerText = `Playing... Beat wait: ${step.wait}`;
        document.getElementById('notesDisplay').innerText = step.notes.join(' + ');

        // Play the chord array
        step.notes.forEach(note => playNote(F[note], step.dur));

        // Wait the exact correct spacing before triggering the next notes
        await sleep(step.wait * beatDurationMs);
    }
    document.getElementById('statusDisplay').innerText = "Sequence Complete. Looping...";
    setTimeout(playSequence, 2000); // 2 second rest space at the end before looping
}

document.getElementById('playBtn').addEventListener('click', () => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    document.getElementById('playBtn').style.display = 'none';
    playSequence();
});
</script>

</body>
</html>
