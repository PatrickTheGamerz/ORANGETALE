<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Undertale: The Internal Chronicles</title>
    <style>
        :root {
            --ut-white: #ffffff;
            --ut-red: #ff0000;
            --ut-yellow: #ffff00;
            --ut-bg: #000000;
            --ut-blue: #00a2ff;
        }

        body {
            background-color: #050505;
            color: var(--ut-white);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        #game-window {
            width: 750px;
            background: var(--ut-bg);
            border: 5px solid var(--ut-white);
            padding: 25px;
            box-shadow: 0 0 15px var(--ut-blue);
        }

        #stats-bar {
            display: flex;
            justify-content: space-between;
            border-bottom: 3px solid var(--ut-white);
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        #location-tag { color: var(--ut-blue); }
        #lv-tag { color: var(--ut-red); }

        #dialogue-box {
            font-size: 1.25rem;
            min-height: 180px;
            margin-bottom: 25px;
            line-height: 1.5;
            border-left: 4px solid #333;
            padding-left: 15px;
        }

        .choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            background: black;
            color: white;
            border: 2px solid white;
            padding: 15px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.1s;
        }

        button:hover {
            background: white;
            color: black;
            font-weight: bold;
        }

        #achievements-panel {
            margin-top: 20px;
            width: 750px;
            background: #111;
            padding: 15px;
            border: 1px solid #444;
            font-size: 0.9rem;
        }

        .flavor { color: var(--ut-yellow); font-style: italic; }
        .internal { color: #ff99aa; } /* Pinkish for internal areas */
        .system { color: #00ff00; }
    </style>
</head>
<body>

<div id="game-window">
    <div id="stats-bar">
        <span>NAME: FRISK</span>
        <span id="lv-tag">LV 1</span>
        <span id="location-tag">THE RUINS</span>
    </div>
    
    <div id="dialogue-box">
        </div>

    <div class="choice-grid" id="choices">
        </div>
</div>

<div style="margin-top: 15px;">
    <button onclick="saveGame()">SAVE FILE</button>
    <button onclick="loadGame()">LOAD FILE</button>
    <button onclick="resetGame()" style="color: red; border-color: red;">TRUE RESET</button>
</div>

<div id="achievements-panel">
    <strong>COLLECTED ENDINGS & MEMORIES:</strong>
    <div id="ach-list" style="margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr;"></div>
</div>

<script>
    let state = {
        lv: 1,
        location: 'Ruins',
        currentScene: 'start',
        achievements: [],
        inventory: []
    };

    const story = {
        'start': {
            text: "You stand before a heavy stone door. Toriel, the caretaker of the Ruins, offers a warm hand. 'Come, Frisk. It is time for your afternoon snack... or perhaps, you are the snack?'",
            choices: [
                { text: "[ACT] Hug Toriel", next: 'toriel_mouth' },
                { text: "[MOVE] To Snowdin", next: 'snowdin' }
            ]
        },

        // --- TORIEL ARC ---
        'toriel_mouth': {
            text: "Toriel smiles gently, picking you up. Before you can speak, she brings you to her lips. The <span class='internal'>warmth of her breath</span> is overwhelming. With a soft hum, she takes you inside, her <span class='internal'>tongue soothing</span> your skin as she tastes her favorite human.",
            choices: [
                { text: "Accept the Swallow", next: 'toriel_throat' },
                { text: "Squirm Playfully", next: 'toriel_mouth_alt' }
            ]
        },
        'toriel_throat': {
            text: "With a deliberate, heavy <span class='flavor'>*GULP*</span>, Toriel tilts her head back. You feel the <span class='internal'>walls of her throat tighten</span> around you, rhythmic muscles pulsing as they slowly massage you downward. It's a long, warm slide.",
            choices: [
                { text: "Slide into the Stomach", next: 'toriel_stomach' }
            ]
        },
        'toriel_stomach': {
            text: "You land with a soft splash in the <span class='internal'>deep, pulsing warmth</span> of Toriel's stomach. The walls are thick and incredibly tight, hugging you from all sides. You can hear the steady 'thump-thump' of her heart above.",
            choices: [
                { text: "[ACT] Rest in the Heat", next: 'toriel_ending_rest' },
                { text: "[ACT] Tickle the Walls", next: 'toriel_ending_giggle' },
                { text: "[REBIRTH] Level Up", next: 'lv_up' }
            ]
        },

        // --- MUFFET ARC ---
        'snowdin': {
            text: "The air turns cold. You pass the Snowdin Inn Bunnies and reach the web-covered Waterfall entrance. Muffet hangs upside down, holding a cup of tea.",
            choices: [
                { text: "Greet Muffet", next: 'muffet_mouth' },
                { text: "Visit Catty & Bratty", next: 'junk_shop' }
            ]
        },
        'muffet_mouth': {
            text: "Muffet giggles, her many eyes sparkling. 'Ufufu~ You look like you'd fit perfectly in my favorite tea set!' She pulls you toward her mandibles, her <span class='internal'>multiple tongues</span> slicking your hair back.",
            choices: [
                { text: "Enter the Tea-Chamber", next: 'muffet_throat' }
            ]
        },
        'muffet_throat': {
            text: "She swallows you with a refined 'sip.' The passage is <span class='internal'>silky and narrow</span>, pushing you down into the depths of her purple bodice.",
            choices: [
                { text: "Reach the Core", next: 'muffet_stomach' }
            ]
        },
        'muffet_stomach': {
            text: "Muffet's stomach is like a luxury silk tent. The walls are <span class='internal'>velvety but incredibly strong</span>, vibrating as she giggles from the outside. You are officially her 'Personal Blend.'",
            choices: [
                { text: "[ACT] Nap in the Silk", next: 'muffet_ending' },
                { text: "[REBIRTH] Level Up", next: 'lv_up' }
            ]
        },

        // --- SYSTEM SCENES ---
        'lv_up': {
            text: "You have been fully absorbed into the monster's soul. Your physical form fades, but your <span class='flavor'>DETERMINATION</span> grows. You feel your power increasing.",
            script: () => { state.lv++; },
            choices: [
                { text: "Return to the Beginning (New Power)", next: 'start' }
            ]
        },

        // --- ENDINGS ---
        'toriel_ending_rest': {
            text: "You decide this is home now. Toriel pats her tummy contentedly as you fall into a deep sleep in the tight, warm dark. <br><br><span class='system'>ENDING: THE HEART'S PERMANENT RESIDENT</span>",
            ach: 'Toriel\'s Inner Peace',
            choices: [{ text: "Reset?", next: 'start' }]
        }
    };

    function renderScene(sceneKey) {
        state.currentScene = sceneKey;
        const scene = story[sceneKey];
        if (scene.script) scene.script();

        // Update Stats
        document.getElementById('lv-tag').innerText = `LV ${state.lv}`;
        document.getElementById('location-tag').innerText = state.location.toUpperCase();
        
        // Update Dialogue
        const diagBox = document.getElementById('dialogue-box');
        diagBox.innerHTML = scene.text;

        // Update Choices
        const choiceGrid = document.getElementById('choices');
        choiceGrid.innerHTML = '';
        scene.choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.innerText = choice.text;
            btn.onclick = () => renderScene(choice.next);
            choiceGrid.appendChild(btn);
        });

        // Handle Achievements
        if (scene.ach && !state.achievements.includes(scene.ach)) {
            state.achievements.push(scene.ach);
            updateAchievementList();
        }
    }

    function updateAchievementList() {
        const list = document.getElementById('ach-list');
        list.innerHTML = '';
        state.achievements.forEach(ach => {
            const item = document.createElement('div');
            item.innerHTML = `⭐ <span class='system'>${ach}</span>`;
            list.appendChild(item);
        });
    }

    // --- Persistence ---
    function saveGame() {
        localStorage.setItem('internal_chronicles_save', JSON.stringify(state));
        alert("FILE SAVED.");
    }

    function loadGame() {
        const data = localStorage.getItem('internal_chronicles_save');
        if (data) {
            state = JSON.parse(data);
            renderScene(state.currentScene);
            updateAchievementList();
        }
    }

    function resetGame() {
        localStorage.clear();
        location.reload();
    }

    // Launch
    renderScene('start');
</script>

</body>
</html>
