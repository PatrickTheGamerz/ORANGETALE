<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Piano Loop Player</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        .player-card {
            background: #2d2d2d;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 300px;
        }
        .visualizer {
            height: 5px;
            background: #4facfe;
            margin: 20px 0;
            border-radius: 5px;
            animation: pulse 1.5s infinite ease-in-out;
        }
        audio {
            width: 100%;
            filter: invert(100%); /* Makes the player match dark mode */
        }
        @keyframes pulse {
            0% { opacity: 0.3; width: 20%; margin-left: 40%; }
            50% { opacity: 1; width: 100%; margin-left: 0%; }
            100% { opacity: 0.3; width: 20%; margin-left: 40%; }
        }
    </style>
</head>
<body>

<div class="player-card">
    <h3>Piano Composition</h3>
    <p style="font-size: 0.8rem; color: #aaa;">Looping Enabled</p>
    <div class="visualizer"></div>
    
    <audio controls loop>
        <source src="your-audio-file.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
</div>

</body>
</html>
