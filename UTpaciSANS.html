<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UT PACIFIST: SANS BATTLE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        :root { --red: #ff0000; --gold: #ffff00; --cyan: #00ffff; --blue: #0033ff; --purple: #d946ef; --green: #00ff00; }
        
        body { background: #000; color: #fff; font-family: 'Press Start 2P', monospace; margin: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; user-select: none; }
        #game-window { width: 640px; height: 480px; position: relative; background: #000; overflow: hidden; transform: scale(1.4); transform-origin: center; border: 2px solid #222; }

        /* SANS SPRITE */
        #sans-container { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); text-align: center; transition: transform 0.2s ease-out; z-index: 10; }
        .skeleton { width: 70px; height: 80px; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50"><rect x="15" y="5" width="20" height="20" fill="white"/><rect x="20" y="10" width="4" height="6" fill="black"/><rect x="30" y="10" width="4" height="6" fill="black"/><rect x="24" y="18" width="6" height="3" fill="black"/><rect x="10" y="27" width="30" height="15" fill="%23ccc"/><rect x="15" y="42" width="8" height="8" fill="white"/><rect x="27" y="42" width="8" height="8" fill="white"/></svg>') no-repeat center/contain; }
        
        #miss-text { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-family: 'Arial', sans-serif; font-weight: bold; font-size: 24px; color: #ccc; opacity: 0; pointer-events: none; z-index: 100; transition: top 1s ease-out, opacity 0.5s; }
        #sans-bubble { position: absolute; top: 20px; left: 360px; width: 180px; min-height: 50px; background: #fff; color: #000; border: 3px solid #000; border-radius: 10px; padding: 10px; font-family: 'Comic Sans MS', sans-serif; font-size: 14px; line-height: 1.2; display: none; z-index: 50; }
        #sans-bubble::before { content: ''; position: absolute; top: 50%; left: -15px; transform: translateY(-50%); border-width: 10px 15px 10px 0; border-style: solid; border-color: transparent #fff transparent transparent; }

        /* BATTLE BOX & SOUL */
        #battle-box { position: absolute; bottom: 125px; left: 50%; transform: translateX(-50%); width: 565px; height: 130px; border: 4px solid #fff; background: #000; overflow: hidden; box-sizing: border-box; }
        #soul { width: 14px; height: 14px; position: absolute; z-index: 1000; }
        #projectiles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        /* MENUS */
        #text-box { position: absolute; top: 15px; left: 15px; right: 15px; bottom: 15px; font-size: 14px; line-height: 24px; display: block; white-space: pre-wrap; }
        #sub-menu { position: absolute; top: 15px; left: 40px; font-size: 14px; line-height: 28px; display: none; }
        .sub-opt { display: inline-block; width: 45%; margin-bottom: 5px; }
        
        /* FIGHT BAR */
        #fight-target { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; z-index: 10; }
        #fight-target::after { content: ''; position: absolute; left: 250px; top: 0; width: 65px; height: 100%; background: rgba(0,255,0,0.4); border-left: 2px solid #0f0; border-right: 2px solid #0f0; }
        #fight-cursor { position: absolute; top: 0; left: 0; width: 6px; height: 100%; background: #fff; box-shadow: 0 0 5px #fff; z-index: 11; }
        #strike-anim { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 100px; background: #fff; opacity: 0; z-index: 50; }

        /* HUD */
        #hud { position: absolute; bottom: 85px; left: 30px; display: flex; align-items: center; font-size: 12px; font-weight: bold; width: 580px; }
        #name-lv { width: 200px; }
        .hp-label { margin-right: 10px; font-size: 10px; }
        .hp-bar-bg { width: 35px; height: 14px; background: red; position: relative; margin-right: 10px; }
        #hp-fill { height: 100%; background: var(--gold); width: 100%; }
        #hp-text { width: 100px; }

        /* BUTTONS */
        #menu-bar { position: absolute; bottom: 15px; left: 0; width: 100%; display: flex; justify-content: center; gap: 15px; }
        .btn { width: 110px; height: 42px; border: 2px solid #ff8000; color: #ff8000; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; cursor: pointer; gap: 8px; }
        .btn.selected { color: var(--gold); border-color: var(--gold); }
        .btn-icon { width: 14px; height: 14px; background: #ff8000; clip-path: path('M7,14 A3.5,3.5 0,0,1 14,14 A3.5,3.5 0,0,1 21,14 L14,21 Z'); transform: scale(1.2); }
        .btn.selected .btn-icon { background: var(--gold); }

        /* PROJECTILES */
        .bone { position: absolute; background: #fff; border-radius: 2px; }
        .blue-bone { background: var(--cyan); }
        .platform { background: var(--green); border: 1px solid #fff; }
        .zone-warn { position: absolute; background: rgba(255,0,0,0.5); border: 2px solid red; z-index: 5; }
    </style>
</head>
<body>

<div id="game-window">
    <div id="sans-container"><div class="skeleton"></div></div>
    <div id="sans-bubble"></div>
    <div id="miss-text">MISS</div>
    <div id="strike-anim"></div>

    <div id="battle-box">
        <div id="text-box"></div>
        <div id="sub-menu"></div>
        <div id="fight-target"><div id="fight-cursor"></div></div>
        
        <div id="projectiles"></div>
        <div id="soul">
            <svg viewBox="0 0 32 32"><path id="soul-svg" d="M16,28.3L3.7,16c-2.3-2.3-2.3-6.1,0-8.5c2.3-2.3,6.1-2.3,8.5,0l3.8,3.8l3.8-3.8c2.3-2.3,6.1-2.3,8.5,0c2.3,2.3,2.3,6.1,0,8.5L16,28.3z" fill="red"/></svg>
        </div>
    </div>

    <div id="hud">
        <div id="name-lv"><span id="p-name">PLAYER</span> &nbsp;&nbsp; LV 1</div>
        <div class="hp-label">HP</div>
        <div class="hp-bar-bg"><div id="hp-fill"></div></div>
        <div id="hp-text">20 / 20</div>
    </div>

    <div id="menu-bar">
        <div class="btn selected" id="btn0"><div class="btn-icon"></div>FIGHT</div>
        <div class="btn" id="btn1"><div class="btn-icon"></div>ACT</div>
        <div class="btn" id="btn2"><div class="btn-icon"></div>ITEM</div>
        <div class="btn" id="btn3"><div class="btn-icon"></div>MERCY</div>
    </div>
</div>

<script>
    /** ⚙️ CORE ENGINE **/
    const STATE = {
        hp: 20, max: 20, owner: 'PLAYER', phase: 'SANS_TALK',
        menuIdx: 0, subIdx: 0, currentMenu: 'MAIN', turn: 0,
        soul: { x: 275, y: 60, vY: 0, gravity: false, jump: -5.5, grounded: false, moving: false },
        fightBar: { x: 0, dir: 1 }, keys: {},
        dialogueTimer: null, sansTimer: null, friskSkill: 1.0
    };

    const elSoul = document.getElementById('soul');
    const elBox = document.getElementById('battle-box');
    const elText = document.getElementById('text-box');
    const elSub = document.getElementById('sub-menu');
    const elProj = document.getElementById('projectiles');
    const elSansBubble = document.getElementById('sans-bubble');

    /** 🗣️ DIALOGUE **/
    function typeFlavor(text, callback) {
        clearInterval(STATE.dialogueTimer);
        elText.innerHTML = ""; elText.style.display = 'block';
        elSub.style.display = 'none'; document.getElementById('fight-target').style.display = 'none';
        STATE.phase = 'TYPING';
        let i = 0;
        STATE.dialogueTimer = setInterval(() => {
            elText.innerHTML += text[i]; i++;
            if (i >= text.length) {
                clearInterval(STATE.dialogueTimer); STATE.phase = 'MENU'; STATE.currentMenu = 'MAIN';
                if(callback) callback();
            }
        }, 30);
    }

    function sansSpeak(text, callback) {
        clearInterval(STATE.sansTimer);
        elSansBubble.innerHTML = ""; elSansBubble.style.display = 'block';
        let i = 0;
        STATE.sansTimer = setInterval(() => {
            elSansBubble.innerHTML += text[i]; i++;
            if (i >= text.length) { clearInterval(STATE.sansTimer); if(callback) setTimeout(callback, 800); }
        }, 40);
    }

    function clearSansBubble() { clearInterval(STATE.sansTimer); elSansBubble.style.display = 'none'; elSansBubble.innerHTML = ""; }

    /** 💀 UNIFIED PHYSICS ENGINE **/
    function physicsLoop() {
        if (STATE.phase === 'ATTACK') {
            let dx = 0, dy = 0, doJump = false;
            let speed = 2.5;
            let oldX = STATE.soul.x, oldY = STATE.soul.y;

            // 1. Gather Input (Player vs AI)
            if (STATE.owner === 'PLAYER') {
                if (STATE.keys['ArrowLeft']) dx -= speed;
                if (STATE.keys['ArrowRight']) dx += speed;
                if (STATE.soul.gravity) {
                    if (STATE.keys['ArrowUp'] || STATE.keys['z']) doJump = true;
                } else {
                    if (STATE.keys['ArrowUp']) dy -= speed;
                    if (STATE.keys['ArrowDown']) dy += speed;
                }
            } else {
                let ai = aiController();
                dx = ai.dx; dy = ai.dy; doJump = ai.jump;
            }

            // 2. Apply X Movement
            STATE.soul.x += dx;

            // 3. Universal Gravity & Jumping
            if (STATE.soul.gravity) {
                if (doJump && STATE.soul.grounded) {
                    STATE.soul.vY = STATE.soul.jump;
                    STATE.soul.grounded = false;
                }
                STATE.soul.vY += 0.2; // Gravity constant
                STATE.soul.y += STATE.soul.vY;
                STATE.soul.grounded = false; // Reset to check against floor/platforms
            } else {
                STATE.soul.y += dy;
            }

            // 4. Platform Collision Checking
            checkPlatforms();

            // 5. Box Bounds
            STATE.soul.x = Math.max(0, Math.min(elBox.clientWidth - 18, STATE.soul.x));
            STATE.soul.y = Math.max(0, Math.min(elBox.clientHeight - 18, STATE.soul.y));
            if (STATE.soul.y >= elBox.clientHeight - 18) {
                STATE.soul.y = elBox.clientHeight - 18;
                if (STATE.soul.gravity) { STATE.soul.vY = 0; STATE.soul.grounded = true; }
            }

            STATE.soul.moving = (Math.abs(oldX - STATE.soul.x) > 0.1 || Math.abs(oldY - STATE.soul.y) > 0.1);
            elSoul.style.left = STATE.soul.x + 'px';
            elSoul.style.top = STATE.soul.y + 'px';
            
            checkHitboxes();
        } else if (STATE.phase === 'FIGHT_AIM') {
            STATE.fightBar.x += 6 * STATE.fightBar.dir;
            if (STATE.fightBar.x >= elBox.clientWidth - 6 || STATE.fightBar.x <= 0) STATE.fightBar.dir *= -1;
            document.getElementById('fight-cursor').style.left = STATE.fightBar.x + 'px';
        }
        requestAnimationFrame(physicsLoop);
    }

    function checkPlatforms() {
        if (!STATE.soul.gravity || STATE.soul.vY < 0) return; // Only collide falling down
        const plats = elProj.querySelectorAll('.platform');
        const sR = elSoul.getBoundingClientRect();
        
        for (let p of plats) {
            const pR = p.getBoundingClientRect();
            // Check if soul bottom is hitting platform top
            if (sR.bottom >= pR.top && sR.bottom <= pR.top + 10 && sR.right > pR.left && sR.left < pR.right) {
                STATE.soul.y = p.offsetTop - 14; // Stand on top
                STATE.soul.vY = 0;
                STATE.soul.grounded = true;
                STATE.soul.x += parseFloat(p.dataset.vx || 0); // Move with platform
            }
        }
    }

    function checkHitboxes() {
        const sR = elSoul.getBoundingClientRect();
        const bones = elProj.querySelectorAll('.bone:not(.platform)');
        for (let b of bones) {
            const eR = b.getBoundingClientRect();
            if (!(sR.right < eR.left || sR.left > eR.right || sR.bottom < eR.top || sR.top > eR.bottom)) {
                if (b.classList.contains('blue-bone') && !STATE.soul.moving) continue;
                STATE.hp -= 1; // 1 DMG PER FRAME
                updateHUD();
                if (STATE.hp <= 0) { STATE.hp = 0; alert("GAME OVER."); location.reload(); return; }
            }
        }
    }

    /** 🤖 AI: FRISK / CHARA CONTROLLER **/
    function toggleQ() {
        if (STATE.owner !== 'PLAYER') return;
        const teammate = localStorage.getItem('teammate') || 'FRISK';
        STATE.owner = teammate;
        document.getElementById('p-name').innerText = teammate;
        document.getElementById('p-name').style.color = teammate === 'FRISK' ? 'var(--purple)' : 'red';
        if (STATE.phase === 'MENU' && STATE.currentMenu === 'MAIN') {
            if (teammate === 'FRISK') friskThinkAndAct();
            if (teammate === 'CHARA') charaThinkAndFight();
        }
    }

    function aiController() {
        let out = { dx: 0, dy: 0, jump: false };
        const haz = elProj.querySelectorAll('.bone:not(.platform)');
        
        haz.forEach(h => {
            const hR = h.getBoundingClientRect(), sR = elSoul.getBoundingClientRect();
            if (Math.abs(hR.left - sR.left) < 50) {
                out.dx = sR.left < hR.left ? -2.5 : 2.5;
                if (h.classList.contains('blue-bone')) { out.dx = 0; out.dy = 0; }
                else if (STATE.soul.gravity && hR.bottom > sR.bottom - 5) {
                    out.jump = true; // Jump over floor bones
                } else if (!STATE.soul.gravity) {
                    out.dy = sR.top < hR.top ? -2.5 : 2.5;
                }
            }
        });
        return out;
    }

    function friskThinkAndAct() {
        STATE.phase = 'AI_THINKING';
        setTimeout(() => { STATE.menuIdx = 1; updateUI(); }, 1000);
        setTimeout(() => {
            openSubMenu('ACT');
            setTimeout(() => { STATE.subIdx = 1; updateUI(); setTimeout(executeSubMenu, 1000); }, 800);
        }, 1500);
    }
    
    function charaThinkAndFight() {
        STATE.phase = 'AI_THINKING';
        setTimeout(() => {
            STATE.menuIdx = 0; updateUI();
            setTimeout(() => {
                STATE.phase = 'FIGHT_AIM'; document.getElementById('fight-target').style.display = 'block';
                setTimeout(executeStrike, 600);
            }, 500);
        }, 1000);
    }

    /** ⚔️ FIGHT SEQUENCE **/
    function executeStrike() {
        STATE.phase = 'ANIMATION'; document.getElementById('fight-target').style.display = 'none';
        const anim = document.getElementById('strike-anim');
        anim.style.opacity = '1'; setTimeout(() => anim.style.opacity = '0', 200);
        
        setTimeout(() => {
            const sans = document.getElementById('sans-container'), miss = document.getElementById('miss-text');
            sans.style.transform = 'translateX(-100px)'; miss.style.opacity = '1'; miss.style.top = '-10px';
            setTimeout(() => {
                sans.style.transform = 'translateX(-50%)'; miss.style.opacity = '0'; miss.style.top = '20px';
                sansSpeak("heh.", triggerAttackSequence);
            }, 1000);
        }, 100);
    }

    /** 🌀 CUSTOM ENEMY ATTACKS **/
    function triggerAttackSequence() {
        STATE.turn++; STATE.phase = 'ATTACK';
        elText.style.display = 'none'; elSub.style.display = 'none';
        STATE.soul.x = 275; STATE.soul.y = 60; elProj.innerHTML = '';
        
        if (STATE.turn === 1) attack1_AlternatingBouncers();
        else if (STATE.turn === 2) attack2_ZoneAndBlue();
        else attack3_PlatformsAndBlue();
    }

    // Turn 1: 10 Alternating Bones that jump up and down
    function attack1_AlternatingBouncers() {
        STATE.soul.gravity = false; document.getElementById('soul-svg').setAttribute('fill', 'red');
        sansSpeak("our reports showed a\nmassive anomaly in the\ntimespace continuum.");
        
        for (let i = 0; i < 10; i++) {
            setTimeout(() => {
                if (STATE.phase !== 'ATTACK') return;
                const isLeft = (i % 2 === 0);
                const b = document.createElement('div');
                b.className = 'bone'; b.style.width = '12px'; b.style.height = '40px';
                b.style.left = isLeft ? '-20px' : '580px';
                b.style.top = '20px';
                elProj.appendChild(b);
                
                let bx = isLeft ? -20 : 580;
                let by = 20, vY = 0;
                
                const int = setInterval(() => {
                    bx += isLeft ? 3 : -3; 
                    vY += 0.2; by += vY; // Bouncing physics
                    if (by >= 80) { by = 80; vY = -4; } // Bounce off "floor"
                    
                    b.style.left = bx + 'px'; b.style.top = by + 'px';
                    if ((isLeft && bx > 600) || (!isLeft && bx < -20) || STATE.phase !== 'ATTACK') { clearInterval(int); b.remove(); }
                }, 16);
            }, i * 600);
        }
        setTimeout(endTurn, 7000);
    }

    // Turn 2: Blue Bones Left->Right with Warning Zones Top/Bottom
    function attack2_ZoneAndBlue() {
        STATE.soul.gravity = false; document.getElementById('soul-svg').setAttribute('fill', 'red');
        sansSpeak("timelines jumping left\nand right, stopping\nand starting...");

        // Blue Bones L -> R
        for (let i = 0; i < 12; i++) {
            setTimeout(() => {
                if (STATE.phase !== 'ATTACK') return;
                const b = document.createElement('div');
                b.className = 'bone blue-bone'; b.style.width = '12px'; b.style.height = '80px';
                b.style.left = '-20px'; b.style.top = '25px';
                elProj.appendChild(b);
                let bx = -20;
                const int = setInterval(() => {
                    bx += 3.5; b.style.left = bx + 'px';
                    if (bx > 600 || STATE.phase !== 'ATTACK') { clearInterval(int); b.remove(); }
                }, 16);
            }, i * 500);
        }

        // Bone Zones Top/Bottom (5 times)
        for (let j = 0; j < 5; j++) {
            setTimeout(() => {
                if (STATE.phase !== 'ATTACK') return;
                const isTop = Math.random() > 0.5;
                const warn = document.createElement('div');
                warn.className = 'zone-warn'; warn.style.width = '100%'; warn.style.height = '40px';
                warn.style.left = '0'; warn.style.top = isTop ? '0' : '90px';
                elProj.appendChild(warn);

                setTimeout(() => {
                    warn.remove();
                    const thrust = document.createElement('div');
                    thrust.className = 'bone'; thrust.style.width = '100%'; thrust.style.height = '40px';
                    thrust.style.left = '0'; thrust.style.top = isTop ? '0' : '90px';
                    elProj.appendChild(thrust);
                    setTimeout(() => thrust.remove(), 400);
                }, 600); // 600ms warning
            }, j * 1200);
        }
        setTimeout(endTurn, 7000);
    }

    // Turn 3: Platforms + Blue Bones
    function attack3_PlatformsAndBlue() {
        STATE.soul.gravity = true; document.getElementById('soul-svg').setAttribute('fill', 'blue');
        sansSpeak("until suddenly,\neverything ends.");

        // Spawn 4 Platforms
        for (let i = 0; i < 6; i++) {
            setTimeout(() => {
                if (STATE.phase !== 'ATTACK') return;
                const p = document.createElement('div');
                p.className = 'bone platform'; p.style.width = '50px'; p.style.height = '10px';
                p.style.left = '580px'; p.style.top = (40 + Math.random() * 40) + 'px';
                p.dataset.vx = "-2"; // Speed attached for physics check
                elProj.appendChild(p);
                
                let px = 580;
                const int = setInterval(() => {
                    px -= 2; p.style.left = px + 'px';
                    if (px < -60 || STATE.phase !== 'ATTACK') { clearInterval(int); p.remove(); }
                }, 16);
            }, i * 1000);
        }

        // Tall Blue Bones moving fast
        for (let i = 0; i < 8; i++) {
            setTimeout(() => {
                if (STATE.phase !== 'ATTACK') return;
                const b = document.createElement('div');
                b.className = 'bone blue-bone'; b.style.width = '15px'; b.style.height = '100px';
                b.style.left = '580px'; b.style.bottom = '0px';
                elProj.appendChild(b);
                let bx = 580;
                const int = setInterval(() => {
                    bx -= 4; b.style.left = bx + 'px';
                    if (bx < -20 || STATE.phase !== 'ATTACK') { clearInterval(int); b.remove(); }
                }, 16);
            }, 800 + i * 800);
        }
        setTimeout(endTurn, 7000);
    }

    function endTurn() {
        STATE.phase = 'MENU'; STATE.currentMenu = 'MAIN';
        clearSansBubble(); elProj.innerHTML = '';
        
        if (STATE.owner === 'FRISK') friskThinkAndAct();
        else if (STATE.owner === 'CHARA') charaThinkAndFight();
        else typeFlavor("* Smells like bone dirt.");
    }

    /** 🎛️ UI & INPUT **/
    function updateUI() {
        if (STATE.currentMenu === 'MAIN') document.querySelectorAll('.btn').forEach((b,i) => b.classList.toggle('selected', i === STATE.menuIdx));
        else document.querySelectorAll('.sub-opt').forEach((opt,i) => opt.style.color = (i === STATE.subIdx ? 'var(--gold)' : '#fff'));
    }

    function openSubMenu(type) {
        STATE.currentMenu = 'SUB'; STATE.subIdx = 0; elText.style.display = 'none'; elSub.style.display = 'block';
        if (type === 'ACT') elSub.innerHTML = `<div class="sub-opt" style="color:var(--gold)">* Check</div><div class="sub-opt">* Talk</div>`;
        else if (type === 'MERCY') elSub.innerHTML = `<div class="sub-opt" style="color:var(--gold)">* Spare</div>`;
        else elSub.innerHTML = `<div class="sub-opt" style="color:var(--gold)">* No Items</div>`;
    }

    function executeSubMenu() {
        if (STATE.menuIdx === 1) { // ACT
            if (STATE.subIdx === 1) typeFlavor("* You try to talk to Sans.\n* He ignores you.", () => { sansSpeak("try harder next time.", triggerAttackSequence); });
            else typeFlavor("* SANS - 1 ATK 1 DEF\n* The easiest enemy.", () => { setTimeout(triggerAttackSequence, 1000); });
        } else if (STATE.menuIdx === 3) { // MERCY
            typeFlavor("* You are sparing Sans.", () => { sansSpeak("... yeah, ok.", triggerAttackSequence); });
        } else typeFlavor("* Nothing to use.", () => { setTimeout(triggerAttackSequence, 1000); });
    }

    function updateHUD() {
        document.getElementById('hp-fill').style.width = (STATE.hp / STATE.max * 100) + '%';
        document.getElementById('hp-text').innerText = `${Math.ceil(STATE.hp)} / ${STATE.max}`;
    }

    window.onkeydown = (e) => {
        STATE.keys[e.key] = true;
        if (e.key === 'q' || e.key === 'Q') toggleQ();
        if (STATE.owner === 'PLAYER' && STATE.phase === 'MENU') {
            if (STATE.currentMenu === 'MAIN') {
                if (e.key === 'ArrowLeft') STATE.menuIdx = (STATE.menuIdx + 3) % 4;
                if (e.key === 'ArrowRight') STATE.menuIdx = (STATE.menuIdx + 1) % 4;
                updateUI();
                if (e.key === 'z' || e.key === 'Z') {
                    if (STATE.menuIdx === 0) startFightBar();
                    else openSubMenu(STATE.menuIdx === 1 ? 'ACT' : STATE.menuIdx === 2 ? 'ITEM' : 'MERCY');
                }
            } else if (STATE.currentMenu === 'SUB') {
                if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') STATE.subIdx = (STATE.subIdx === 0 ? 1 : 0);
                if (e.key === 'x' || e.key === 'X') { STATE.currentMenu = 'MAIN'; elSub.style.display = 'none'; typeFlavor("* Sans is waiting."); }
                if (e.key === 'z' || e.key === 'Z') executeSubMenu();
                updateUI();
            }
        } else if (STATE.owner === 'PLAYER' && STATE.phase === 'FIGHT_AIM' && (e.key === 'z' || e.key === 'Z')) executeStrike();
    };
    window.onkeyup = (e) => STATE.keys[e.key] = false;

    // Start
