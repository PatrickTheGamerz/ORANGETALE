<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Underground Odyssey - 2D Adventure</title>
    <style>
        :root {
            --ut-white: #ffffff;
            --ut-red: #ff0000;
            --ut-yellow: #ffff00;
            --ut-bg: #000;
            --ut-blue: #00a2ff;
        }

        body {
            background-color: #222;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            border: 4px solid white;
            margin-top: 20px;
            background: black;
        }

        canvas {
            display: block;
        }

        /* Dialogue & Internal UI Overlay */
        #ui-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 740px;
            height: 180px;
            background: black;
            border: 4px solid white;
            padding: 15px;
            display: none; /* Hidden by default */
            z-index: 10;
        }

        #internal-view {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1a0505; /* Deep fleshy red */
            display: none; /* Hidden unless inside someone */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 20;
        }

        .choice-btn {
            background: black;
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-family: inherit;
        }

        .choice-btn:hover {
            color: var(--ut-yellow);
            border-color: var(--ut-yellow);
        }

        #stats-bar {
            width: 800px;
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #000;
            border: 2px solid #444;
            font-size: 1.2rem;
            color: var(--ut-yellow);
        }

        .internal-text {
            color: #ff99aa;
            font-size: 1.4rem;
            max-width: 80%;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div id="stats-bar">
    <span>❤️ FRISK</span>
    <span id="lv-display">LV: 1</span>
    <span id="loc-display">RUINS - HALLWAY</span>
</div>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="ui-overlay">
        <div id="dialogue-text" style="font-size: 1.2rem; margin-bottom: 20px;"></div>
        <div id="choice-container"></div>
    </div>

    <div id="internal-view">
        <div id="stage-title" style="font-weight: bold; color: yellow; margin-bottom: 10px;"></div>
        <div id="internal-description" class="internal-text"></div>
        <div id="internal-choices" style="margin-top: 30px;"></div>
    </div>
</div>

<div style="margin-top: 10px;">
    <button class="choice-btn" onclick="saveGame()">SAVE</button>
    <button class="choice-btn" onclick="loadGame()">LOAD</button>
    <button class="choice-btn" style="color:red" onclick="resetGame()">RESET</button>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const ui = document.getElementById('ui-overlay');
    const internalView = document.getElementById('internal-view');
    const diagText = document.getElementById('dialogue-text');
    const choiceCont = document.getElementById('choice-container');

    // --- GAME STATE ---
    let state = {
        x: 400, y: 300,
        lv: 1,
        inMenu: false,
        inInternal: false,
        currentHost: null,
        stage: 'mouth', // mouth, throat, stomach
        achievements: []
    };

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // --- CHARACTERS (NPCs) ---
    const npcs = [
        { name: "Toriel", x: 400, y: 100, color: "white", emoji: "🐐", msg: "Oh! Frisk, you look delicious... I mean, lonely!" },
        { name: "Muffet", x: 100, y: 400, color: "purple", emoji: "🕷️", msg: "Ufufu~ Care for some tea? You're the main ingredient!" },
        { name: "Undyne", x: 700, y: 150, color: "blue", emoji: "🐟", msg: "NGAAAH! Prepare to be assimilated into my strength!" },
        { name: "Bunny Lady", x: 150, y: 100, color: "pink", emoji: "🐰", msg: "Welcome to the shop! I have a special spot for you." }
    ];

    // --- CORE LOOP ---
    function update() {
        if (!state.inMenu && !state.inInternal) {
            if (keys['ArrowUp'] || keys['KeyW']) state.y -= 4;
            if (keys['ArrowDown'] || keys['KeyS']) state.y += 4;
            if (keys['ArrowLeft'] || keys['KeyA']) state.x -= 4;
            if (keys['ArrowRight'] || keys['KeyD']) state.x += 4;

            // Simple Collision with NPCs
            npcs.forEach(npc => {
                let dx = state.x - npc.x;
                let dy = state.y - npc.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 40) {
                    startDialogue(npc);
                }
            });
        }
        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Floor Details
        ctx.strokeStyle = "#333";
        for(let i=0; i<800; i+=50) ctx.strokeRect(i, 0, 1, 600);

        // Draw NPCs
        npcs.forEach(npc => {
            ctx.font = "40px Arial";
            ctx.fillText(npc.emoji, npc.x - 20, npc.y + 15);
            ctx.fillStyle = "white";
            ctx.font = "14px Courier New";
            ctx.fillText(npc.name, npc.x - 25, npc.y - 30);
        });

        // Draw Player (The Soul)
        ctx.fillStyle = "red";
        ctx.font = "30px Arial";
        ctx.fillText("❤️", state.x - 15, state.y + 10);
    }

    // --- INTERACTION LOGIC ---
    function startDialogue(npc) {
        state.inMenu = true;
        state.currentHost = npc;
        ui.style.display = "block";
        diagText.innerHTML = `* ${npc.msg}`;
        
        choiceCont.innerHTML = `
            <button class="choice-btn" onclick="startInternal()">[ACT] Offer Self</button>
            <button class="choice-btn" onclick="closeUI()">[MERCY] Run</button>
        `;
    }

    function closeUI() {
        state.inMenu = false;
        ui.style.display = "none";
        state.x += 50; // Push player away so dialogue doesn't loop
    }

    // --- INTERNAL SEQUENCE (The "Gulp" System) ---
    function startInternal() {
        state.inInternal = true;
        state.stage = 'mouth';
        ui.style.display = "none";
        internalView.style.display = "flex";
        updateInternalScene();
    }

    function updateInternalScene() {
        const host = state.currentHost.name;
        const desc = document.getElementById('internal-description');
        const title = document.getElementById('stage-title');
        const internalChoices = document.getElementById('internal-choices');

        internalChoices.innerHTML = "";

        if (state.stage === 'mouth') {
            title.innerText = `INSIDE ${host.toUpperCase()}'S MOUTH`;
            desc.innerHTML = `${host} gently takes you between her lips. Her <span style="color:pink">warm, wet tongue</span> begins soothing your body, slicking you with saliva as she prepares to swallow. It's incredibly tight and humid.`;
            
            addInternalChoice("Relax & Enjoy", () => { state.stage = 'throat'; updateInternalScene(); });
            addInternalChoice("Struggle Playfully", () => { state.stage = 'throat'; updateInternalScene(); });
        } 
        else if (state.stage === 'throat') {
            title.innerText = `THE DOWNWARD SLOW SWALLOW`;
            desc.innerHTML = `With a heavy, rhythmic <span style="color:white; font-weight:bold;">*GULP*</span>, you are pulled into the throat. The <span style="color:pink">muscular walls are incredibly tight</span>, massaging you slowly downward. Each pulse of her swallow pushes you deeper into the dark.`;
            
            addInternalChoice("Slide Deeper", () => { state.stage = 'stomach'; updateInternalScene(); });
        } 
        else if (state.stage === 'stomach') {
            title.innerText = `THE STOMACH OF ${host.toUpperCase()}`;
            desc.innerHTML = `You splash softly into the <span style="color:pink">pulsing, tight depths</span> of her stomach. The walls hug you from every side, vibrating with the sound of her heartbeat and satisfied hums. You are now part of her.`;
            
            addInternalChoice("[ACT] Rest Forever", () => finishEnding("PERMANENT RESIDENT"));
            addInternalChoice("[ACT] Absorb & LV UP", () => { state.lv++; finishEnding("SOUL ABSORPTION"); });
        }
    }

    function addInternalChoice(text, callback) {
        const btn = document.createElement('button');
        btn.className = "choice-btn";
        btn.innerText = text;
        btn.onclick = callback;
        document.getElementById('internal-choices').appendChild(btn);
    }

    function finishEnding(type) {
        alert(`ENDING REACHED: ${type}\nYour LV is now ${state.lv}`);
        state.inInternal = false;
        internalView.style.display = "none";
        state.inMenu = false;
        state.x = 400; state.y = 500; // Reset to safe spot
        document.getElementById('lv-display').innerText = `LV: ${state.lv}`;
    }

    // --- SAVE/LOAD ---
    function saveGame() {
        localStorage.setItem('undertale_2d_save', JSON.stringify(state));
        alert("GAME SAVED!");
    }

    function loadGame() {
        const saved = localStorage.getItem('undertale_2d_save');
        if (saved) {
            state = JSON.parse(saved);
            document.getElementById('lv-display').innerText = `LV: ${state.lv}`;
            alert("GAME LOADED!");
        }
    }

    function resetGame() {
        localStorage.clear();
        location.reload();
    }

    // Start Engine
    update();
</script>

</body>
</html>
