<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UT 3D: PACIFIST SANS ENCOUNTER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body { margin: 0; overflow: hidden; background: #000; font-family: 'VT323', monospace; color: white; user-select: none; }

        #ui-layer { position: absolute; inset: 0; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; }
        #top-hud { padding: 20px 40px; font-size: 36px; text-shadow: 2px 2px #000; display: flex; justify-content: space-between; }
        
        #dialogue-container { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); width: 550px; background: rgba(0,0,0,0.9); border: 4px solid white; border-radius: 10px; padding: 25px; font-size: 32px; display: none; text-align: center; line-height: 1.3; font-family: 'Comic Sans MS', 'VT323', sans-serif; text-transform: lowercase; }

        #narrative-box { position: absolute; bottom: 180px; left: 50%; transform: translateX(-50%); width: 760px; height: 160px; background: rgba(0,0,0,0.95); border: 4px solid white; padding: 20px 30px; font-size: 36px; display: block; pointer-events: auto; line-height: 1.4; }

        #bottom-ui { padding: 10px 40px 30px 40px; display: flex; flex-direction: column; align-items: center; background: rgba(0,0,0,0.95); border-top: 4px solid white; pointer-events: auto; }
        #stats-bar { display: flex; align-items: center; justify-content: space-between; font-size: 36px; margin-bottom: 20px; width: 800px; }
        #hp-container { display: flex; align-items: center; }
        .hp-box { width: 150px; height: 30px; background: red; margin: 0 15px; border: 2px solid #555; position: relative; }
        #hp-fill { height: 100%; background: #ffff00; width: 100%; transition: width 0.1s; }
        #controller-badge { color: #888; font-size: 28px; border: 2px solid #888; padding: 5px 15px; border-radius: 5px; }

        #action-buttons { display: flex; justify-content: space-between; width: 800px; }
        .action-btn { background: black; color: #ff8c00; border: 4px solid #ff8c00; width: 170px; height: 60px; font-size: 36px; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.1s; position: relative; pointer-events: auto; }
        .action-btn.active { background: #ffaa33; color: black; border-color: #ffaa33; }
        .action-btn.locked { pointer-events: none; border-color: #333; color: #333; }
        .soul-icon { display: none; position: absolute; left: 10px; color: #ff0000; font-size: 24px; }
        .action-btn.active .soul-icon { display: block; }

        #controls-hint { position: absolute; left: 20px; bottom: 380px; font-size: 24px; color: #fff; background: rgba(0,0,0,0.7); padding: 15px; border: 2px solid #555; line-height: 1.5;}

        #game-over { position: absolute; inset: 0; background: black; z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; }
        .go-text { font-size: 120px; letter-spacing: 5px; margin: 0; color: #fff; }
        .retry-btn { margin-top: 60px; font-size: 40px; background: none; color: white; border: 2px solid white; padding: 10px 30px; cursor: pointer; font-family: inherit; pointer-events: auto;}
        .retry-btn:hover { background: white; color: black; }
        
        #victory-screen { position: absolute; inset: 0; background: black; z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #damage-text { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); font-family: 'Arial', sans-serif; font-size: 80px; font-weight: bold; color: #fff; opacity: 0; z-index: 50; transition: opacity 0.5s, top 0.5s; }

        .zzz { position: absolute; color: white; font-size: 50px; font-family: 'Comic Sans MS'; opacity: 0; animation: floatZ 3s infinite; z-index: 20; font-weight: bold;}
        @keyframes floatZ { 0% { opacity: 0; transform: translate(0, 0) scale(0.5); } 50% { opacity: 1; transform: translate(30px, -60px) scale(1.2); } 100% { opacity: 0; transform: translate(60px, -120px) scale(1.5); } }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="top-hud">
        <span style="color: red;" id="hud-name">❤️ PLAYER</span>
        <span style="color: white;">LV 1</span>
    </div>
    <div id="dialogue-container"><div id="sans-dialogue">...</div></div>
    <div id="narrative-box"></div>
    <div id="controls-hint">[WASD] Move Arena<br>[SPACE] Jump<br>[Q] Tag Team Partner</div>

    <div id="bottom-ui">
        <div id="stats-bar">
            <div id="hp-container">
                <span>HP</span>
                <div class="hp-box"><div id="hp-fill"></div></div>
                <span id="hp-text">20 / 20</span>
            </div>
            <div id="controller-badge">CTRL: PLAYER</div>
        </div>
        <div id="action-buttons">
            <div class="action-btn" id="btn-0" onclick="handleMouseClick(0)"><span class="soul-icon">❤️</span>FIGHT</div>
            <div class="action-btn active" id="btn-1" onclick="handleMouseClick(1)"><span class="soul-icon">❤️</span>ACT</div>
            <div class="action-btn" id="btn-2" onclick="handleMouseClick(2)"><span class="soul-icon">❤️</span>ITEM</div>
            <div class="action-btn" id="btn-3" onclick="handleMouseClick(3)"><span class="soul-icon">❤️</span>MERCY</div>
        </div>
    </div>
</div>

<div id="damage-text">MISS</div>

<div id="game-over">
    <h1 class="go-text">GAME OVER</h1>
    <p style="font-size: 40px; color: #aaa; margin-top: 20px;">"stay determined, kiddo."</p>
    <button class="retry-btn" onclick="location.reload()">RETRY</button>
</div>

<div id="victory-screen">
    <h1 style="color:white; font-size: 60px; text-align: center;" id="vic-text">...</h1>
</div>

<div id="zzz-container" style="position:absolute; top:25%; left:50%; width:100px; height:100px; display:none; z-index:20;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // --- STATE MANAGEMENT ---
    const state = {
        hp: 20, maxHp: 20, turn: 0, 
        mode: "TYPING", // TYPING, MENU, DIALOGUE, DODGING, CUTSCENE
        menuIndex: 1, invuln: 0, globalTime: 0,
        playerVel: new THREE.Vector3(0, 0, 0),
        items: ["Spider Cider", "Spider Donut", "Snowman Piece"],
        isSleeping: false,
        teammate: localStorage.getItem('teammate') || 'FRISK',
        controller: 'PLAYER' 
    };

    const keys = {};
    window.addEventListener('keydown', e => { keys[e.code] = true; handleInput(e.code); });
    window.addEventListener('keyup', e => keys[e.code] = false);

    const buttons = [
        document.getElementById('btn-0'), document.getElementById('btn-1'), 
        document.getElementById('btn-2'), document.getElementById('btn-3')
    ];
    const navBox = document.getElementById('narrative-box');
    const badge = document.getElementById('controller-badge');
    const hudName = document.getElementById('hud-name');

    // --- DIALOGUE ---
    const sansScript = [
        "heya. let's just take it\neasy, alright?",
        "you've been busy, huh?\nhere, have some up-and-downs.",
        "watch your step.\nthe floor's getting tricky.",
        "slow and steady wins the race.\nor so they say.",
        "alright, i'm getting tired.\ntime for my special attack.",
        "...", 
        "yep. that's right.\nit's literally nothing.",
        "my fabled 'blue attack'.\ni'm just not gonna do anything."
    ];

    // --- 3D ENGINE ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.03);
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 20, 24); camera.lookAt(0, 0, 0);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight); document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x555555));
    const spotLight = new THREE.SpotLight(0xffffff, 1.5); spotLight.position.set(0, 30, 10); scene.add(spotLight);

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(36, 36), new THREE.MeshStandardMaterial({ color: 0x111111 }));
    floor.rotation.x = -Math.PI / 2; scene.add(floor);
    const gridHelper = new THREE.GridHelper(36, 18, 0x444444, 0x222222); gridHelper.position.y = 0.01; scene.add(gridHelper);

    // Entities
    const playerMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const player = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), playerMat); player.position.y = 0.6; scene.add(player);

    const sansGroup = new THREE.Group();
    const jacket = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 3.5, 16), new THREE.MeshStandardMaterial({ color: 0x0033ff })); jacket.position.y = 2.5; sansGroup.add(jacket);
    const head = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), new THREE.MeshStandardMaterial({color: 0xffffff})); head.position.y = 5.6; sansGroup.add(head);
    sansGroup.position.set(0, 0, -16); scene.add(sansGroup);

    // --- CUSTOM 3D BONE MESH ---
    function createBoneMesh(h, w, isBlue) {
        const group = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: isBlue ? 0x00ffff : 0xffffff, roughness: 0.4 });
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(w*0.3, w*0.3, Math.max(0.1, h - w), 12), mat);
        group.add(shaft);
        const r = w * 0.4; const offset = w * 0.35;
        [[-offset, h/2 - r, 0], [offset, h/2 - r, 0], [-offset, -h/2 + r, 0], [offset, -h/2 + r, 0]].forEach(pos => {
            const joint = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 12), mat);
            joint.position.set(pos[0], pos[1], pos[2]); group.add(joint);
        });
        return group;
    }

    let projectiles = [];
    let zones = [];

    function spawnBone(x, y, z, h, w, vx, vz, behavior = 'normal', isBlue = false) {
        const bone = createBoneMesh(h, w, isBlue);
        bone.position.set(x, y, z); scene.add(bone);
        projectiles.push({ mesh: bone, type: 'bone', vx, vz, vy: 0, isBlue, w, h, behavior, baseY: y });
    }

    function spawnWarningZone(x, z, w, d, duration) {
        const zone = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.4 }));
        zone.rotation.x = -Math.PI / 2; zone.position.set(x, 0.05, z); scene.add(zone);
        zones.push({ mesh: zone, timer: duration, w, d });
    }

    // --- TYPEWRITER ---
    function typeText(text, container, callback) {
        state.mode = "TYPING"; container.innerHTML = ''; let i = 0;
        function nextChar() {
            if(state.mode !== "TYPING") return; 
            if (i < text.length) {
                let char = text.charAt(i); container.innerHTML += (char === '\n') ? '<br>' : char; i++;
                let delay = (char === '.' || char === ',' || char === '?') ? 250 : 35;
                setTimeout(nextChar, delay);
            } else if(callback) setTimeout(callback, 800);
        }
        nextChar();
    }

    // --- INPUT & AI LOGIC ---
    function toggleTeammate() {
        if (state.mode === "CUTSCENE") return;
        if (state.controller === 'PLAYER') {
            state.controller = 'AI';
            badge.innerText = `CTRL: ${state.teammate}`; badge.style.borderColor = state.teammate === 'FRISK' ? '#ff00ff' : '#ff0000';
            hudName.innerText = `❤️ ${state.teammate}`; hudName.style.color = state.teammate === 'FRISK' ? '#ff00ff' : '#ff0000';
            buttons.forEach(b => b.classList.add('locked'));
            if(state.mode === "MENU" || state.mode === "TYPING") {
                typeText(`* ${state.teammate} takes the lead.`, navBox, () => { if (state.mode === "TYPING") state.mode = "MENU"; runAIMenu(); });
            }
        } else {
            state.controller = 'PLAYER';
            badge.innerText = `CTRL: PLAYER`; badge.style.borderColor = '#888';
            hudName.innerText = `❤️ PLAYER`; hudName.style.color = '#ff0000';
            buttons.forEach(b => b.classList.remove('locked'));
            if(state.mode === "MENU" || state.mode === "TYPING") {
                typeText(`* You take back control.`, navBox, () => { if (state.mode === "TYPING") state.mode = "MENU"; });
            }
        }
    }

    function handleInput(key) {
        if (key === 'KeyQ') { toggleTeammate(); return; }
        if (state.controller === 'PLAYER' && state.mode === "MENU") {
            if (key === 'ArrowLeft') updateMenuIndex((state.menuIndex + 3) % 4);
            if (key === 'ArrowRight') updateMenuIndex((state.menuIndex + 1) % 4);
            if (key === 'Enter' || key === 'Space' || key === 'KeyZ') executeMenuAction();
        } 
    }

    function handleMouseClick(idx) {
        if (state.controller !== 'PLAYER' || state.mode !== "MENU") return;
        updateMenuIndex(idx); executeMenuAction();
    }

    function updateMenuIndex(idx) {
        buttons[state.menuIndex].classList.remove('active'); state.menuIndex = idx; buttons[state.menuIndex].classList.add('active');
    }

    function runAIMenu() {
        if(state.controller !== 'AI' || state.mode !== "MENU") return;
        setTimeout(() => {
            if(state.teammate === 'FRISK') {
                if(state.items.length > 0 && state.hp <= 12) updateMenuIndex(2);
                else if(state.isSleeping) updateMenuIndex(3);
                else updateMenuIndex(1);
            } else updateMenuIndex(0); 
            setTimeout(executeMenuAction, 800);
        }, 800);
    }

    function executeMenuAction() {
        state.mode = "DIALOGUE"; 
        if (state.isSleeping) {
            if (state.menuIndex === 0) triggerFatalBlow();
            else if (state.menuIndex === 3) triggerMercyWin();
            return;
        }

        if (state.menuIndex === 0) {
            typeText(`* ${state.controller === 'AI' ? state.teammate : 'You'} swing the weapon.\n* Sans gently side-steps.`, navBox, () => {
                let dodgeInt = setInterval(() => { sansGroup.position.x += 1; if(sansGroup.position.x > 8) { clearInterval(dodgeInt); triggerSansDiag(); } }, 16);
            });
        } else if (state.menuIndex === 1) {
            typeText("* SANS - 1 ATK 1 DEF\n* He seems pretty relaxed.", navBox, triggerSansDiag);
        } else if (state.menuIndex === 2) {
            if (state.items.length > 0) {
                let item = state.items.shift(); state.hp = Math.min(state.maxHp, state.hp + 12); updateHUD();
                typeText(`* You consumed the ${item}.\n* HP recovered!`, navBox, triggerSansDiag);
            } else typeText("* Your pockets are empty.", navBox, triggerSansDiag);
        } else if (state.menuIndex === 3) {
            typeText("* You smile and spare Sans.\n* He winks back.", navBox, triggerSansDiag);
        }
    }

    function triggerSansDiag() {
        sansGroup.position.x = 0; 
        document.getElementById('dialogue-container').style.display = 'block'; navBox.style.display = 'none';
        
        let text = state.turn < sansScript.length ? sansScript[state.turn] : "Zzz...";
        if(state.turn >= 7) { state.isSleeping = true; startSleepingPhase(); return; }

        typeText(text, document.getElementById('sans-dialogue'), () => {
            document.getElementById('dialogue-container').style.display = 'none'; navBox.style.display = 'block'; navBox.innerHTML = "";
            startEnemyTurn();
        });
    }

    // --- DETAILED ATTACKS ---
    function startEnemyTurn() {
        state.mode = "DODGING"; playerMat.color.setHex(0x0033ff); 
        document.querySelectorAll('.soul-icon').forEach(icon => icon.style.color = '#0033ff');

        let tick = 0;
        const attackInt = setInterval(() => {
            if(tick > 45 + (state.turn * 10)) {
                clearInterval(attackInt); setTimeout(endTurn, 1000); return;
            }

            if (state.turn === 0) {
                // 1. 6 Bone Jumps (Full width gaps)
                if(tick % 8 === 0 && tick < 48) {
                    spawnBone(18, 0.5, player.position.z, 2, 28, -0.4, 0, 'normal'); // Ground sweeper to jump over
                }
            } 
            else if (state.turn === 1) {
                // 2. Up/Down Oscillating Bones
                if(tick % 5 === 0) {
                    let side = Math.random() > 0.5 ? 18 : -18;
                    spawnBone(side, 3, player.position.z + (Math.random()*6-3), 3, 1.5, side>0 ? -0.3 : 0.3, 0, 'sine');
                }
            }
            else if (state.turn === 2) {
                // 3. Bone Zones + Blue Bones
                if(tick % 15 === 0) spawnWarningZone(player.position.x, player.position.z, 8, 8, 20);
                if(tick % 10 === 0) spawnBone(18, 4, player.position.z, 8, 2, -0.5, 0, 'normal', true); // Blue sweeps
            }
            else if (state.turn === 3) {
                // 4. Slow Bone Sliders
                if(tick % 4 === 0) {
                    spawnBone(18, 1, Math.random()*20-10, 3, 1.5, -0.15, 0);
                    spawnBone(-18, 1, Math.random()*20-10, 3, 1.5, 0.15, 0);
                }
            }
            else if (state.turn === 4) {
                // 5. Special Attack (The Medley)
                if(tick === 2) {
                    // Two Bouncing Bones
                    spawnBone(15, 10, -5, 3, 1.5, -0.3, 0.1, 'bounce');
                    spawnBone(-15, 10, 5, 3, 1.5, 0.3, -0.1, 'bounce');
                }
                if(tick > 15 && tick % 6 === 0) spawnBone(18, 0.5, player.position.z, 2, 28, -0.4, 0); // Jumps
                if(tick > 30 && tick % 3 === 0) spawnBone(player.position.x, 0.5, -18, 1.5, 1.5, 0, 0.5); // Fast small
            }
            else if (state.turn === 5 || state.turn === 6) {
                // Fabled Blue Attack - Literally nothing happens
            }
            tick++;
        }, 150);
    }

    function endTurn() {
        state.mode = "MENU"; state.turn++; playerMat.color.setHex(0xff0000);
        document.querySelectorAll('.soul-icon').forEach(icon => icon.style.color = '#ff0000');
        
        typeText("* The battle continues.", navBox, () => { if(state.controller === 'AI') runAIMenu(); });
        player.position.set(0, 0.6, 0); state.playerVel.set(0,0,0);
        projectiles.forEach(p => scene.remove(p.mesh)); projectiles = [];
        zones.forEach(z => scene.remove(z.mesh)); zones = [];
    }

    // --- ENDINGS ---
    function startSleepingPhase() {
        state.mode = "MENU";
        typeText("* Sans is fast asleep.\n* He can't dodge anymore.", navBox, () => { if(state.controller === 'AI') runAIMenu(); });
        document.getElementById('zzz-container').style.display = 'block';
        setInterval(() => {
            const z = document.createElement('div'); z.className = 'zzz'; z.innerText = 'Z';
            document.getElementById('zzz-container').appendChild(z); setTimeout(() => z.remove(), 2900);
        }, 1000);
    }

    function triggerFatalBlow() {
        state.mode = "CUTSCENE"; navBox.style.display = 'none';
        const slash = new THREE.Mesh(new THREE.PlaneGeometry(15, 0.5), new THREE.MeshBasicMaterial({color: 0xff0000}));
        slash.position.set(0, 4, -14); slash.rotation.z = Math.PI / 6; scene.add(slash);

        const dmgText = document.getElementById('damage-text');
        dmgText.innerText = "9999999"; dmgText.style.color = "red"; dmgText.style.opacity = '1'; dmgText.style.top = '10%';

        setTimeout(() => {
            slash.visible = false; sansGroup.visible = false; 
            setTimeout(() => {
                document.getElementById('ui-layer').style.display = "none"; dmgText.style.display = 'none';
                const vic = document.getElementById('victory-screen'); vic.style.display = 'flex';
                document.getElementById('vic-text').innerHTML = "YOU WON.<br><span style='font-size:30px; color:gray'>You earned 99999 EXP.<br>Your LV increased.</span>";
            }, 2000);
        }, 500);
    }

    function triggerMercyWin() {
        state.mode = "CUTSCENE"; navBox.style.display = 'none';
        document.getElementById('dialogue-container').style.display = 'block';
        typeText("you're sparing me?\n... alright.\ni'm going to grillby's.", document.getElementById('sans-dialogue'), () => {
            document.getElementById('ui-layer').style.display = "none";
            const vic = document.getElementById('victory-screen'); vic.style.display = 'flex';
            document.getElementById('vic-text').innerHTML = "YOU WON.<br><span style='font-size:30px; color:gray'>You spared him.<br>Pacifist Route Secured.</span>";
        });
    }

    // --- PHYSICS & DODGING ---
    function takeDamage(amt) {
        if(state.invuln > 0 || state.mode !== "DODGING") return;
        state.hp -= amt; state.invuln = 30;
        playerMat.color.setHex(0xffaaaa); setTimeout(() => playerMat.color.setHex(0x0033ff), 200);

        if(state.hp <= 0) { state.mode = "GAMEOVER"; document.getElementById('game-over').style.display = 'flex'; }
        document.getElementById('hp-fill').style.width = Math.max(0, (state.hp / state.maxHp * 100)) + '%';
        document.getElementById('hp-text').innerText = `${Math.max(0, state.hp)} / ${state.maxHp}`;
        if(state.controller === 'AI' && Math.random() > 0.8) toggleTeammate(); // AI panic switch
    }

    function animate() {
        requestAnimationFrame(animate);
        state.globalTime += 0.05;
        if(state.invuln > 0) state.invuln--;

        if (state.mode === "DODGING") {
            const speed = 0.35; let isMovingHoriz = false;

            if (state.controller === 'PLAYER') {
                if(keys['KeyW'] || keys['ArrowUp']) { state.playerVel.z = -speed; isMovingHoriz = true; }
                else if(keys['KeyS'] || keys['ArrowDown']) { state.playerVel.z = speed; isMovingHoriz = true; }
                else state.playerVel.z = 0;

                if(keys['KeyA'] || keys['ArrowLeft']) { state.playerVel.x = -speed; isMovingHoriz = true; }
                else if(keys['KeyD'] || keys['ArrowRight']) { state.playerVel.x = speed; isMovingHoriz = true; }
                else state.playerVel.x = 0;

                if((keys['Space'] || keys['KeyZ']) && player.position.y <= 0.61) { state.playerVel.y = 0.6; isMovingHoriz = true; }
            } else {
                // Smart AI Dodging
                let nearestDist = 999, nearestProj = null;
                projectiles.forEach(p => {
                    let dist = Math.sqrt(Math.pow(p.mesh.position.x - player.position.x, 2) + Math.pow(p.mesh.position.z - player.position.z, 2));
                    if(dist < nearestDist) { nearestDist = dist; nearestProj = p; }
                });

                if(nearestProj && nearestDist < 7) {
                    if(nearestProj.isBlue) {
                        state.playerVel.x = 0; state.playerVel.z = 0; isMovingHoriz = false;
                    } else {
                        state.playerVel.z = (player.position.z < nearestProj.mesh.position.z) ? -speed : speed;
                        if(nearestProj.mesh.position.y < 2 && player.position.y <= 0.61) state.playerVel.y = 0.6;
                        isMovingHoriz = true;
                    }
                } else {
                    if(player.position.z < -1) state.playerVel.z = speed; else if(player.position.z > 1) state.playerVel.z = -speed; else state.playerVel.z = 0;
                    if(Math.abs(state.playerVel.z) > 0) isMovingHoriz = true;
                }
            }

            state.playerVel.y -= 0.04; player.position.add(state.playerVel);
            let isMovingOverall = isMovingHoriz || Math.abs(state.playerVel.y) > 0.1;

            if(player.position.y < 0.6) { player.position.y = 0.6; state.playerVel.y = 0; }
            player.position.x = Math.max(-15, Math.min(15, player.position.x));
            player.position.z = Math.max(-15, Math.min(15, player.position.z));

            // Zones
            for(let i = zones.length - 1; i >= 0; i--) {
                let z = zones[i]; z.timer--;
                if(z.timer <= 0) {
                    // Explode Zone
                    z.mesh.material.opacity = 1; z.mesh.material.color.setHex(0xffffff);
                    if(Math.abs(player.position.x - z.mesh.position.x) < z.w/2 && Math.abs(player.position.z - z.mesh.position.z) < z.d/2) takeDamage(2);
                    setTimeout(() => scene.remove(z.mesh), 200);
                    zones.splice(i, 1);
                }
            }

            // Projectiles
            for(let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.mesh.position.x += p.vx; p.mesh.position.z += p.vz;
                
                // Behaviors
                if (p.behavior === 'sine') p.mesh.position.y = p.baseY + Math.sin(state.globalTime * 2) * 2;
                else if (p.behavior === 'bounce') {
                    p.vy -= 0.02; p.mesh.position.y += p.vy;
                    if(p.mesh.position.y < p.h/2) { p.mesh.position.y = p.h/2; p.vy = Math.abs(p.vy) * 0.9; }
                }

                let hw = p.w / 2, hh = p.h / 2;
                if (player.position.x > p.mesh.position.x - hw - 0.6 && player.position.x < p.mesh.position.x + hw + 0.6 &&
                    player.position.z > p.mesh.position.z - hw - 0.6 && player.position.z < p.mesh.position.z + hw + 0.6 &&
                    player.position.y < p.mesh.position.y + hh + 0.6 && player.position.y > p.mesh.position.y - hh - 0.6) {
                    if(p.isBlue) { if(isMovingOverall) takeDamage(1); } else takeDamage(1);
                }

                if(Math.abs(p.mesh.position.x) > 22 || Math.abs(p.mesh.position.z) > 22) { scene.remove(p.mesh); projectiles.splice(i, 1); }
            }
        }

        if(state.isSleeping) sansGroup.position.y = Math.sin(Date.now() * 0.002) * 0.4; 
        else sansGroup.position.y = Math.sin(Date.now() * 0.005) * 0.2; 

        renderer.render(scene, camera);
    }

    typeText("* The wind is howling...", navBox); animate();
</script>
</body>
</html>
