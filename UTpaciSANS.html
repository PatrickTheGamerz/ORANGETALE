<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced MIDI Piano Player</title>
    <script src="https://unpkg.com/@tonejs/midi"></script>
    <style>
        body {
            background-color: #1a1a20;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            user-select: none;
            overflow: hidden;
        }

        h1 { margin-top: 30px; margin-bottom: 5px; }
        p { color: #abb2bf; margin-bottom: 20px; }

        .controls { 
            margin-bottom: 30px; 
            display: flex;
            gap: 15px;
            align-items: center;
            background: #222;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        input[type="file"] {
            font-size: 14px;
            color: #ccc;
        }

        input[type="file"]::file-selector-button {
            padding: 8px 16px;
            font-weight: bold;
            color: white;
            background-color: #ff5722;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        input[type="file"]::file-selector-button:hover { background-color: #e64a19; }

        /* Scrollable container for the massive keyboard */
        .piano-container {
            width: 95vw;
            overflow-x: auto;
            padding-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        .piano {
            display: flex;
            position: relative;
            background: #111;
            padding: 20px 10px 10px 10px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 5px 15px rgba(255,255,255,0.1);
        }

        .key {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 10px;
            font-weight: bold;
            font-size: 10px;
            cursor: pointer;
            border-radius: 0 0 5px 5px;
            transition: background 0.05s, box-shadow 0.05s;
        }

        .white {
            width: 35px;
            height: 200px;
            background: linear-gradient(to bottom, #fff 0%, #e0e0e0 100%);
            border: 1px solid #ccc;
            color: #555;
            z-index: 1;
            box-shadow: inset 0 -3px 5px rgba(0,0,0,0.2), 0 3px 5px rgba(0,0,0,0.3);
            margin: 0 1px;
        }

        .white.active {
            background: linear-gradient(to bottom, #e0e0e0 0%, #ff8a65 100%);
            height: 198px;
            margin-top: 2px;
        }

        .black {
            width: 22px;
            height: 120px;
            background: linear-gradient(to bottom, #333 0%, #000 100%);
            color: white;
            z-index: 2;
            margin-left: -12px;
            margin-right: -12px;
            box-shadow: inset 0 -3px 5px rgba(255,255,255,0.1), 0 3px 5px rgba(0,0,0,0.5);
        }

        .black.active {
            background: linear-gradient(to bottom, #222 0%, #e64a19 100%);
            height: 118px;
            margin-top: 2px;
        }
        
        #status { color: #ff5722; font-weight: bold; font-size: 14px;}
    </style>
</head>
<body>

    <h1>Universal MIDI Piano Player</h1>
    <p>Upload a Torby Brand .mid file (or any Synthesia track) to watch it play automatically.</p>

    <div class="controls">
        <input type="file" id="midiInput" accept=".mid,.midi">
        <div id="status">Waiting for file...</div>
    </div>

    <div class="piano-container" id="piano-container">
        <div class="piano" id="piano">
            </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // --- 1. GENERATE A MASSIVE 7-OCTAVE PIANO ---
        // MIDI notes 21 (A0) to 108 (C8) - A full grand piano!
        const pianoDiv = document.getElementById('piano');
        const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        
        for (let midi = 21; midi <= 108; midi++) {
            const noteName = notes[midi % 12];
            const octave = Math.floor(midi / 12) - 1;
            const isBlack = noteName.includes('#');
            
            const key = document.createElement('div');
            key.className = `key ${isBlack ? 'black' : 'white'}`;
            key.id = `midi-${midi}`;
            
            if (noteName === 'C') key.innerHTML = `<span>C${octave}</span>`;
            pianoDiv.appendChild(key);
        }

        // Center on Middle C
        window.onload = () => {
            const container = document.getElementById('piano-container');
            container.scrollLeft = (container.scrollWidth - container.clientWidth) / 2;
        };

        // --- 2. AUDIO ENGINE ---
        function playTone(midiNumber, startTime, duration) {
            const frequency = 440 * Math.pow(2, (midiNumber - 69) / 12);
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'triangle'; 
            oscillator.frequency.value = frequency;

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            // Audio envelope based on exact time in seconds
            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(0.5, startTime + 0.02); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration + 0.5); 

            oscillator.start(startTime);
            oscillator.stop(startTime + duration + 1);
        }

        // --- 3. THE MIDI FILE READER ---
        document.getElementById('midiInput').addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const status = document.getElementById('status');
            status.innerText = "Parsing MIDI data...";

            // Unlock audio context (browsers require user interaction to play sound)
            if (audioCtx.state === 'suspended') await audioCtx.resume();

            // Read the binary file
            const arrayBuffer = await file.arrayBuffer();
            
            // Convert it using Tone.js MIDI
            const midiData = new Midi(arrayBuffer);
            
            status.innerText = `Playing: ${midiData.name || file.name}`;
            
            const now = audioCtx.currentTime + 0.5; // Start half a second from now

            // Loop through every track (e.g., left hand, right hand)
            midiData.tracks.forEach(track => {
                // Loop through every note in the track
                track.notes.forEach(note => {
                    const eventStartTime = now + note.time; // note.time is exact seconds from start
                    const duration = note.duration; // exact seconds to hold note

                    // 1. Schedule Audio
                    playTone(note.midi, eventStartTime, duration);

                    // 2. Schedule Visuals
                    const keyElement = document.getElementById(`midi-${note.midi}`);
                    if (keyElement) {
                        const delayMs = (eventStartTime - audioCtx.currentTime) * 1000;
                        const durationMs = duration * 1000;
                        
                        setTimeout(() => keyElement.classList.add('active'), delayMs);
                        setTimeout(() => keyElement.classList.remove('active'), delayMs + durationMs);
                    }
                });
            });
        });
    </script>
</body>
</html>
