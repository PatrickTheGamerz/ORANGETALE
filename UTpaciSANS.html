<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI MINECRAFT: UNSPEAKABLE HORRORS</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        #ui { position: absolute; top: 20px; left: 20px; color: #f00; z-index: 100; text-shadow: 0 0 5px #f00; background: rgba(0,0,0,0.8); padding: 15px; border: 1px solid #f00; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: white; transform: translate(-50%, -50%); border-radius: 50%; }
        input { background: #111; color: #f00; border: 1px solid #f00; padding: 5px; margin-top: 10px; width: 100%; }
        #glitch-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: color-dodge; opacity: 0; background: cyan; z-index: 5; }
    </style>
</head>
<body>
    <div id="glitch-overlay"></div>
    <div id="ui">
        <h2 style="margin:0">AI VOID ENGINE v1.1</h2>
        <input type="password" id="apiKey" placeholder="ENTER API KEY TO START DREAM">
        <p id="status">STATUS: IDLE - CLICK SCREEN TO LOCK</p>
        <div id="ai-thought" style="font-size: 10px; color: #aaa; margin-top: 10px;">The AI is sleeping...</div>
    </div>
    <div id="crosshair"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let scene, camera, renderer, controls, clock;
        let blocks = [];
        let lastManifestYaw = 0;
        let isDreaming = false;

        const AI_PALETTES = [
            [0x222222, 0xff0000, 0x550000], // Horror
            [0x00ff00, 0x0000ff, 0xffffff], // Glitch
            [0xff00ff, 0x000000, 0x440044]  // Void
        ];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.Fog(0x000000, 1, 30);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);

            renderer = new THREE.WebGLRenderer({ antialias: false }); // No antialias = crunchier, more "AI" look
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new PointerLockControls(camera, document.body);
            document.addEventListener('click', () => controls.lock());

            clock = new THREE.Clock();

            // Initial generic world
            createInitialScaffold();
            animate();
        }

        function createInitialScaffold() {
            const geo = new THREE.BoxGeometry(1, 1, 1);
            for(let i=0; i<100; i++) {
                const mat = new THREE.MeshBasicMaterial({ color: 0x333333, wireframe: true });
                const b = new THREE.Mesh(geo, mat);
                b.position.set((Math.random()-0.5)*20, (Math.random()-0.5)*10, (Math.random()-0.5)*20);
                scene.add(b);
                blocks.push(b);
            }
        }

        async function triggerAIDream() {
            const key = document.getElementById('apiKey').value;
            if(!key) return;
            
            isDreaming = true;
            document.getElementById('ai-thought').innerText = "AI is rethinking reality...";
            document.getElementById('glitch-overlay').style.opacity = "0.3";

            // The AI "Decides" what the world becomes
            const system = "You are a corrupted AI inside Minecraft. Output ONLY 5 adjectives describing a horrifying distorted world state. e.g. 'Fleshy, Pulsing, Red, Infinite, Sharp'";

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: system }] }] })
                });
                const data = await res.json();
                const vision = data.candidates[0].content.parts[0].text;
                document.getElementById('ai-thought').innerText = "CURRENT HALLUCINATION: " + vision;
                
                manifestVision(vision);
            } catch (e) {
                console.error(e);
            } finally {
                setTimeout(() => { 
                    document.getElementById('glitch-overlay').style.opacity = "0";
                    isDreaming = false;
                }, 1000);
            }
        }

        function manifestVision(vision) {
            // Pick a palette based on AI "mood"
            const palette = AI_PALETTES[Math.floor(Math.random() * AI_PALETTES.length)];
            
            blocks.forEach((b, i) => {
                // If the block is behind the player, totally change it
                const vector = new THREE.Vector3();
                b.getWorldPosition(vector);
                vector.project(camera);

                if (vector.z > 1) { // Block is behind the frustum
                    b.material.color.setHex(palette[Math.floor(Math.random() * palette.length)]);
                    b.position.y += (Math.random() - 0.5) * 10;
                    b.scale.set(Math.random()*2, Math.random()*2, Math.random()*2);
                    b.material.wireframe = Math.random() > 0.5;
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            if (controls.isLocked) {
                // Detect "Look Back"
                const currentYaw = camera.rotation.y;
                if (Math.abs(currentYaw - lastManifestYaw) > 1.5 && !isDreaming) {
                    triggerAIDream();
                    lastManifestYaw = currentYaw;
                }

                // Make blocks pulse "unspeakably"
                blocks.forEach((b, i) => {
                    b.rotation.x += 0.01;
                    b.position.y += Math.sin(time + i) * 0.01;
                    if(isDreaming) {
                        b.position.x += (Math.random()-0.5) * 0.1;
                    }
                });
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
