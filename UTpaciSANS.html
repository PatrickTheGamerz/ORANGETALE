<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI OBSIDIAN: THE DREAM ENGINE</title>
    <style>
        :root { --glitch-red: #ff003c; --void-bg: #050505; }
        body { margin: 0; overflow: hidden; background: var(--void-bg); font-family: 'Consolas', monospace; color: white; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* UI Styling */
        #ui-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px; box-sizing: border-box; z-index: 100;
        }
        .panel {
            pointer-events: auto; background: rgba(0,0,0,0.85);
            border: 1px solid var(--glitch-red); padding: 15px; border-radius: 4px;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.3); width: 320px;
        }
        input, button {
            width: 100%; padding: 10px; margin-top: 10px; border-radius: 2px;
            border: 1px solid #444; background: #111; color: white; font-family: inherit;
        }
        button { 
            background: var(--glitch-red); color: white; border: none; font-weight: bold; 
            cursor: pointer; text-transform: uppercase;
        }
        button:hover { background: #ff2b5f; }
        
        #crosshair {
            position: fixed; top: 50%; left: 50%; width: 12px; height: 12px;
            border: 2px solid rgba(255,255,255,0.4); transform: translate(-50%, -50%);
            border-radius: 50%; pointer-events: none;
        }

        /* Glitch Effects */
        #vhs-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 2px);
            pointer-events: none; z-index: 5;
        }
        
        .diagnostics { font-size: 10px; color: #00ff00; margin-top: 10px; overflow: hidden; height: 60px; }
        .critical-error { color: var(--glitch-red); font-weight: bold; }
    </style>
</head>
<body>

    <div id="vhs-overlay"></div>
    <div id="crosshair"></div>

    <div id="ui-wrapper">
        <div class="panel" id="main-panel">
            <h2 style="margin:0; color:var(--glitch-red); font-style: italic;">VOID-WALKER v1.0</h2>
            <p style="font-size: 10px; color: #888;">NEURAL NETWORK WORLD MANIFESTATION</p>
            
            <input type="password" id="apiKey" placeholder="GEMINI_API_KEY">
            <input type="text" id="worldPrompt" placeholder="DREAM SEED (e.g. 'fleshy caves')">
            <button id="initBtn">INITIALIZE REALITY</button>
            
            <div class="diagnostics" id="logs">
                [SYSTEM] Awaiting API Key...<br>
                [SYSTEM] Renderer Ready.
            </div>
        </div>

        <div style="display: flex; justify-content: center;">
            <div class="panel" style="width: auto; padding: 10px 20px; text-align: center;">
                <span id="ai-status" style="color:#ff003c">AI STATUS: ASLEEP</span>
            </div>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- GLOBAL ENGINE STATE ---
        let scene, camera, renderer, controls, clock;
        let blocks = [];
        let instancedMesh;
        const CHUNK_SIZE = 16;
        const TOTAL_BLOCKS = 4096;
        const move = { fwd: false, bwd: false, lft: false, rgt: false, jump: false };
        let velocity = new THREE.Vector3();
        let lastManifestYaw = 0;
        let isProcessingAI = false;
        let currentWorldTheme = "Minecraft Classic";

        const log = (msg, isError = false) => {
            const div = document.getElementById('logs');
            div.innerHTML += `<br><span class="${isError ? 'critical-error' : ''}">[${new Date().toLocaleTimeString()}] ${msg}</span>`;
            div.scrollTop = div.scrollHeight;
        };

        // --- 1. CORE RENDERER SETUP ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            scene.fog = new THREE.Fog(0x050505, 5, 40);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(CHUNK_SIZE/2, 10, CHUNK_SIZE/2);

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new PointerLockControls(camera, document.body);
            document.addEventListener('click', () => { if(!isProcessingAI) controls.lock(); });

            const light = new THREE.PointLight(0xffffff, 50, 50);
            camera.add(light);
            scene.add(camera);

            clock = new THREE.Clock();

            createWorldShell();
            window.addEventListener('keydown', (e) => handleKey(e.code, true));
            window.addEventListener('keyup', (e) => handleKey(e.code, false));
            animate();
            log("Engine Online.");
        }

        // --- 2. THE AI NEURAL LAYER ---
        async function queryGemini(prompt) {
            const key = document.getElementById('apiKey').value;
            if(!key) { log("ERROR: API KEY MISSING", true); return null; }

            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { temperature: 1.0, topP: 0.95, maxOutputTokens: 1000 }
            };

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error.message || "Unknown API Error");
                }

                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            } catch (err) {
                log(`API REJECTION: ${err.message}`, true);
                return null;
            }
        }

        async function manifestReality() {
            if(isProcessingAI) return;
            isProcessingAI = true;
            document.getElementById('ai-status').innerText = "AI STATUS: DREAMING";
            log("Manifesting new reality slice...");

            const userTheme = document.getElementById('worldPrompt').value || "A glitchy, terrifying Minecraft void";
            const prompt = `You are the Dream Architect. Output ONLY a valid JSON block of 30 cubes.
            Each cube needs: {"x": coord, "y": coord, "z": coord, "color": hex_color, "scale": 0.5-3.0}.
            The world theme is: ${userTheme}. Respond only with the JSON.`;

            const aiResponse = await queryGemini(prompt);
            
            if(aiResponse) {
                try {
                    // Extract JSON from potential Markdown wrappers
                    const cleanJson = aiResponse.match(/\[.*\]/s)[0];
                    const blockData = JSON.parse(cleanJson);
                    
                    updateWorldFromAI(blockData);
                    log("Reality shift successful.");
                } catch (e) {
                    log("Failed to parse AI dream logic.", true);
                }
            }

            isProcessingAI = false;
            document.getElementById('ai-status').innerText = "AI STATUS: STABLE";
        }

        // --- 3. WORLD BUILDING & UPDATING ---
        function createWorldShell() {
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({ color: 0x222222, wireframe: true });
            
            // Initial scaffold
            for(let i=0; i<100; i++) {
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(
                    (Math.random()-0.5)*30, 
                    Math.random()*10, 
                    (Math.random()-0.5)*30
                );
                scene.add(mesh);
                blocks.push(mesh);
            }
        }

        function updateWorldFromAI(data) {
            // Smooth transition: Move existing blocks to new AI locations
            data.forEach((item, i) => {
                if(blocks[i]) {
                    const b = blocks[i];
                    b.position.set(item.x, item.y, item.z);
                    b.scale.setScalar(item.scale || 1);
                    b.material.color.set(item.color || 0xffffff);
                    b.material.wireframe = false;
                }
            });
        }

        // --- 4. PLAYER & PHYSICS ---
        function handleKey(code, state) {
            if(code === 'KeyW') move.fwd = state;
            if(code === 'KeyS') move.bwd = state;
            if(code === 'KeyA') move.lft = state;
            if(code === 'KeyD') move.rgt = state;
            if(code === 'Space') move.jump = state;
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (controls.isLocked) {
                // Movement
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 2.0 * delta; // Simple Gravity

                if (move.fwd) velocity.z += 50.0 * delta;
                if (move.bwd) velocity.z -= 50.0 * delta;
                if (move.lft) velocity.x -= 50.0 * delta;
                if (move.rgt) velocity.x += 50.0 * delta;

                controls.moveRight(velocity.x * delta);
                controls.moveForward(velocity.z * delta);
                camera.position.y += (velocity.y * delta);

                if (camera.position.y < 1.6) {
                    velocity.y = 0;
                    camera.position.y = 1.6;
                    if(move.jump) velocity.y = 10;
                }

                // --- 5. THE HORROR TRIGGER ---
                // Detect a "Quick Look Back"
                const currentYaw = camera.rotation.y;
                if (Math.abs(currentYaw - lastManifestYaw) > 2.0) {
                    manifestReality();
                    lastManifestYaw = currentYaw;
                }

                // Block drifting
                blocks.forEach((b, i) => {
                    b.position.y += Math.sin(clock.getElapsedTime() + i) * 0.005;
                });
            }

            renderer.render(scene, camera);
        }

        // Bootstrap
        document.getElementById('initBtn').onclick = () => {
            if(!scene) init();
            manifestReality();
        };

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
