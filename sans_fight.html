<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SANS FIGHT - PACIFIST</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        :root { --red: #ff0000; --gold: #ffcc00; --cyan: #00ffff; --blue: #3b82f6; --dust: #8a2be2; }
        body { background: #000; color: #fff; font-family: 'Press Start 2P', cursive; margin: 0; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }
        #game-frame { width: 900px; height: 750px; border: 4px solid #fff; position: relative; background: #000; }
        
        /* HUD */
        header { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-around; font-size: 14px; }
        #hp-bar-bg { display: inline-block; width: 100px; height: 15px; background: red; border: 1px solid #fff; vertical-align: middle; }
        #hp-bar-fill { height: 100%; background: var(--gold); transition: width 0.2s; }

        /* BATTLE BOX */
        #battle-box { position: absolute; bottom: 200px; left: 50%; transform: translateX(-50%); width: 350px; height: 180px; border: 5px solid #fff; background: #000; overflow: hidden; }
        #soul { width: 16px; height: 16px; position: absolute; z-index: 1000; }
        
        /* DIALOGUE */
        #dialogue { position: absolute; bottom: 200px; left: 50%; transform: translateX(-50%); width: 340px; height: 170px; background: #000; border: 4px solid #fff; padding: 15px; font-size: 18px; display: none; box-sizing: border-box; }

        /* MENU */
        #menu { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-around; }
        .btn { width: 160px; height: 50px; border: 3px solid #ffaa00; color: #ffaa00; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .btn.active { background: #ffaa00; color: #000; box-shadow: 0 0 15px #ffaa00; }

        /* ATTACKS */
        .bone { position: absolute; background: #fff; }
        .cyan-bone { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
        .blaster-beam { position: absolute; background: #fff; box-shadow: 0 0 20px #fff; opacity: 0; z-index: 50; }
    </style>
</head>
<body>

<div id="game-frame">
    <header>
        <div id="owner-tag" style="color:var(--cyan)">OWNER: PLAYER</div>
        <div>HP <div id="hp-bar-bg"><div id="hp-bar-fill" style="width:100%"></div></div> 56/56</div>
    </header>

    <div id="arena" style="height:400px; position:relative; text-align:center; padding-top:40px;">
        <div style="font-size:80px;">💀</div>
        <div id="battle-box"><div id="soul"><svg viewBox="0 0 32 32"><path id="soul-svg" d="M16,28.3L3.7,16c-2.3-2.3-2.3-6.1,0-8.5c2.3-2.3,6.1-2.3,8.5,0l3.8,3.8l3.8-3.8c2.3-2.3,6.1-2.3,8.5,0c2.3,2.3,2.3,6.1,0,8.5L16,28.3z" fill="red"/></svg></div></div>
        <div id="dialogue"></div>
    </div>

    <div id="menu">
        <div class="btn active" id="b0">FIGHT</div>
        <div class="btn" id="b1">ACT</div>
        <div class="btn" id="b2">ITEM</div>
        <div class="btn" id="b3">MERCY</div>
    </div>
</div>

<script>
    const STATE = {
        hp: 56, maxHp: 56, owner: 'PLAYER', phase: 'MENU',
        menuIdx: 0,
        soul: { x: 167, y: 82, vY: 0, gravity: false, isGrounded: false, invuln: 0, moving: false },
        keys: {}
    };

    const soul = document.getElementById('soul');
    const box = document.getElementById('battle-box');

    function update() {
        if (STATE.phase === 'ATTACK') {
            if (STATE.soul.invuln > 0) STATE.soul.invuln--;
            let oldX = STATE.soul.x, oldY = STATE.soul.y;
            let spd = 3.5;

            if (STATE.owner === 'PLAYER') {
                if (STATE.soul.gravity) {
                    if ((STATE.keys['ArrowUp'] || STATE.keys['z']) && STATE.soul.isGrounded) { STATE.soul.vY = -6; STATE.soul.isGrounded = false; }
                    STATE.soul.vY += 0.25; STATE.soul.y += STATE.soul.vY;
                } else {
                    if (STATE.keys['ArrowUp']) STATE.soul.y -= spd;
                    if (STATE.keys['ArrowDown']) STATE.soul.y += spd;
                }
                if (STATE.keys['ArrowLeft']) STATE.soul.x -= spd;
                if (STATE.keys['ArrowRight']) STATE.soul.x += spd;
            } else { friskAI(); }

            // 1:1 Box Clipping
            STATE.soul.x = Math.max(0, Math.min(box.clientWidth - 21, STATE.soul.x));
            STATE.soul.y = Math.max(0, Math.min(box.clientHeight - 21, STATE.soul.y));
            if (STATE.soul.y >= box.clientHeight - 21) { STATE.soul.y = box.clientHeight - 21; STATE.soul.vY = 0; STATE.soul.isGrounded = true; }
            else { STATE.soul.isGrounded = false; }

            STATE.soul.moving = (Math.abs(oldX - STATE.soul.x) > 0.1 || Math.abs(oldY - STATE.soul.y) > 0.1);
            soul.style.left = STATE.soul.x + 'px'; soul.style.top = STATE.soul.y + 'px';
        }
        requestAnimationFrame(update);
    }

    function friskAI() {
        const haz = document.querySelectorAll('.bone, .blaster-beam');
        haz.forEach(h => {
            const hR = h.getBoundingClientRect(), sR = soul.getBoundingClientRect();
            if (Math.abs(hR.left - sR.left) < 50) {
                STATE.soul.x += (sR.left < hR.left ? -2 : 2);
                if (STATE.soul.gravity && STATE.soul.isGrounded) STATE.soul.vY = -6;
            }
        });
    }

    function startTurn() {
        STATE.phase = 'ATTACK';
        const r = Math.random();
        if (r < 0.5) spawnSpiralBlasters(); else spawnBlueBoneWave();
        setTimeout(() => { 
            STATE.phase = 'MENU'; 
            STATE.soul.gravity = false;
            document.getElementById('soul-svg').setAttribute('fill', 'red');
            box.innerHTML = '<div id="soul">' + soul.innerHTML + '</div>';
        }, 6000);
    }

    function spawnSpiralBlasters() {
        for(let i=0; i<8; i++) {
            setTimeout(() => {
                const b = document.createElement('div');
                b.className = 'blaster-beam';
                b.style.left = '0px'; b.style.top = (i * 20) + 'px';
                b.style.width = '350px'; b.style.height = '30px';
                b.style.transform = `rotate(${i * 45}deg)`;
                box.appendChild(b);
                setTimeout(() => b.style.opacity = '1', 600);
                const hit = setInterval(() => checkCol(b, 5), 16);
                setTimeout(() => { clearInterval(hit); b.remove(); }, 1000);
            }, i * 600);
        }
    }

    function spawnBlueBoneWave() {
        STATE.soul.gravity = true;
        document.getElementById('soul-svg').setAttribute('fill', 'blue');
        for(let i=0; i<10; i++) {
            setTimeout(() => {
                const b = document.createElement('div');
                b.className = (i % 3 === 0) ? 'bone cyan-bone' : 'bone';
                b.style.width = '15px'; b.style.height = '50px';
                b.style.left = '350px'; b.style.bottom = '0px';
                box.appendChild(b);
                let x = 350;
                const m = setInterval(() => {
                    x -= 3; b.style.left = x + 'px';
                    checkCol(b, 2, i % 3 === 0);
                    if(x < -20) { clearInterval(m); b.remove(); }
                }, 16);
            }, i * 600);
        }
    }

    function checkCol(el, d, isBlue) {
        if (STATE.soul.invuln > 0) return;
        const sR = soul.getBoundingClientRect(), eR = el.getBoundingClientRect();
        if (!(sR.right < eR.left || sR.left > eR.right || sR.bottom < eR.top || sR.top > eR.bottom)) {
            if (isBlue && !STATE.soul.moving) return; // Blue Bone Logic
            STATE.hp -= 5; STATE.soul.invuln = 40;
            document.getElementById('hp-bar-fill').style.width = (STATE.hp/STATE.maxHp*100)+'%';
        }
    }

    window.onkeydown = (e) => {
        STATE.keys[e.key] = true;
        if(e.key === 'q') { STATE.owner = 'FRISK'; document.getElementById('owner-tag').innerText = "OWNER: FRISK"; }
        if(STATE.phase === 'MENU') {
            if(e.key === 'ArrowLeft') STATE.menuIdx = (STATE.menuIdx + 3) % 4;
            if(e.key === 'ArrowRight') STATE.menuIdx = (STATE.menuIdx + 1) % 4;
            document.querySelectorAll('.btn').forEach((b,i) => b.classList.toggle('active', i === STATE.menuIdx));
            if(e.key === 'z') startTurn();
        }
    };
    window.onkeyup = (e) => STATE.keys[e.key] = false;
    update();
</script>
</body>
</html>
